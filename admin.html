<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StealthCapital v1 | Admin Master</title>
    <style>
        :root { --bg: #050000; --card: #111; --accent: #ff4d00; --text: #eee; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; direction: ltr; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        input, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #444; }
        input { background: #000; color: #fff; width: 200px; }
        button { background: var(--accent); color: #000; font-weight: bold; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border-bottom: 1px solid #222; text-align: left; }
    </style>
</head>
<body>
    <h1>StealthCapital Admin Panel</h1>
    
    <div class="card">
        <h3>Market Control</h3>
        <label>Base USDT Rate (IRT): </label>
        <input type="number" id="base-rate" placeholder="e.g. 65000">
        <button onclick="admin.updateRate()">Update Global Rate</button>
    </div>

    <div class="card">
        <h3>User Management (Full-Custody)</h3>
        <input type="text" id="u-name" placeholder="User Name">
        <input type="number" id="u-irt" placeholder="IRT Balance">
        <input type="number" id="u-usdt" placeholder="USDT Balance">
        <button onclick="admin.addUser()">Add/Update User</button>
    </div>

    <div class="card">
        <h3>Vault Status</h3>
        <div id="vault-info">Loading...</div>
    </div>

    <div class="card">
        <h3>Live Logs</h3>
        <table>
            <thead><tr><th>User</th><th>Side</th><th>Qty</th><th>Total IRT</th></tr></thead>
            <tbody id="logs-ui"></tbody>
        </table>
    </div>

<script>
    const DB_URL = "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/.json";

    const admin = {
        db: { u: [], l: [], v: { irt: 0, usdt: 10000 }, r: 0 },

        async load() {
            const res = await fetch(DB_URL);
            const data = await res.json();
            if (data) this.db = data;
            this.render();
        },

        async save() {
            await fetch(DB_URL, { method: 'PUT', body: JSON.stringify(this.db) });
            this.render();
        },

        updateRate() {
            this.db.r = parseFloat(document.getElementById('base-rate').value);
            this.save();
        },

        addUser() {
            const name = document.getElementById('u-name').value;
            const irt = parseFloat(document.getElementById('u-irt').value) || 0;
            const usdt = parseFloat(document.getElementById('u-usdt').value) || 0;
            
            const idx = this.db.u.findIndex(x => x.name === name);
            if (idx > -1) {
                this.db.u[idx].irt = irt;
                this.db.u[idx].usdt = usdt;
            } else {
                this.db.u.push({ id: Date.now(), name, irt, usdt });
            }
            this.save();
        },

        render() {
            document.getElementById('vault-info').innerText = `USDT: ${this.db.v.usdt.toFixed(2)} | IRT: ${this.db.v.irt.toLocaleString()}`;
            document.getElementById('logs-ui').innerHTML = (this.db.l || []).reverse().map(x => `
                <tr><td>${x.user}</td><td>${x.side}</td><td>${x.qty}</td><td>${x.amt.toLocaleString()}</td></tr>
            `).join('');
        }
    };

    setInterval(() => admin.load(), 3000);
    admin.load();
</script>
</body>
</html>
