<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital Admin v1</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <style>
        :root { --fire-bg: #050000; --fire-card: #120a0a; --fire-border: #3d1414; --fire-accent: #ff4d00; --fire-glow: #ff8800; --fire-text: #ffe0e0; --success: #00ff88; --danger: #ff0044; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--fire-bg); color: var(--fire-text); height: 100vh; display: flex; overflow: hidden; direction: ltr; }
        aside { width: 280px; background: #120a0a; border-right: 1px solid var(--fire-border); display: flex; flex-direction: column; padding: 25px; flex-shrink: 0; }
        .brand h1 { font-size: 1.4rem; color: var(--fire-accent); text-align: center; margin-bottom: 30px; text-shadow: 0 0 10px var(--fire-accent); font-weight: 900; }
        .nav-link { padding: 12px; border-radius: 8px; cursor: pointer; color: #855; transition: 0.3s; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .nav-link.active { background: rgba(255, 77, 0, 0.1); color: var(--fire-accent); border: 1px solid var(--fire-accent); }
        .inf-monitor { background: #1a0505; border: 1px solid var(--fire-border); border-radius: 12px; padding: 15px; margin-top: auto; }
        .m-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 5px; }
        .m-total { border-top: 1px solid var(--fire-border); margin-top: 10px; padding-top: 10px; text-align: center; }
        .m-total b { color: var(--fire-glow); font-size: 1.1rem; }
        main { flex-grow: 1; overflow-y: auto; padding: 30px; }
        .inf-card { background: var(--fire-card); border: 1px solid var(--fire-border); border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        label { display: block; color: #855; font-size: 0.7rem; margin-top: 10px; text-transform: uppercase; }
        input, select { width: 100%; background: #000; border: 1px solid var(--fire-border); padding: 10px; border-radius: 5px; color: #fff; margin-top: 5px; }
        .btn-fire { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: 900; cursor: pointer; background: linear-gradient(45deg, #ff4d00, #ff8800); color: #000; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px; color: #855; font-size: 0.75rem; border-bottom: 1px solid var(--fire-border); }
        td { padding: 12px 10px; border-bottom: 1px solid #1a0505; font-size: 0.85rem; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        #status-bar { font-size: 0.7rem; text-align: center; padding: 5px; margin-bottom: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<aside>
    <div class="brand"><h1>StealthCapital</h1></div>
    <div id="status-bar" style="background: #2a0a0a; color: #f40;">Connecting...</div>
    <nav>
        <div class="nav-link active" onclick="tab(event, 'desk')"><i class="fas fa-bolt"></i> Terminal</div>
        <div class="nav-link" onclick="tab(event, 'crm')"><i class="fas fa-users"></i> Clients</div>
        <div class="nav-link" onclick="tab(event, 'logs')"><i class="fas fa-list"></i> History</div>
        <div class="nav-link" onclick="tab(event, 'config')"><i class="fas fa-user-shield"></i> Vault</div>
    </nav>
    <div class="inf-monitor">
        <div class="m-row"><span>Vault USDT:</span><b id="mon-usdt">0</b></div>
        <div class="m-row"><span>Vault IRT:</span><b id="mon-irt">0</b></div>
        <div class="m-total"><small>TOTAL VALUE</small><br><b id="mon-total">0 IRT</b></div>
    </div>
</aside>

<main>
    <section id="desk" class="tab-content active">
        <div class="grid">
            <div class="inf-card"><h4>Performance</h4><div style="height: 300px;"><canvas id="profitChart"></canvas></div></div>
            <div class="inf-card">
                <h4>Execution</h4>
                <label>Client</label><select id="tx-user"></select>
                <label>Side</label><select id="tx-side"><option value="buy">Buy</option><option value="sell">Sell</option></select>
                <label>Amount (Toman)</label><input type="text" id="tx-amount" oninput="fmt(this)">
                <button class="btn-fire" onclick="engineExecute()">Process Trade</button>
            </div>
        </div>
    </section>

    <section id="crm" class="tab-content">
        <div class="grid">
            <div class="inf-card"><h4>Clients</h4><div id="crm-ui"></div></div>
            <div class="inf-card">
                <h4>Registration</h4>
                <label>Name</label><input type="text" id="reg-name">
                <label>Phone</label><input type="text" id="reg-phone">
                <button class="btn-fire" onclick="engineAddUser()">Register</button>
            </div>
        </div>
    </section>

    <section id="logs" class="tab-content">
        <div class="inf-card"><h4>Ledger</h4><table><thead><tr><th>Time</th><th>User</th><th>Side</th><th>USDT</th><th>IRT</th></tr></thead>
        <tbody id="logs-ui"></tbody></table></div>
    </section>

    <section id="config" class="tab-content">
        <div class="grid">
            <div class="inf-card">
                <h4>Sync Vault</h4>
                <label>Vault IRT</label><input type="text" id="v-irt" oninput="fmt(this)">
                <label>Vault USDT</label><input type="text" id="v-usdt">
                <button class="btn-fire" onclick="engineSync()">Sync</button>
            </div>
            <div class="inf-card">
                <h4>Rates</h4>
                <label>Ceiling</label><input type="text" id="cal-h" oninput="fmt(this)">
                <label>Floor</label><input type="text" id="cal-l" oninput="fmt(this)">
                <button class="btn-fire" onclick="engineCalibrate()">Apply Rate</button>
            </div>
        </div>
    </section>
</main>

<script>
    const DB_URL = "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/.json";
    let db = { u: [], l: [], v: { irt: 0, usdt: 0 }, r: 0 };
    let chart;
    let isInitialLoad = true;

    const n = (v) => parseFloat(String(v).replace(/,/g, '')) || 0;
    const fmt = (el) => { let v = el.value.replace(/\D/g, ""); el.value = v ? Number(v).toLocaleString() : ""; };
    const loc = (v) => Math.floor(v || 0).toLocaleString();

    async function fetchData() {
        try {
            const res = await fetch(DB_URL);
            const data = await res.json();
            if (data) {
                db = data;
                if (!db.u) db.u = [];
                if (!db.l) db.l = [];
                document.getElementById('status-bar').innerText = "ONLINE";
                document.getElementById('status-bar').style.color = "#0f8";
            }
            render();
            isInitialLoad = false;
        } catch (e) {
            document.getElementById('status-bar').innerText = "OFFLINE - RECONNECTING";
            document.getElementById('status-bar').style.color = "#f40";
        }
    }

    async function pushData() {
        if (isInitialLoad) return;
        await fetch(DB_URL, { method: 'PUT', body: JSON.stringify(db) });
        render();
    }

    function tab(e, id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(id).classList.add('active'); e.currentTarget.classList.add('active');
    }

    function engineCalibrate() {
        const h = n(document.getElementById('cal-h').value);
        const l = n(document.getElementById('cal-l').value);
        if(h > l) { db.r = l + ((h - l) * 0.75); pushData(); }
    }

    function engineAddUser() {
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;
        if(name && phone) { db.u.push({ id: Date.now(), name, phone, usdt: 0 }); pushData(); }
    }

    function engineSync() {
        db.v.irt = n(document.getElementById('v-irt').value);
        db.v.usdt = n(document.getElementById('v-usdt').value);
        pushData();
    }

    function engineExecute() {
        const uid = document.getElementById('tx-user').value;
        const side = document.getElementById('tx-side').value;
        const amt = n(document.getElementById('tx-amount').value);
        const uIdx = db.u.findIndex(u => u.id == uid);
        if(uIdx === -1 || !db.r) return;

        const rate = side === 'buy' ? db.r * 1.0075 : db.r * 0.9925;
        const qty = amt / rate;

        if(side === 'buy') { db.v.usdt -= qty; db.v.irt += amt; db.u[uIdx].usdt += qty; }
        else { db.u[uIdx].usdt -= qty; db.v.usdt += qty; db.v.irt -= amt; }

        db.l.push({ time: new Date().toLocaleTimeString(), user: db.u[uIdx].name, side, qty, amt });
        pushData();
    }

    function render() {
        document.getElementById('mon-usdt').innerText = db.v.usdt.toFixed(2);
        document.getElementById('mon-irt').innerText = loc(db.v.irt);
        document.getElementById('mon-total').innerText = loc((db.v.usdt * db.r) + db.v.irt);

        const uSel = document.getElementById('tx-user');
        uSel.innerHTML = db.u.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
        
        document.getElementById('crm-ui').innerHTML = db.u.map(u => `
            <div class="inf-card" style="margin-bottom:5px; background:#000;">
                <b>${u.name}</b>: ${u.usdt.toFixed(2)} USDT
            </div>`).join('');

        document.getElementById('logs-ui').innerHTML = db.l.slice(-10).reverse().map(l => `
            <tr><td>${l.time}</td><td>${l.user}</td><td>${l.side}</td><td>${l.qty.toFixed(2)}</td><td>${loc(l.amt)}</td></tr>
        `).join('');
    }

    setInterval(fetchData, 3000);
    window.onload = fetchData;
</script>
</body>
</html>
