<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital v1 | Secure Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <style>
        :root { --fire-bg: #050000; --fire-card: #120a0a; --fire-border: #3d1414; --fire-accent: #ff4d00; --fire-text: #ffe0e0; }
        body { background: var(--fire-bg); color: var(--fire-text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; }
        aside { width: 280px; background: #120a0a; border-right: 1px solid var(--fire-border); padding: 25px; display: flex; flex-direction: column; }
        main { flex-grow: 1; padding: 30px; overflow-y: auto; background: radial-gradient(circle at top, #1a0808 0%, #050000 100%); }
        .inf-card { background: var(--fire-card); border: 1px solid var(--fire-border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        input, select { width: 100%; background: #000; border: 1px solid var(--fire-border); padding: 12px; border-radius: 6px; color: #fff; margin: 10px 0; }
        .btn-fire { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: linear-gradient(45deg, #ff4d00, #ff8800); color: #000; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        #log-list { font-size: 0.8rem; line-height: 1.6; }
    </style>
</head>
<body>

<aside>
    <h2 style="color:var(--fire-accent); text-align:center;">StealthCapital</h2>
    <div id="conn-status" style="font-size:0.7rem; text-align:center; margin-bottom:20px;">
        <span class="status-dot" style="background:gray;"></span> Checking Connection...
    </div>
    <div class="inf-card">
        <small>Vault Balance</small>
        <div id="v-disp" style="font-weight:bold; color:#ff8800; margin-top:5px;">Loading...</div>
    </div>
</aside>

<main>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
        <div class="inf-card">
            <h3>Price Calibration</h3>
            <input type="number" id="inp-h" placeholder="High (Ceiling)">
            <input type="number" id="inp-l" placeholder="Low (Floor)">
            <button class="btn-fire" onclick="updateRate()">Apply 75% Rule</button>
        </div>

        <div class="inf-card">
            <h3>Register Client</h3>
            <input type="text" id="reg-n" placeholder="Client Name">
            <input type="text" id="reg-p" placeholder="Phone Number">
            <button class="btn-fire" onclick="addUser()">Secure Add</button>
        </div>
    </div>

    <div class="inf-card">
        <h3>Live Ledger & Users</h3>
        <div id="user-list"></div>
        <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
        <div id="log-list"></div>
    </div>
</main>

<script>
    // استفاده از آدرس دقیق دیتابیس شما
    const BASE_URL = "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/";
    let localData = { u: [], l: [], v: { irt: 0, usdt: 0 }, r: 0 };

    // ۱. دریافت اطلاعات بدون خطر پاک شدن
    async function sync() {
        try {
            const res = await fetch(BASE_URL + ".json");
            const data = await res.json();
            if (data) {
                localData = data;
                renderUI();
                setStatus(true);
            }
        } catch (e) { setStatus(false); }
    }

    // ۲. ارسال اطلاعات به روش امن PATCH (فقط تغییرات را بفرست)
    async function safeSave(path, payload) {
        try {
            await fetch(BASE_URL + path + ".json", {
                method: 'PATCH',
                body: JSON.stringify(payload)
            });
            sync(); // بعد از ذخیره، دوباره هماهنگ کن
        } catch (e) { alert("Save Failed! Check Connection."); }
    }

    function setStatus(online) {
        const dot = document.querySelector('.status-dot');
        dot.style.background = online ? '#0f8' : '#f40';
        document.getElementById('conn-status').innerText = online ? "SYSTEM ONLINE" : "CONNECTION LOST";
    }

    function updateRate() {
        const h = parseFloat(document.getElementById('inp-h').value);
        const l = parseFloat(document.getElementById('inp-l').value);
        if (h > l) {
            const newRate = l + ((h - l) * 0.75);
            safeSave("", { r: newRate });
        }
    }

    function addUser() {
        const name = document.getElementById('reg-n').value;
        const phone = document.getElementById('reg-p').value;
        if (name && phone) {
            const newUser = { id: Date.now(), name, phone, usdt: 0 };
            const updatedUsers = localData.u ? [...localData.u, newUser] : [newUser];
            safeSave("", { u: updatedUsers });
            document.getElementById('reg-n').value = '';
            document.getElementById('reg-p').value = '';
        }
    }

    function renderUI() {
        // نمایش موجودی خزانه
        const v = localData.v || { irt: 0, usdt: 0 };
        document.getElementById('v-disp').innerHTML = `${v.usdt.toLocaleString()} USDT <br> ${v.irt.toLocaleString()} IRT`;
        
        // نمایش لیست کاربران
        const uList = document.getElementById('user-list');
        uList.innerHTML = "<h4>Active Clients:</h4>" + (localData.u || []).map(u => 
            `<div style="font-size:0.9rem; margin:5px 0;">👤 ${u.name} | Balance: ${u.usdt} USDT</div>`
        ).join('');

        // نمایش لاگ تراکنش‌ها
        const lList = document.getElementById('log-list');
        lList.innerHTML = "<h4>Recent Logs:</h4>" + (localData.l || []).slice(-5).reverse().map(l => 
            `<div>[${l.time}] ${l.user}: ${l.side} ${l.qty} USDT</div>`
        ).join('');
    }

    // شروع و تکرار برای زنده بودن سیستم
    sync();
    setInterval(sync, 3000);
</script>
</body>
</html>
