<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StealthCapital | Trading Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --bg: #050000; --card: #0f0f0f; --accent: #ff4d00; --success: #00ff88; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; direction: ltr; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #222; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box;}
        .btn { width: 100%; padding: 15px; background: var(--accent); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #login-overlay { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div style="text-align: center;">
        <h2 style="color:var(--accent)">StealthCapital v1</h2>
        <input type="text" id="login-name" placeholder="Enter Account Name">
        <button class="btn" onclick="userApp.login()">Login</button>
    </div>
</div>

<div class="stat-grid">
    <div class="card"><small>USDT BALANCE</small><h2 id="u-usdt">0.00</h2></div>
    <div class="card"><small>IRT BALANCE</small><h2 id="u-irt">0</h2></div>
</div>

<div class="card">
    <h3>Quick Trade</h3>
    <div style="display:flex; justify-content: space-between; margin-bottom: 10px;">
        <span style="color:var(--success)">Buy: <b id="rate-ask">0</b></span>
        <span style="color:#ff4444">Sell: <b id="rate-bid">0</b></span>
    </div>
    <select id="t-side">
        <option value="buy">BUY USDT (Use IRT)</option>
        <option value="sell">SELL USDT (Get IRT)</option>
    </select>
    <input type="number" id="t-qty" placeholder="Amount in USDT">
    <button class="btn" onclick="userApp.trade()">Confirm Trade</button>
</div>

<script>
    const DB_URL = "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/.json";

    const userApp = {
        user: null,
        db: null,

        async load() {
            const res = await fetch(DB_URL);
            this.db = await res.json();
            if (this.user) this.render();
        },

        login() {
            const name = document.getElementById('login-name').value;
            const u = this.db.u.find(x => x.name === name);
            if (u) {
                this.user = u;
                document.getElementById('login-overlay').style.display = 'none';
                this.render();
            } else { alert("User not found!"); }
        },

        async trade() {
            const side = document.getElementById('t-side').value;
            const qty = parseFloat(document.getElementById('t-qty').value);
            const rate = side === 'buy' ? this.db.r * 1.0075 : this.db.r * 0.9925;
            const totalIRT = qty * rate;

            const uIdx = this.db.u.findIndex(x => x.id === this.user.id);
            const user = this.db.u[uIdx];

            if (side === 'buy') {
                if (user.irt < totalIRT) return alert("Insufficient IRT");
                this.db.u[uIdx].irt -= totalIRT;
                this.db.u[uIdx].usdt += qty;
            } else {
                if (user.usdt < qty) return alert("Insufficient USDT");
                this.db.u[uIdx].usdt -= qty;
                this.db.u[uIdx].irt += totalIRT;
            }

            if(!this.db.l) this.db.l = [];
            this.db.l.push({ user: user.name, side, qty, amt: totalIRT, time: new Date().toLocaleString() });
            
            await fetch(DB_URL, { method: 'PUT', body: JSON.stringify(this.db) });
            alert("Trade Success!");
            this.load();
        },

        render() {
            const u = this.db.u.find(x => x.id === this.user.id);
            document.getElementById('u-usdt').innerText = u.usdt.toFixed(2);
            document.getElementById('u-irt').innerText = Math.floor(u.irt).toLocaleString();
            document.getElementById('rate-ask').innerText = Math.floor(this.db.r * 1.0075).toLocaleString();
            document.getElementById('rate-bid').innerText = Math.floor(this.db.r * 0.9925).toLocaleString();
        }
    };

    setInterval(() => userApp.load(), 3000);
    userApp.load();
</script>
</body>
</html>
