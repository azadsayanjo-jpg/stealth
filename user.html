<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital | User Terminal v1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <style>
        :root {
            --bg: #050000;
            --card: #0f0f0f;
            --border: #222;
            --accent: #ff4d00;
            --success: #00ff88;
            --danger: #ff0044;
            --text: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); direction: ltr; display: flex; height: 100vh; overflow: hidden; }

        aside { width: 260px; background: #0a0a0a; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
        .logo { color: var(--accent); font-weight: 900; font-size: 1.5rem; text-align: center; margin-bottom: 40px; }
        
        .nav-item { padding: 12px 15px; border-radius: 10px; cursor: pointer; color: #666; transition: 0.3s; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
        .nav-item:hover { background: #151515; color: #fff; }
        .nav-item.active { background: rgba(255, 77, 0, 0.1); color: var(--accent); border: 1px solid rgba(255, 77, 0, 0.3); }

        main { flex: 1; overflow-y: auto; padding: 40px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }

        .dashboard-header { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 16px; position: relative; }
        .stat-card small { color: #666; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card h2 { font-size: 1.8rem; margin-top: 10px; font-weight: 800; color: #fff; }
        .stat-card i { position: absolute; top: 20px; right: 20px; color: #222; font-size: 1.5rem; }

        .action-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 25px; }
        .glass-card { background: var(--card); border: 1px solid var(--border); padding: 25px; border-radius: 20px; }
        
        label { display: block; margin-top: 15px; font-size: 0.75rem; color: #888; margin-bottom: 5px; }
        input, select { width: 100%; background: #000; border: 1px solid var(--border); padding: 14px; border-radius: 10px; color: #fff; font-size: 1rem; outline: none; }
        
        .btn-action { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; margin-top: 20px; transition: 0.3s; text-transform: uppercase; background: linear-gradient(45deg, var(--accent), #ff8800); color: #000; }
        .btn-action:hover { box-shadow: 0 0 20px rgba(255, 77, 0, 0.4); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: #555; font-size: 0.75rem; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        td { padding: 15px 0; border-bottom: 1px solid #111; font-size: 0.85rem; }

        #login-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { width: 350px; text-align: center; }

        .toast { position: fixed; bottom: 30px; right: 30px; padding: 15px 30px; border-radius: 10px; display: none; z-index: 10000; font-weight: bold; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="toast" class="toast"></div>

<div id="login-overlay">
    <div class="login-box">
        <h1 style="color:var(--accent); margin-bottom:10px;">StealthCapital</h1>
        <p style="color:#666; margin-bottom:30px;">User Authentication Required</p>
        <input type="text" id="login-id" placeholder="Enter Account ID">
        <button class="btn-action" onclick="app.login()">Sign In</button>
    </div>
</div>

<aside>
    <div class="logo">STEALTH V1</div>
    <div class="nav-item active" onclick="app.tab('dash')"><i class="fas fa-wallet"></i> My Assets</div>
    <div class="nav-item" onclick="app.tab('trade')"><i class="fas fa-exchange-alt"></i> Exchange</div>
    <div class="nav-item" style="margin-top:auto; color: #f44;" onclick="location.reload()"><i class="fas fa-power-off"></i> Logout</div>
</aside>

<main>
    <div id="dash" class="tab-content active">
        <div class="dashboard-header">
            <div class="stat-card">
                <small>USDT Balance</small>
                <h2 id="st-usdt">0.00</h2>
                <i class="fas fa-coins"></i>
            </div>
            <div class="stat-card">
                <small>Toman (IRT) Balance</small>
                <h2 id="st-irt">0</h2>
                <i class="fas fa-money-bill-wave"></i>
            </div>
        </div>

        <div class="glass-card">
            <h4>Trade History</h4>
            <table>
                <thead><tr><th>Time</th><th>Side</th><th>Amount</th><th>Price (IRT)</th></tr></thead>
                <tbody id="history-ui"></tbody>
            </table>
        </div>
    </div>

    <div id="trade" class="tab-content">
        <div class="action-grid">
            <div class="glass-card">
                <h3>Trade Terminal</h3>
                <label>Action</label>
                <select id="tr-side">
                    <option value="buy">Buy USDT (Use my IRT)</option>
                    <option value="sell">Sell USDT (Get IRT)</option>
                </select>
                <label>Amount (USDT)</label>
                <input type="number" id="tr-qty" placeholder="0.00" step="0.01">
                <div id="tr-calc" style="margin-top:15px; color:var(--accent); font-weight:bold; font-size: 0.85rem;">Estimated Cost: 0 IRT</div>
                <button class="btn-action" onclick="app.trade()">Confirm Order</button>
            </div>
            <div class="glass-card">
                <h4>Market Rates</h4>
                <div style="margin-top:20px;">
                    <small>Vault Sells (Ask):</small> <p id="m-ask" style="color:var(--success); font-size:1.4rem; font-weight:bold;">0</p>
                    <hr style="border:0; border-top:1px solid #222; margin:15px 0;">
                    <small>Vault Buys (Bid):</small> <p id="m-bid" style="color:var(--danger); font-size:1.4rem; font-weight:bold;">0</p>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    const n = (v) => parseFloat(String(v).replace(/,/g, '')) || 0;
    const loc = (v) => Math.floor(v).toLocaleString();

    const app = {
        user: null,
        db: {},
        init() {
            this.loadDB();
            setInterval(() => { this.loadDB(); this.render(); }, 2500);
        },
        loadDB() {
            this.db = {
                u: JSON.parse(localStorage.getItem('sc_u')) || [],
                l: JSON.parse(localStorage.getItem('sc_l')) || [],
                v: JSON.parse(localStorage.getItem('sc_v')) || { irt: 0, usdt: 0 },
                r: parseFloat(localStorage.getItem('sc_r')) || 0
            };
        },
        login() {
            const id = document.getElementById('login-id').value;
            // در ادمین باید فیلد irt هم به آبجکت کاربر اضافه شده باشد
            const u = this.db.u.find(x => x.name === id);
            if(u) {
                this.user = u;
                document.getElementById('login-overlay').style.display = 'none';
                this.render();
            } else {
                alert("Access Denied. Account not recognized by Admin.");
            }
        },
        tab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        },
        trade() {
            const side = document.getElementById('tr-side').value;
            const qty = parseFloat(document.getElementById('tr-qty').value);
            if(!qty || qty <= 0) return this.toast("Invalid Qty", true);

            this.loadDB();
            const uIdx = this.db.u.findIndex(x => x.id === this.user.id);
            const user = this.db.u[uIdx];
            const rate = side === 'buy' ? this.db.r * 1.0075 : this.db.r * 0.9925;
            const costIRT = qty * rate;

            if(side === 'buy') {
                if((user.irt || 0) < costIRT) return this.toast("Insufficient IRT Balance", true);
                if(this.db.v.usdt < qty) return this.toast("Vault Liquidity Error", true);
                
                this.db.u[uIdx].irt = (user.irt || 0) - costIRT;
                this.db.u[uIdx].usdt += qty;
                this.db.v.usdt -= qty;
                this.db.v.irt += costIRT;
            } else {
                if(user.usdt < qty) return this.toast("Insufficient USDT Balance", true);
                if(this.db.v.irt < costIRT) return this.toast("Vault IRT Error", true);

                this.db.u[uIdx].usdt -= qty;
                this.db.u[uIdx].irt = (user.irt || 0) + costIRT;
                this.db.v.usdt += qty;
                this.db.v.irt -= costIRT;
            }

            this.db.l.push({ 
                id: Date.now(), user: user.name, side, qty, amt: costIRT, rate, time: new Date().toLocaleString() 
            });
            
            this.save();
            this.toast("Trade Executed!");
        },
        save() {
            localStorage.setItem('sc_u', JSON.stringify(this.db.u));
            localStorage.setItem('sc_l', JSON.stringify(this.db.l));
            localStorage.setItem('sc_v', JSON.stringify(this.db.v));
        },
        render() {
            if(!this.user) return;
            const u = this.db.u.find(x => x.id === this.user.id);
            document.getElementById('st-usdt').innerText = u.usdt.toFixed(2);
            document.getElementById('st-irt').innerText = loc(u.irt || 0);
            
            document.getElementById('m-ask').innerText = loc(this.db.r * 1.0075);
            document.getElementById('m-bid').innerText = loc(this.db.r * 0.9925);

            const logs = this.db.l.filter(x => x.user === u.name).reverse();
            document.getElementById('history-ui').innerHTML = logs.map(x => `
                <tr>
                    <td>${x.time}</td>
                    <td style="color:${x.side==='buy'? 'var(--success)':'var(--accent)'}">${x.side.toUpperCase()}</td>
                    <td>${x.qty.toFixed(2)} USDT</td>
                    <td>${loc(x.amt)} IRT</td>
                </tr>
            `).join('');
        },
        toast(m, err=false) {
            const t = document.getElementById('toast');
            t.style.display = 'block'; t.innerText = m;
            t.style.background = err ? '#f44' : '#0a5';
            setTimeout(() => t.style.display = 'none', 3000);
        }
    }
    app.init();
</script>
</body>
</html>
