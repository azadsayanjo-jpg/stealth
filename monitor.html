<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stealth Monitor LIVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>body { font-family: 'Vazirmatn', sans-serif; background: #020617; color: #f1f5f9; }</style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto text-right">
        <h1 class="text-3xl font-black mb-8 text-emerald-500">پایش زنده نقدینگی</h1>
        <div class="grid grid-cols-2 gap-4 mb-8 font-mono">
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <span class="text-slate-500 text-xs block mb-2">گردش کل (تومان)</span>
                <div id="total-turnover" class="text-3xl font-bold">0</div>
            </div>
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 text-blue-400">
                <span class="text-slate-500 text-xs block mb-2">سود ناخالص</span>
                <div id="total-profit" class="text-3xl font-bold">0</div>
            </div>
        </div>
        <div class="bg-slate-900 rounded-3xl overflow-hidden border border-slate-800">
            <table class="w-full text-right">
                <thead class="bg-slate-800 text-slate-400 text-xs">
                    <tr><th class="p-5">زمان</th><th class="p-5">مشتری</th><th class="p-5">USDT</th></tr>
                </thead>
                <tbody id="monitor-table" class="text-sm"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnTDnLIOwORgu6LpYjj3jHbMDk8v-MVjg",
            authDomain: "sellusd-ea252.firebaseapp.com",
            databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com",
            projectId: "sellusd-ea252",
            storageBucket: "sellusd-ea252.firebasestorage.app",
            messagingSenderId: "143438594798",
            appId: "1:143438594798:web:40ca10e776b9b9beb4a9ff"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'stealth_data');

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const trades = data.trades || [];
                const table = document.getElementById('monitor-table');
                let turnover = 0, profit = 0;
                table.innerHTML = '';
                trades.forEach(t => {
                    turnover += t.total; profit += t.profit;
                    table.innerHTML += `<tr class="border-b border-slate-800"><td class="p-5 text-slate-500">${t.date}</td><td class="p-5 font-bold">${t.name}</td><td class="p-5 text-blue-400 font-bold font-mono">${t.qnt.toFixed(2)}</td></tr>`;
                });
                document.getElementById('total-turnover').innerText = Math.round(turnover).toLocaleString();
                document.getElementById('total-profit').innerText = Math.round(profit).toLocaleString();
            }
        });
    </script>
</body>
</html>
