<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>StealthCapital v1 | Admin Terminal</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #050608; --surface: #0f1115; --accent: #00f2ff; 
            --danger: #ef4444; --success: #00ffa3; --gold: #ffcc00;
            --amber: #ffbf00; --font: 'Vazirmatn', sans-serif; 
        }
        * { box-sizing: border-box; font-family: var(--font) !important; transition: 0.3s; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        aside { width: 400px; background: var(--surface); padding: 25px; border-left: 1px solid #222; overflow-y: auto; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        aside::-webkit-scrollbar { width: 5px; }
        aside::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }

        main { flex: 1; padding: 40px; overflow-y: auto; background: radial-gradient(circle at top right, #0a101a, #050608); }
        .box { background: rgba(255,255,255,0.03); border: 1px solid #222; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; color: #64748b; margin-bottom: 8px; font-weight: 700; }
        
        input, select, textarea { width: 100%; background: #000; border: 1px solid #333; padding: 12px; border-radius: 12px; color: #fff; margin-bottom: 15px; outline: none; font-size: 0.9rem; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 242, 255, 0.1); }
        
        .btn { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 12px; width: 100%; cursor: pointer; font-weight: 800; margin-bottom: 10px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 242, 255, 0.3); }
        .btn-del { background: var(--danger); color: #fff; }
        
        .card { background: var(--surface); border-radius: 20px; padding: 18px; border: 1px solid #222; margin-bottom: 10px; cursor: pointer; position: relative; }
        .card:hover { border-color: var(--accent); background: #16181d; }
        
        .quick-note-select { border-color: #444; background: #1a1d23; color: var(--accent); font-weight: bold; }
        .calc-row { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 6px 0; border-bottom: 1px solid #222; color: var(--success); }
        
        .badge-cat { font-size: 0.65rem; padding: 2px 8px; border-radius: 5px; font-weight: bold; }
        .cat-safe { background: rgba(0, 255, 163, 0.1); color: var(--success); }
        .cat-growth { background: rgba(255, 191, 0, 0.1); color: var(--amber); }
    </style>
</head>
<body>
    <aside>
        <h2 style="margin-bottom:5px; font-weight: 900; color: var(--accent);">STEALTH<span style="color:#fff">CAPITAL</span></h2>
        <p style="font-size: 0.6rem; color: #64748b; margin-bottom: 30px; letter-spacing: 2px;">V1.0 ADMIN TERMINAL</p>
        
        <div class="box" style="border: 1px solid var(--accent); background: rgba(0, 242, 255, 0.05);">
            <label style="color: var(--accent);">🧮 محاسبه سریع تخصیص سرمایه ($)</label>
            <input type="number" id="quick-calc" placeholder="مبلغ کل را وارد کنید..." oninput="runQuickCalc()">
            <div id="calc-output"></div>
        </div>

        <div class="box">
            <label>نرخ تتر (تومان)</label>
            <input type="number" id="cfg-toman" oninput="saveConfig()">
            <label>وضعیت استراتژیک بازار</label>
            <select id="cfg-type" onchange="saveConfig()">
                <option value="خرید تکمیل شد — صبوری تا رسیدن به هدف">خرید تکمیل شد — صبوری تا رسیدن به هدف</option>
                <option value="در حال تکمیل موقعیت خرید">در حال تکمیل موقعیت خرید</option>
                <option value="قیمت‌ها در محدوده فرصت — ادامه تکمیل خرید">قیمت‌ها در محدوده فرصت — ادامه تکمیل خرید</option>
            </select>
        </div>

        <div class="box">
            <label>پیام انگیزشی / استراتژی فرعی</label>
            <select class="quick-note-select" onchange="applyQuickNote(this.value)">
                <option value="">-- انتخاب پیام --</option>
                <option value="هر نوسان بازار، یک پله برای صعود در بلندمدت است.">نوسان و صعود</option>
                <option value="ثروت واقعی، برآیند صبر و انباشت هوشمندانه دارایی است.">صبر و انباشت</option>
                <option value="در مسیر StealthCapital، نظم از هوش مهم‌تر است.">نظم و هوش</option>
                <option value="کاهش قیمت‌ها در بازار، فرصتی برای خرید تخفیف‌خورده است.">فرصت خرید</option>
                <option value="ثروتمند شدن یک اتفاق نیست، یک فرآیند منضبط است.">فرآیند منضبط</option>
            </select>
            <label style="margin-top:10px;">متن نهایی زیرهدر (Note)</label>
            <textarea id="cfg-note" rows="3" oninput="saveConfig()" placeholder="پیام مدیریت..."></textarea>
        </div>

        <div class="box" style="border: 1px dashed #333;">
            <button class="btn" style="background:#222; color:#fff; font-size: 0.75rem; margin-bottom: 5px;" onclick="exportData()">📥 خروجی بک‌آپ (JSON)</button>
            <button class="btn" style="background:#222; color:#fff; font-size: 0.75rem;" onclick="document.getElementById('file-input').click()">📤 بارگذاری بک‌آپ</button>
            <input type="file" id="file-input" style="display:none" onchange="importData(event)">
        </div>

        <button class="btn" onclick="openModal()">+ افزودن دارایی جدید</button>
        <div id="list-area"></div>
    </aside>

    <main>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="font-weight: 900; margin:0;">مدیریت پورتفوی فعال</h1>
            <span id="market-preview" style="padding: 8px 20px; border-radius: 12px; font-size: 0.8rem; border: 1px solid; font-weight: bold;"></span>
        </div>
        <div id="grid-preview" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;"></div>
    </main>

    <div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); align-items:center; justify-content:center; z-index:100; backdrop-filter: blur(8px);">
        <div style="background:#16181d; width:420px; padding:35px; border-radius:30px; border:1px solid var(--accent); box-shadow: 0 0 30px rgba(0,242,255,0.2);">
            <h3 id="m-title" style="color:var(--accent); margin-top:0;">ویرایش دارایی</h3>
            <label>نام دارایی (مثلاً اتریوم)</label>
            <input type="text" id="in-name">
            <label>نماد (مثلاً ETH)</label>
            <input type="text" id="in-sym">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div><label>موجودی فعلی</label><input type="number" id="in-qty" step="any"></div>
                <div><label>تعداد هدف</label><input type="number" id="in-tqty" step="any"></div>
            </div>
            <label>قیمت هدف نهایی (USD)</label>
            <input type="number" id="in-tprice" step="any">
            <label>دسته‌بندی</label>
            <select id="in-cat">
                <option value="safe">🛡️ معمولی (Safe)</option>
                <option value="growth">🚀 رشد شارپ (Growth)</option>
            </select>
            <button class="btn" onclick="saveAsset()">ذخیره تغییرات</button>
            <button id="del-btn" class="btn btn-del" onclick="deleteAsset()">حذف دارایی</button>
            <button onclick="closeModal()" style="background:none; border:none; color:#64748b; width:100%; cursor:pointer;">انصراف</button>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('StealthCapital_V1');

    let db = [];
    let config = { toman: 70000, type: '', note: '' };
    let editIdx = null;

    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            db = data.db || [];
            config = data.config || config;
            render();
        }
    });

    // تابع اصلی برای همگام‌سازی با فایربیس
    function syncToFirebase() { 
        dbRef.set({ db, config }).then(() => {
            console.log("همگام‌سازی با موفقیت انجام شد.");
        }).catch(err => {
            alert("خطا در نوشتن روی دیتابیس. قوانین (Rules) را چک کنید.");
        });
    }

    function runQuickCalc() {
        const val = document.getElementById('quick-calc').value || 0;
        const out = document.getElementById('calc-output');
        const strategy = [
            {n: 'تتر (25%)', v: 0.25}, {n: 'طلا/PAXG (25%)', v: 0.25}, 
            {n: 'بیت‌کوین (20%)', v: 0.20}, {n: 'اتریوم (15%)', v: 0.15}, 
            {n: 'آلت‌کوین High (10%)', v: 0.10}, {n: 'میم‌کوین (5%)', v: 0.05}
        ];
        out.innerHTML = strategy.map(s => `<div class="calc-row"><span>${s.n}</span><b>$${(val*s.v).toLocaleString()}</b></div>`).join('');
    }

    function saveConfig() {
        config.toman = parseFloat(document.getElementById('cfg-toman').value) || 0;
        config.type = document.getElementById('cfg-type').value;
        config.note = document.getElementById('cfg-note').value;
        syncToFirebase();
    }

    function applyQuickNote(val) { if(val) { document.getElementById('cfg-note').value = val; saveConfig(); } }

    function openModal(i = null) {
        editIdx = i;
        document.getElementById('modal').style.display = 'flex';
        if(i !== null) {
            const d = db[i];
            document.getElementById('in-name').value = d.name;
            document.getElementById('in-sym').value = d.sym;
            document.getElementById('in-qty').value = d.qty;
            document.getElementById('in-tqty').value = d.tqty;
            document.getElementById('in-tprice').value = d.tprice;
            document.getElementById('in-cat').value = d.cat;
            document.getElementById('del-btn').style.display = 'block';
        } else {
            document.querySelectorAll('#modal input').forEach(el => el.value = '');
            document.getElementById('del-btn').style.display = 'none';
        }
    }

    function saveAsset() {
        const obj = {
            name: document.getElementById('in-name').value, 
            sym: document.getElementById('in-sym').value.toUpperCase().replace("USDT", "").trim(),
            qty: parseFloat(document.getElementById('in-qty').value) || 0,
            tqty: parseFloat(document.getElementById('in-tqty').value) || 0,
            tprice: parseFloat(document.getElementById('in-tprice').value) || 0,
            cat: document.getElementById('in-cat').value
        };
        if(editIdx !== null) db[editIdx] = obj; else db.push(obj);
        syncToFirebase(); closeModal();
    }

    function deleteAsset() { if(confirm('حذف شود؟')) { db.splice(editIdx, 1); syncToFirebase(); closeModal(); } }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function render() {
        const area = document.getElementById('list-area');
        const grid = document.getElementById('grid-preview');
        area.innerHTML = ''; grid.innerHTML = '';
        
        db.forEach((item, i) => {
            area.innerHTML += `<div class="card" onclick="openModal(${i})" style="padding:12px; font-size:0.85rem;">
                <b>${item.name}</b> <span style="color:var(--accent)">${item.sym}</span>
            </div>`;
            
            grid.innerHTML += `
                <div class="card" onclick="openModal(${i})">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <b style="color:var(--accent); font-size:1.1rem;">${item.name}</b>
                        <span class="badge-cat ${item.cat=='safe'?'cat-safe':'cat-growth'}">${item.cat=='safe'?'🛡️ SAFE':'🚀 GROWTH'}</span>
                    </div>
                    <div style="font-size:0.75rem; color:#64748b; line-height:1.6;">
                        <div>موجودی: <b style="color:#fff">${item.qty.toLocaleString()}</b></div>
                        <div>هدف: <b style="color:#fff">${item.tqty.toLocaleString()}</b></div>
                        <div style="margin-top:5px; border-top:1px solid #222; padding-top:5px;">
                            ارزش هدف: <b style="color:var(--gold)">$${(item.tqty * item.tprice).toLocaleString()}</b>
                        </div>
                    </div>
                </div>`;
        });
        
        document.getElementById('cfg-toman').value = config.toman;
        document.getElementById('cfg-type').value = config.type;
        document.getElementById('cfg-note').value = config.note;
        updateMarketPreview();
    }

    function updateMarketPreview() {
        const p = document.getElementById('market-preview');
        const type = config.type;
        p.innerText = type || 'بدون وضعیت';
        
        let color = 'var(--accent)';
        if (type.includes("تکمیل شد")) color = 'var(--success)';
        else if (type.includes("در حال تکمیل")) color = 'var(--gold)';
        
        p.style.color = color;
        p.style.borderColor = color;
    }

    function exportData() {
        const blob = new Blob([JSON.stringify({db, config})], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `StealthCapital_Backup.json`; a.click();
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                db = data.db; config = data.config;
                syncToFirebase();
            } catch(err) { alert('خطا در بارگذاری'); }
        };
        reader.readAsText(e.target.files[0]);
    }
    runQuickCalc();
</script>
</body>
</html>
