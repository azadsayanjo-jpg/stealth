<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>StealthCapital v1.2 | Admin Terminal</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <style>
        :root { 
            --bg: #010204; --surface: rgba(15, 22, 36, 0.98); --border: rgba(0, 242, 255, 0.15);
            --accent: #00f2ff; --gold: #ffcc00; --success: #00ffa3; --danger: #ff4d4d;
            --warning: #ff9f43; --text-main: #ffffff; --text-sub: #94a3b8; --font: 'Vazirmatn', sans-serif;
        }
        * { box-sizing: border-box; font-family: var(--font) !important; transition: 0.2s; }
        body { background: var(--bg); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* انیمیشن نبض هماهنگ با مانیتور */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 242, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0); }
        }
        .active-pulse { animation: pulse-glow 2s infinite; }

        aside { width: 380px; background: var(--surface); padding: 25px; border-left: 1px solid var(--border); overflow-y: auto; z-index: 10; }
        aside::-webkit-scrollbar { width: 4px; }
        aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        main { flex: 1; padding: 30px; overflow-y: auto; background: radial-gradient(circle at top right, #0a101a, #010204); }
        
        .box { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 20px; padding: 18px; margin-bottom: 20px; }
        label { display: block; font-size: 0.7rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 800; letter-spacing: 1px; }
        
        input, select, textarea { 
            width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; 
            border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; font-size: 0.85rem; 
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 242, 255, 0.1); }
        
        .btn { 
            background: var(--accent); color: #000; border: none; padding: 14px; 
            border-radius: 12px; width: 100%; cursor: pointer; font-weight: 900; 
            margin-bottom: 10px; text-transform: uppercase; font-size: 0.8rem;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-del { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .btn-del:hover { background: var(--danger); color: #fff; }
        
        .card { 
            background: rgba(15, 22, 36, 0.5); border-radius: 20px; padding: 18px; 
            border: 1px solid var(--border); margin-bottom: 10px; cursor: pointer; 
        }
        .card:hover { border-color: var(--accent); background: var(--surface); }
        
        .calc-row { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 8px 0; border-bottom: 1px solid var(--border); }
        
        .badge-cat { font-size: 0.6rem; padding: 3px 10px; border-radius: 6px; font-weight: 900; }
        .cat-safe { background: rgba(0, 255, 163, 0.1); color: var(--success); }
        .cat-growth { background: rgba(255, 204, 0, 0.1); color: var(--gold); }
    </style>
</head>
<body>
    <aside>
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:25px;">
            <div style="width:12px; height:12px; background:var(--accent); border-radius:3px;"></div>
            <h2 style="margin:0; font-weight: 900; font-size: 1.2rem; letter-spacing: 1px;">STEALTH<span style="color:var(--text-sub)">CAPITAL</span></h2>
        </div>
        
        <div class="box" style="border-color: var(--accent); background: rgba(0, 242, 255, 0.03);">
            <label style="color: var(--accent);">🧮 تخصیص سرمایه پیشنهادی ($)</label>
            <input type="number" id="quick-calc" placeholder="مبلغ نقدینگی..." oninput="runQuickCalc()">
            <div id="calc-output" style="color: var(--text-main);"></div>
        </div>

        <div class="box">
            <label>نرخ تتر (تومان)</label>
            <input type="number" id="cfg-toman" oninput="saveConfig()">
            <label>وضعیت استراتژیک بازار</label>
            <select id="cfg-type" onchange="saveConfig()">
                <option value="خرید تکمیل شد — صبوری تا رسیدن به هدف">خرید تکمیل شد (HOLDING)</option>
                <option value="در حال تکمیل موقعیت خرید">در حال تکمیل خرید (ACTIVE)</option>
                <option value="قیمت‌ها در محدوده فرصت — ادامه تکمیل خرید">فرصت ورود (ACTIVE)</option>
            </select>
            <label>پیام انگیزشی زیرهدر</label>
            <select style="background:#1a1d23; color:var(--accent); font-weight:bold;" onchange="applyQuickNote(this.value)">
                <option value="">-- الگوهای سریع --</option>
                <option value="هر نوسان بازار، یک پله برای صعود در بلندمدت است.">نوسان و صعود</option>
                <option value="ثروت واقعی، برآیند صبر و انباشت هوشمندانه دارایی است.">صبر و انباشت</option>
                <option value="در مسیر StealthCapital، نظم از هوش مهم‌تر است.">نظم و هوش</option>
                <option value="کاهش قیمت‌ها در بازار، فرصتی برای خرید تخفیف‌خورده است.">فرصت خرید</option>
            </select>
            <textarea id="cfg-note" rows="3" oninput="saveConfig()" placeholder="متن سفارشی مدیریت..." style="margin-top:10px;"></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
            <button class="btn" style="background:#1a1d23; color:#fff; font-size:0.65rem;" onclick="exportData()">📥 BACKUP</button>
            <button class="btn" style="background:#1a1d23; color:#fff; font-size:0.65rem;" onclick="document.getElementById('file-input').click()">📤 RESTORE</button>
            <input type="file" id="file-input" style="display:none" onchange="importData(event)">
        </div>

        <button class="btn" onclick="openModal()">+ افزودن دارایی جدید</button>
        <div id="list-area" style="margin-top:20px;"></div>
    </aside>

    <main>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <div>
                <h1 style="font-weight: 900; margin:0; font-size: 1.8rem;">TERMINAL <span style="color:var(--accent)">CORE</span></h1>
                <p style="color:var(--text-sub); margin:5px 0 0 0; font-size:0.8rem;">مدیریت متمرکز دیتابیس StealthCapital v1.2</p>
            </div>
            <div id="market-preview-pill" class="active-pulse" style="padding: 10px 25px; border-radius: 12px; font-size: 0.75rem; border: 1px solid; font-weight: 900; letter-spacing: 1px;">
                STATUS PREVIEW
            </div>
        </div>
        
        <div id="grid-preview" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;"></div>
    </main>

    <div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); align-items:center; justify-content:center; z-index:100; backdrop-filter: blur(10px);">
        <div style="background:var(--surface); width:400px; padding:30px; border-radius:25px; border:1px solid var(--accent);">
            <h3 id="m-title" style="color:var(--accent); margin-top:0; font-weight:900;">تنظیمات دارایی</h3>
            <label>نام پروژه</label>
            <input type="text" id="in-name" placeholder="مثلاً Bitcoin">
            <label>نماد (SYMBOL)</label>
            <input type="text" id="in-sym" placeholder="BTC">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div><label>موجودی فعلی</label><input type="number" id="in-qty" step="any"></div>
                <div><label>تعداد هدف</label><input type="number" id="in-tqty" step="any"></div>
            </div>
            <label>تارگت قیمت خروج (USD)</label>
            <input type="number" id="in-tprice" step="any">
            <label>طبقه‌بندی پورتفو</label>
            <select id="in-cat">
                <option value="safe">🛡️ استراتژیک (Safe)</option>
                <option value="growth">🚀 پتانسیل رشد (Growth)</option>
            </select>
            <button class="btn" onclick="saveAsset()">ذخیره و انتشار</button>
            <button id="del-btn" class="btn btn-del" onclick="deleteAsset()">حذف از لیست</button>
            <button onclick="closeModal()" style="background:none; border:none; color:var(--text-sub); width:100%; cursor:pointer; font-size:0.8rem; margin-top:10px;">انصراف</button>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('StealthCapital_V1');

    let db = [];
    let config = { toman: 70000, type: '', note: '' };
    let editIdx = null;

    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            db = data.db || [];
            config = data.config || config;
            render();
        }
    });

    function syncToFirebase() { 
        dbRef.set({ db, config });
    }

    function runQuickCalc() {
        const val = document.getElementById('quick-calc').value || 0;
        const out = document.getElementById('calc-output');
        const strategy = [
            {n: 'تتر/نقدینگی (25%)', v: 0.25, c: 'var(--text-sub)'}, 
            {n: 'طلا/PAXG (25%)', v: 0.25, c: 'var(--gold)'}, 
            {n: 'بیت‌کوین (20%)', v: 0.20, c: 'var(--accent)'}, 
            {n: 'اتریوم (15%)', v: 0.15, c: '#a5a5a5'}, 
            {n: 'آلت‌کوین High (15%)', v: 0.15, c: 'var(--success)'}
        ];
        out.innerHTML = strategy.map(s => `<div class="calc-row" style="color:${s.c}"><span>${s.n}</span><b>$${(val*s.v).toLocaleString()}</b></div>`).join('');
    }

    function saveConfig() {
        config.toman = parseFloat(document.getElementById('cfg-toman').value) || 0;
        config.type = document.getElementById('cfg-type').value;
        config.note = document.getElementById('cfg-note').value;
        syncToFirebase();
    }

    function applyQuickNote(val) { if(val) { document.getElementById('cfg-note').value = val; saveConfig(); } }

    function openModal(i = null) {
        editIdx = i;
        document.getElementById('modal').style.display = 'flex';
        if(i !== null) {
            const d = db[i];
            document.getElementById('in-name').value = d.name;
            document.getElementById('in-sym').value = d.sym;
            document.getElementById('in-qty').value = d.qty;
            document.getElementById('in-tqty').value = d.tqty;
            document.getElementById('in-tprice').value = d.tprice;
            document.getElementById('in-cat').value = d.cat;
            document.getElementById('del-btn').style.display = 'block';
        } else {
            document.querySelectorAll('#modal input').forEach(el => el.value = '');
            document.getElementById('del-btn').style.display = 'none';
        }
    }

    function saveAsset() {
        const obj = {
            name: document.getElementById('in-name').value, 
            sym: document.getElementById('in-sym').value.toUpperCase().trim(),
            qty: parseFloat(document.getElementById('in-qty').value) || 0,
            tqty: parseFloat(document.getElementById('in-tqty').value) || 0,
            tprice: parseFloat(document.getElementById('in-tprice').value) || 0,
            cat: document.getElementById('in-cat').value
        };
        if(editIdx !== null) db[editIdx] = obj; else db.push(obj);
        syncToFirebase(); closeModal();
    }

    function deleteAsset() { if(confirm('از حذف این دارایی اطمینان دارید؟')) { db.splice(editIdx, 1); syncToFirebase(); closeModal(); } }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    function render() {
        const area = document.getElementById('list-area');
        const grid = document.getElementById('grid-preview');
        area.innerHTML = ''; grid.innerHTML = '';
        
        db.forEach((item, i) => {
            area.innerHTML += `<div class="card" onclick="openModal(${i})" style="padding:10px 15px; font-size:0.8rem; display:flex; justify-content:space-between;">
                <b>${item.name}</b> <span style="color:var(--accent)">${item.sym}</span>
            </div>`;
            
            grid.innerHTML += `
                <div class="card" onclick="openModal(${i})">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <b style="color:var(--accent); font-size:1rem;">${item.name}</b>
                        <span class="badge-cat ${item.cat=='safe'?'cat-safe':'cat-growth'}">${item.cat=='safe'?'🛡️ SAFE':'🚀 GROWTH'}</span>
                    </div>
                    <div style="font-size:0.7rem; color:var(--text-sub); line-height:1.8;">
                        <div style="display:flex; justify-content:space-between;"><span>موجودی:</span><b style="color:#fff">${item.qty.toLocaleString()}</b></div>
                        <div style="display:flex; justify-content:space-between;"><span>تارگت انباشت:</span><b style="color:#fff">${item.tqty.toLocaleString()}</b></div>
                        <div style="margin-top:8px; border-top:1px solid var(--border); padding-top:8px; display:flex; justify-content:space-between;">
                            <span>ارزش هدف:</span><b style="color:var(--gold)">$${(item.tqty * item.tprice).toLocaleString()}</b>
                        </div>
                    </div>
                </div>`;
        });
        
        document.getElementById('cfg-toman').value = config.toman;
        document.getElementById('cfg-type').value = config.type;
        document.getElementById('cfg-note').value = config.note;
        updateMarketPreview();
    }

    function updateMarketPreview() {
        const p = document.getElementById('market-preview-pill');
        const type = config.type || "";
        p.innerText = type.includes("تکمیل شد") ? "HOLDING MODE" : "ACTIVE SPRINT";
        
        let color = 'var(--accent)';
        if (type.includes("تکمیل شد")) {
            color = 'var(--success)';
            p.classList.remove('active-pulse');
        } else {
            color = 'var(--warning)';
            p.classList.add('active-pulse');
        }
        
        p.style.color = color;
        p.style.borderColor = color;
    }

    function exportData() {
        const blob = new Blob([JSON.stringify({db, config})], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `StealthCapital_v1.2_Backup.json`; a.click();
    }

    function importData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                db = data.db; config = data.config;
                syncToFirebase();
            } catch(err) { alert('خطا در بارگذاری فایل!'); }
        };
        reader.readAsText(e.target.files[0]);
    }
</script>
</body>
</html>
