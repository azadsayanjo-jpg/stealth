<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Nikdad v1 | Admin Terminal</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root { --bg: #050608; --surface: #0f1115; --primary: #00f2ff; --danger: #ef4444; --success: #00ffa3; --font: 'Vazirmatn', sans-serif; }
        * { box-sizing: border-box; font-family: var(--font) !important; transition: 0.3s; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        aside { width: 400px; background: var(--surface); padding: 25px; border-left: 1px solid #222; overflow-y: auto; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
        main { flex: 1; padding: 40px; overflow-y: auto; background: radial-gradient(circle at top right, #0a101a, #050608); }
        .box { background: rgba(255,255,255,0.03); border: 1px solid #222; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        label { display: block; font-size: 0.75rem; color: #64748b; margin-bottom: 8px; font-weight: 700; }
        input, select, textarea { width: 100%; background: #000; border: 1px solid #333; padding: 12px; border-radius: 12px; color: #fff; margin-bottom: 15px; outline: none; }
        .btn { background: var(--primary); color: #000; border: none; padding: 14px; border-radius: 12px; width: 100%; cursor: pointer; font-weight: 800; margin-bottom: 10px; }
        .btn-del { background: var(--danger); color: #fff; }
        .card { background: var(--surface); border-radius: 20px; padding: 15px; border: 1px solid #222; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; }
        .calc-row { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 6px 0; border-bottom: 1px solid #222; color: var(--success); }
    </style>
</head>
<body>
    <aside>
        <h2 style="color: var(--primary); font-weight: 900;">NIKDAD<span style="color:#fff">CAPITAL</span></h2>
        <p style="font-size: 0.6rem; color: #64748b; margin-bottom: 30px;">V1.0 ADMIN TERMINAL</p>
        
        <div class="box" style="border: 1px solid var(--primary);">
            <label>🧮 محاسبه سریع ($)</label>
            <input type="number" id="quick-calc" oninput="runQuickCalc()">
            <div id="calc-output"></div>
        </div>

        <div class="box">
            <label>نرخ تتر (تومان)</label>
            <input type="number" id="cfg-toman" oninput="saveConfig()">
            <label>وضعیت بازار</label>
            <select id="cfg-type" onchange="saveConfig()">
                <option value="صعودی">صعودی</option>
                <option value="خنثی">خنثی</option>
                <option value="نزولی">نزولی</option>
            </select>
            <label>استراتژی (Header)</label>
            <textarea id="cfg-note" rows="3" oninput="saveConfig()"></textarea>
        </div>

        <button class="btn" onclick="openModal()">+ افزودن دارایی</button>
        <div id="list-area"></div>
    </aside>

    <main>
        <h1 style="font-weight: 900;">مدیریت پورتفوی Nikdad</h1>
        <div id="grid-preview" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px;"></div>
    </main>

    <div id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); align-items:center; justify-content:center; z-index:100;">
        <div style="background:#16181d; width:400px; padding:30px; border-radius:20px; border:1px solid var(--primary);">
            <h3 id="m-title">ویرایش</h3>
            <input type="text" id="in-name" placeholder="نام">
            <input type="text" id="in-sym" placeholder="نماد (مثلاً BTC)">
            <input type="number" id="in-qty" placeholder="موجودی">
            <input type="number" id="in-tqty" placeholder="هدف تعداد">
            <input type="number" id="in-tprice" placeholder="قیمت هدف">
            <select id="in-cat"><option value="safe">معمولی</option><option value="growth">رشد شارپ</option></select>
            <button class="btn" onclick="saveAsset()">ذخیره</button>
            <button id="del-btn" class="btn btn-del" onclick="deleteAsset()">حذف</button>
            <button onclick="closeModal()" style="color:#64748b; background:none; border:none; width:100%;">بستن</button>
        </div>
    </div>

<script>
    // کلیدهای مشترک برای اتصال دو فایل
    const DB_KEY = 'Nikdad_Assets_V1';
    const CFG_KEY = 'Nikdad_Config_V1';

    let db = JSON.parse(localStorage.getItem(DB_KEY)) || [];
    let config = JSON.parse(localStorage.getItem(CFG_KEY)) || { toman: 70000, type: 'نزولی', note: 'خوش آمدید' };
    let editIdx = null;

    function saveConfig() {
        config.toman = document.getElementById('cfg-toman').value;
        config.type = document.getElementById('cfg-type').value;
        config.note = document.getElementById('cfg-note').value;
        localStorage.setItem(CFG_KEY, JSON.stringify(config));
    }

    function saveAsset() {
        const obj = {
            name: document.getElementById('in-name').value,
            sym: document.getElementById('in-sym').value.toUpperCase().replace("USDT", ""),
            qty: parseFloat(document.getElementById('in-qty').value) || 0,
            tqty: parseFloat(document.getElementById('in-tqty').value) || 0,
            tprice: parseFloat(document.getElementById('in-tprice').value) || 0,
            cat: document.getElementById('in-cat').value
        };
        if(editIdx !== null) db[editIdx] = obj; else db.push(obj);
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        closeModal(); render();
    }

    function deleteAsset() {
        db.splice(editIdx, 1);
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        closeModal(); render();
    }

    function render() {
        const area = document.getElementById('list-area');
        const grid = document.getElementById('grid-preview');
        area.innerHTML = ''; grid.innerHTML = '';
        db.forEach((item, i) => {
            area.innerHTML += `<div class="card" onclick="openModal(${i})"><span>${item.name}</span><b>${item.sym}</b></div>`;
            grid.innerHTML += `<div class="card" style="flex-direction:column;"><b>${item.name}</b><small>هدف: ${item.tqty}</small></div>`;
        });
        document.getElementById('cfg-toman').value = config.toman;
        document.getElementById('cfg-type').value = config.type;
        document.getElementById('cfg-note').value = config.note;
    }

    function openModal(i = null) {
        editIdx = i; document.getElementById('modal').style.display = 'flex';
        if(i !== null) {
            const d = db[i];
            document.getElementById('in-name').value = d.name; document.getElementById('in-sym').value = d.sym;
            document.getElementById('in-qty').value = d.qty; document.getElementById('in-tqty').value = d.tqty;
            document.getElementById('in-tprice').value = d.tprice; document.getElementById('in-cat').value = d.cat;
            document.getElementById('del-btn').style.display = 'block';
        } else {
            document.querySelectorAll('#modal input').forEach(el => el.value = '');
            document.getElementById('del-btn').style.display = 'none';
        }
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function runQuickCalc() {
        const val = document.getElementById('quick-calc').value || 0;
        const s = [{n: 'تتر', v: 0.25}, {n: 'بیت‌کوین', v: 0.25}]; // مثال ساده
        document.getElementById('calc-output').innerHTML = s.map(x => `<div class="calc-row"><span>${x.n}</span><b>$${(val*x.v).toLocaleString()}</b></div>`).join('');
    }
    render();
</script>
</body>
</html>
