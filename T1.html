<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHOENIX ($PHX) | Ultra Explorer v4.1</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg: #010409; --surface: rgba(13, 17, 23, 0.9); --border: rgba(0, 242, 255, 0.15);
            --accent: #00f2ff; --gold: #ffcc00; --success: #00ffa3; --danger: #ff4d4d;
            --ai-color: #a29bfe; --text-main: #e6edf3; --text-sub: #8b949e; --font: 'Vazirmatn', sans-serif;
        }
        * { box-sizing: border-box; font-family: var(--font) !important; outline: none; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; min-height: 100vh; }
        .glass-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; backdrop-filter: blur(12px); margin-bottom: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; flex-wrap: wrap; gap: 20px; }
        .search-area { display: flex; gap: 10px; }
        input { background: #000; border: 1px solid var(--border); color: #fff; padding: 10px 15px; border-radius: 12px; width: 200px; }
        button { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
        .stat-card { padding: 20px; border-right: 3px solid var(--accent); }
        .stat-value { font-size: 1.8rem; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 10px; }
        th { color: var(--text-sub); padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
        td { padding: 15px 12px; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .loader { width: 15px; height: 15px; border: 2px solid #000; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="glass-panel">
        <div style="display: flex; align-items: center; gap: 15px;">
            <div style="font-size: 2rem;">🦅</div>
            <div>
                <h2 style="margin: 0; color: var(--accent);">PHOENIX EXPLORER</h2>
                <div id="status-tag" style="font-size: 0.7rem; color: var(--text-sub);">آماده اسکن...</div>
            </div>
        </div>
        <div class="search-area">
            <input type="text" id="user-input" placeholder="آی‌دی (مثلاً 2 یا Admin)">
            <button id="search-btn" onclick="fetchUserData()">جستجو</button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="glass-panel stat-card">
            <div style="font-size: 0.75rem; color: var(--text-sub);">قیمت هر واحد PHX</div>
            <div id="phx-price" class="stat-value">$0.00</div>
            <div id="phx-toman" style="color: var(--text-sub); font-size: 0.8rem;">0 تومان</div>
        </div>
        <div class="glass-panel stat-card" style="border-color: var(--gold);">
            <div style="font-size: 0.75rem; color: var(--text-sub);">ارزش کل سبد (TVL)</div>
            <div id="total-tvl" class="stat-value">$0</div>
            <div id="total-toman" style="color: var(--text-sub); font-size: 0.8rem;">0 تومان</div>
        </div>
    </div>

    <div class="glass-panel" style="padding: 20px; overflow-x: auto;">
        <h3 style="margin-top: 0;">📦 لیست دارایی‌های پشتوانه</h3>
        <table id="assets-table-container">
            <thead>
                <tr>
                    <th>ارز</th>
                    <th>مقدار</th>
                    <th>قیمت لحظه‌ای</th>
                    <th>ارزش ($)</th>
                </tr>
            </thead>
            <tbody id="assets-table">
                <tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--text-sub);">آی‌دی کاربر را وارد کنید (مثل: 1 یا 2)</td></tr>
            </tbody>
        </table>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    async function fetchUserData() {
        let userId = document.getElementById('user-input').value.trim();
        const btn = document.getElementById('search-btn');
        const status = document.getElementById('status-tag');
        
        if (!userId) return;
        btn.innerHTML = '<div class="loader"></div>';
        btn.disabled = true;

        // --- اصلاح هوشمند مسیر ---
        // اگر کاربر فقط عدد وارد کرد (مثلاً 2)، آن را به Users/2 تبدیل کن
        let finalPath = userId;
        if (!isNaN(userId)) {
            finalPath = `Users/${userId}`;
        }
        
        const fullPath = `StealthCapital_V1/${finalPath}`;
        status.innerText = "جستجو در: " + fullPath;

        try {
            const snapshot = await database.ref(fullPath).once('value');
            const data = snapshot.val();

            if (!data) {
                // تلاش مجدد در صورتی که مسیر متفاوت باشد
                const altSnapshot = await database.ref(`StealthCapital_V1/${userId}`).once('value');
                if (!altSnapshot.val()) throw new Error("داده‌ای یافت نشد.");
                await processData(altSnapshot.val());
            } else {
                await processData(data);
            }
            status.innerText = "بروزرسانی موفق برای آی‌دی " + userId;
        } catch (error) {
            alert("خطا: " + error.message + "\nمطمئن شوید در پنل ادمین برای این کاربر داده ذخیره کرده‌اید.");
            status.innerText = "خطا در یافتن داده.";
        } finally {
            btn.innerHTML = 'جستجو';
            btn.disabled = false;
        }
    }

    async function processData(data) {
        let userAssets = [];
        let config = { toman: 70000 };

        // هماهنگی با ساختار پنل ادمین (db و config)
        if (data.db) {
            userAssets = Array.isArray(data.db) ? data.db : Object.values(data.db);
            if (data.config) config = data.config;
        } else {
            userAssets = Array.isArray(data) ? data : Object.values(data);
        }

        const cleanAssets = userAssets.filter(a => a && a.sym && parseFloat(a.qty) > 0);
        let totalUSD = 0;
        const tableBody = document.getElementById('assets-table');
        tableBody.innerHTML = '';

        for (const asset of cleanAssets) {
            let price = parseFloat(asset.buyPrice) || 0;
            const sym = asset.sym.toUpperCase();

            // دریافت قیمت زنده برای ارزهای غیر ثابت
            if (!['USDT', 'CASH', 'BUSD', 'USDC'].includes(sym)) {
                try {
                    const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${sym}USDT`);
                    const json = await res.json();
                    if (json.price) price = parseFloat(json.price);
                } catch (e) {}
            } else { price = 1; }

            const value = price * parseFloat(asset.qty);
            totalUSD += value;

            tableBody.innerHTML += `
                <tr>
                    <td><b>${sym}</b></td>
                    <td>${parseFloat(asset.qty).toLocaleString()}</td>
                    <td>$${price.toLocaleString()}</td>
                    <td style="color:var(--accent)">$${value.toLocaleString()}</td>
                </tr>
            `;
        }

        const phxPrice = totalUSD / 1000;
        document.getElementById('phx-price').innerText = `$${phxPrice.toFixed(4)}`;
        document.getElementById('phx-toman').innerText = `${Math.floor(phxPrice * config.toman).toLocaleString()} تومان`;
        document.getElementById('total-tvl').innerText = `$${Math.floor(totalUSD).toLocaleString()}`;
        document.getElementById('total-toman').innerText = `${Math.floor(totalUSD * config.toman).toLocaleString()} تومان`;
    }
</script>
</body>
</html>
