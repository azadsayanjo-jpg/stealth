<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Quant Vision Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #010409; color: #c9d1d9; font-family: 'Vazirmatn'; overflow: hidden; }
        .zone-card { background: rgba(13, 17, 23, 0.95); border: 1px solid #30363d; border-radius: 24px; transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .buy-active { border-top: 6px solid #238636; box-shadow: 0 0 40px rgba(35, 134, 54, 0.15); opacity: 1 !important; }
        .sell-active { border-top: 6px solid #1f6feb; box-shadow: 0 0 40px rgba(31, 111, 235, 0.15); opacity: 1 !important; }
        .price-num { font-family: monospace; font-weight: 900; letter-spacing: -1px; }
        .target-node { background: #0d1117; border: 1px solid #30363d; border-radius: 12px; transition: 0.3s; }
        .glow-buy { color: #3fb950; text-shadow: 0 0 20px rgba(63, 185, 80, 0.4); }
        .glow-sell { color: #58a6ff; text-shadow: 0 0 20px rgba(88, 166, 255, 0.4); }
        .target-hit { background: #10b981 !important; color: white !important; transform: scale(1.05); animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { box-shadow: 0 0 5px #10b981; } to { box-shadow: 0 0 20px #10b981; } }
    </style>
</head>
<body class="p-6">
    <div class="max-w-[1600px] mx-auto space-y-6">
        <div class="flex justify-between items-center px-4">
            <h1 class="text-2xl font-black italic tracking-tighter text-white">Advanced <span class="text-blue-500">Cloud.Terminal</span></h1>
            <div id="sync-info" class="text-[10px] font-black text-gray-500 uppercase tracking-widest bg-black border border-gray-800 px-6 py-2 rounded-full">
                Synchronizing with Cloud...
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 h-[calc(100vh-140px)]">
            <div id="buy-zone" class="zone-card p-8 opacity-20 flex flex-col justify-between overflow-hidden">
                <div class="flex justify-between items-end border-b border-gray-800 pb-6 mb-6">
                    <div>
                        <span class="text-[10px] text-emerald-500 font-black uppercase tracking-[0.3em]">Accumulation Zone</span>
                        <h2 class="text-3xl font-black text-white italic">BUY.STRAT</h2>
                    </div>
                    <div class="text-left">
                        <span class="text-[9px] text-gray-600 block uppercase font-bold">VWAP Average</span>
                        <div id="buy-vwap" class="text-5xl price-num glow-buy">-</div>
                    </div>
                </div>
                <div id="buy-ladder" class="space-y-4 flex-grow"></div>
                <div class="mt-8 border-t border-gray-800 pt-6">
                    <span class="text-[10px] text-gray-600 font-black uppercase mb-4 block italic">Profit Exit Nodes:</span>
                    <div id="buy-targets" class="grid grid-cols-4 gap-3"></div>
                </div>
            </div>

            <div id="sell-zone" class="zone-card p-8 opacity-20 flex flex-col justify-between overflow-hidden">
                <div class="flex justify-between items-end border-b border-gray-800 pb-6 mb-6">
                    <div>
                        <span class="text-[10px] text-blue-500 font-black uppercase tracking-[0.3em]">Distribution Zone</span>
                        <h2 class="text-3xl font-black text-white italic">SELL.STRAT</h2>
                    </div>
                    <div class="text-left">
                        <span class="text-[9px] text-gray-600 block uppercase font-bold">VWAP Average</span>
                        <div id="sell-vwap" class="text-5xl price-num glow-sell">-</div>
                    </div>
                </div>
                <div id="sell-ladder" class="space-y-4 flex-grow"></div>
                <div class="mt-8 border-t border-gray-800 pt-6">
                    <span class="text-[10px] text-gray-600 font-black uppercase mb-4 block italic">Re-buy Targets:</span>
                    <div id="sell-targets" class="grid grid-cols-4 gap-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        function syncUI(snap, mode) {
            const data = snap.val();
            const prefix = mode.toLowerCase();
            const zone = document.getElementById(`${prefix}-zone`);
            
            if(!data) {
                zone.classList.remove(`${prefix}-active`);
                zone.style.opacity = "0.2";
                document.getElementById(`${prefix}-vwap`).innerText = "-";
                document.getElementById(`${prefix}-ladder`).innerHTML = `<div class="h-full flex items-center justify-center text-[10px] text-gray-800 uppercase tracking-widest italic font-bold">No Active ${mode} Pipeline</div>`;
                document.getElementById(`${prefix}-targets`).innerHTML = "";
                return;
            }

            zone.classList.add(`${prefix}-active`);
            document.getElementById('sync-info').innerText = `LIVE BROADCAST: ${data.timestamp}`;
            document.getElementById(`${prefix}-vwap`).innerText = data.vwap.toLocaleString();

            document.getElementById(`${prefix}-ladder`).innerHTML = data.tiers.map((t, i) => `
                <div class="flex justify-between items-center p-5 bg-black/40 border border-gray-800 rounded-2xl group hover:border-blue-500/50 transition-all">
                    <div class="flex items-center gap-6">
                        <span class="text-[10px] font-black text-gray-700">LVL${i+1}</span>
                        <span class="text-3xl price-num text-white">${t.p.toLocaleString()}</span>
                    </div>
                    <span class="text-[11px] font-black text-blue-500/70">${mode === 'BUY' ? t.v.toLocaleString() + ' IRT' : t.q + ' USDT'}</span>
                </div>
            `).join('');

            const labels = ['Safe', 'Mid', 'High', 'Max'];
            document.getElementById(`${prefix}-targets`).innerHTML = data.targets.map((p, i) => `
                <div class="target-node p-4 text-center border border-white/5 shadow-2xl">
                    <div class="text-[8px] text-gray-600 font-black uppercase mb-1">${labels[i]} Goal</div>
                    <div class="text-[12px] price-num text-emerald-500">${p.toLocaleString()}</div>
                </div>
            `).join('');
        }

        db.ref('signals/buy').on('value', s => syncUI(s, 'BUY'));
        db.ref('signals/sell').on('value', s => syncUI(s, 'SELL'));
    </script>
</body>
</html>
