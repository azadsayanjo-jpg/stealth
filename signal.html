<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StealthCapital v1.7 | Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Vazirmatn'; overflow-x: hidden; }
        .showcase-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 15px;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
        }
        .showcase-container::-webkit-scrollbar { display: none; }
        .path-card {
            flex: 0 0 88vw;
            scroll-snap-align: center;
            background: #0a0a0c;
            border: 1px solid #1a1a1e;
            border-radius: 32px;
            padding: 20px;
            border-top: 5px solid var(--c);
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.5);
        }
        @media (min-width: 768px) { .path-card { flex: 0 0 380px; } }
        .font-mono { font-family: monospace; font-weight: 900; }
    </style>
</head>
<body class="py-6">
    <div class="px-8 mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-black italic">Stealth<span class="text-indigo-500">Vision</span></h1>
            <p class="text-[8px] text-zinc-600 font-bold uppercase tracking-widest">Global Assets Matrix</p>
        </div>
        <div id="clock" class="text-[10px] font-mono text-zinc-500 bg-zinc-900 px-3 py-1 rounded-full">00:00:00</div>
    </div>

    <div id="matrix-container" class="showcase-container">
        </div>

    <div class="flex justify-center gap-2 mt-4 opacity-20">
        <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
        <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
        <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
    </div>

    <script>
        const config = { databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fa-IR'); }, 1000);

        db.ref('stealth_matrix').on('value', snapshot => {
            const container = document.getElementById('matrix-container');
            const data = snapshot.val();
            if(!data) { container.innerHTML = `<div class="w-full text-center py-20 opacity-10 font-black text-2xl">NO ACTIVE PATHS</div>`; return; }

            container.innerHTML = Object.keys(data).map(key => {
                const s = data[key];
                const color = s.mode === 'BUYING' ? '#10b981' : '#3b82f6';
                return `
                <div class="path-card" style="--c: ${color}">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[9px] font-black px-3 py-1 rounded-lg bg-white/5 uppercase tracking-tighter" style="color:${color}">${s.path}</span>
                        <button onclick="firebase.database().ref('stealth_matrix/${key}').remove()" class="text-zinc-800 text-xs hover:text-red-500">✕</button>
                    </div>

                    <div class="text-center mb-8 border-b border-zinc-900 pb-6">
                        <p class="text-[8px] text-zinc-600 font-black uppercase tracking-[0.2em] mb-1">میانگین قیمت معامله</p>
                        <div class="text-4xl font-mono text-white">${s.vwap}</div>
                    </div>

                    <div class="space-y-3 mb-8">
                        ${s.tiers.map((t, i) => `
                            <div class="p-4 bg-zinc-900/30 border border-zinc-900 rounded-2xl relative overflow-hidden">
                                <span class="absolute top-0 right-0 bg-zinc-800 text-[6px] px-2 py-0.5 rounded-bl-lg font-black text-zinc-500 uppercase">Tier ${i+1}</span>
                                <div class="flex justify-between items-end mt-1">
                                    <div class="text-left">
                                        <p class="text-[7px] text-zinc-600 font-bold uppercase mb-1 tracking-widest">Execution Price</p>
                                        <div class="font-mono text-md text-zinc-300">${t.p}</div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-[9px] font-bold text-indigo-500/80 mb-0.5">${t.srcV} <span class="text-[7px] opacity-50">${s.src}</span></div>
                                        <div class="text-[13px] font-black text-white">${t.tarV} <span class="text-[8px] text-zinc-600 uppercase">${s.tar}</span></div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        ${s.targets.map((p, i) => `
                            <div class="bg-black/40 border border-zinc-900 p-3 rounded-2xl text-center">
                                <div class="text-[7px] text-zinc-600 font-black uppercase mb-1">Exit Goal ${i+1}</div>
                                <div class="text-[11px] font-mono text-emerald-500">${parseFloat(p).toLocaleString()}</div>
                            </div>
                        `).join('')}
                    </div>
                    <p class="text-[6px] text-center text-zinc-800 mt-4 font-mono">${s.timestamp}</p>
                </div>`;
            }).join('');
        });
    </script>
</body>
</html>
