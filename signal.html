<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital v1 | Vision Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #d4d4d8; font-family: 'Vazirmatn'; min-height: 100vh; overflow-y: auto; }
        .asset-card { background: #09090b; border: 1px solid #18181b; border-radius: 32px; padding: 24px; transition: 0.5s; position: relative; overflow: hidden; }
        .active-glow { border-top: 4px solid var(--c); box-shadow: 0 -20px 50px -20px var(--c); }
        .price-mono { font-family: monospace; font-weight: 900; letter-spacing: -1px; }
        .target-tag { background: #111; border: 1px solid #27272a; padding: 10px; border-radius: 12px; text-align: center; }
        .vwap-box { background: linear-gradient(to bottom, #111, #000); border: 1px solid #27272a; border-radius: 20px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <header class="flex justify-between items-center mb-10 max-w-6xl mx-auto">
        <h1 class="text-xl font-black italic tracking-tighter text-white">VISION.<span class="text-indigo-500">TERMINAL</span></h1>
        <div id="clock" class="text-[10px] font-mono font-bold text-zinc-500 bg-zinc-900 px-4 py-2 rounded-full border border-zinc-800">00:00:00</div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto pb-12">
        <div id="card-GOLD" class="asset-card" style="--c: #eab308;">
            <div class="empty-msg opacity-20 h-64 flex items-center justify-center font-black italic">GOLD IDLE</div>
        </div>

        <div id="card-BTC" class="asset-card" style="--c: #f97316;">
            <div class="empty-msg opacity-20 h-64 flex items-center justify-center font-black italic">BTC IDLE</div>
        </div>

        <div id="card-USDT" class="asset-card" style="--c: #22c55e;">
            <div class="empty-msg opacity-20 h-64 flex items-center justify-center font-black italic">USDT IDLE</div>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fa-IR'); }, 1000);

        function updateUI(asset, data) {
            const container = document.getElementById(`card-${asset}`);
            if(!data) {
                container.classList.remove('active-glow');
                container.innerHTML = `<div class="opacity-10 h-64 flex items-center justify-center font-black italic text-4xl rotate-12">${asset} IDLE</div>`;
                return;
            }

            container.classList.add('active-glow');
            const isBuy = data.mode === 'BUY';
            
            container.innerHTML = `
                <div class="flex justify-between items-start mb-6">
                    <div>
                        <span class="text-[9px] font-black uppercase tracking-[0.3em] ${isBuy ? 'text-emerald-500' : 'text-blue-500'}">${data.mode} STRATEGY</span>
                        <h2 class="text-4xl font-black text-white italic tracking-tighter">${asset}</h2>
                    </div>
                    <div class="text-[9px] font-mono text-zinc-600">${data.timestamp}</div>
                </div>

                <div class="vwap-box p-4 mb-6 text-center">
                    <span class="text-[10px] text-zinc-500 uppercase font-bold block mb-1">Entry VWAP</span>
                    <div class="text-4xl price-mono text-white">${data.vwap.toLocaleString()}</div>
                </div>

                <div class="space-y-3 mb-8">
                    ${data.tiers.map((t, i) => `
                        <div class="flex justify-between items-center p-3 bg-white/5 rounded-xl border border-white/5">
                            <span class="text-[10px] font-black text-zinc-600">P${i+1}</span>
                            <span class="price-mono text-lg text-zinc-200">${t.p.toLocaleString()}</span>
                            <span class="text-[10px] font-bold text-indigo-400">${t.q}</span>
                        </div>
                    `).join('')}
                </div>

                <div class="border-t border-zinc-800 pt-6">
                    <span class="text-[9px] font-black text-zinc-500 uppercase block mb-4 italic">Exit Targets:</span>
                    <div class="grid grid-cols-2 gap-2">
                        ${data.targets.map((p, i) => `
                            <div class="target-tag">
                                <div class="text-[8px] text-zinc-600 font-bold mb-1">GOAL ${i+1}</div>
                                <div class="text-xs price-mono text-emerald-500">${p.toLocaleString()}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        ['GOLD', 'BTC', 'USDT'].forEach(asset => {
            db.ref(`stealth_v1/${asset}`).on('value', s => updateUI(asset, s.val()));
        });
    </script>
</body>
</html>
