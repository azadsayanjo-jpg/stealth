<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>StealthCapital v1 | Vision Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000000; color: #a1a1aa; font-family: 'Vazirmatn'; overflow-x: hidden; }
        
        /* Grid Layout */
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; height: 100vh; background: #18181b; }
        
        /* Asset Column */
        .asset-col { background: #09090b; padding: 20px; position: relative; transition: all 0.5s; display: flex; flex-direction: column; }
        .asset-col:hover { background: #0c0c0e; }
        
        /* Asset Specific Themes */
        .theme-gold { --main: #eab308; --glow: rgba(234, 179, 8, 0.15); }
        .theme-btc { --main: #f97316; --glow: rgba(249, 115, 22, 0.15); }
        .theme-usdt { --main: #22c55e; --glow: rgba(34, 197, 94, 0.15); }

        /* Headers */
        .asset-header { border-bottom: 1px solid #27272a; padding-bottom: 20px; margin-bottom: 20px; }
        .asset-title { font-size: 2rem; font-weight: 900; color: var(--main); text-transform: uppercase; letter-spacing: -1px; font-style: italic; }
        .asset-mode { font-size: 10px; background: var(--main); color: black; padding: 2px 8px; border-radius: 4px; font-weight: bold; display: inline-block; margin-bottom: 5px; }

        /* Data Cards */
        .ladder-item { background: rgba(255,255,255,0.03); border: 1px solid #27272a; padding: 15px; border-radius: 16px; margin-bottom: 10px; display: flex; justify-content: space-between; items-center; }
        .price-text { font-family: monospace; font-size: 1.5rem; color: #e4e4e7; font-weight: bold; }
        
        /* Targets */
        .target-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: auto; }
        .target-box { background: #18181b; border: 1px solid #27272a; padding: 10px; border-radius: 10px; text-align: center; }
        .target-val { font-family: monospace; color: var(--main); font-weight: bold; font-size: 1.1rem; }

        /* Empty State */
        .empty-state { height: 100%; display: flex; align-items: center; justify-content: center; opacity: 0.2; font-weight: 900; letter-spacing: 5px; font-size: 3rem; transform: rotate(-90deg); white-space: nowrap; color: var(--main); }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="dashboard-grid">
        <div id="col-GOLD" class="asset-col theme-gold">
            <div class="empty-state">GOLD IDLE</div>
        </div>

        <div id="col-BTC" class="asset-col theme-btc">
            <div class="empty-state">BTC IDLE</div>
        </div>

        <div id="col-USDT" class="asset-col theme-usdt">
            <div class="empty-state">USDT IDLE</div>
        </div>
    </div>

    <div class="fixed top-0 left-0 w-full p-4 pointer-events-none flex justify-center">
        <div class="bg-black/80 backdrop-blur-md border border-white/10 px-6 py-2 rounded-full text-white/50 text-[10px] font-black uppercase tracking-[0.3em]">
            StealthCapital <span class="text-white">Vision</span>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        function renderColumn(asset, data) {
            const col = document.getElementById(`col-${asset}`);
            
            if (!data) {
                col.innerHTML = `<div class="empty-state">${asset} IDLE</div>`;
                col.style.opacity = "0.3";
                return;
            }

            col.style.opacity = "1";
            col.style.boxShadow = `inset 0 0 100px ${data.mode === 'BUY' ? 'rgba(0,0,0,0.5)' : 'rgba(0,0,0,0.5)'}`;

            const isBuy = data.mode === 'BUY';
            const actionColor = isBuy ? 'Buy Zone' : 'Sell Zone';

            let ladderHTML = data.tiers.map((t, i) => `
                <div class="ladder-item">
                    <div>
                        <div class="text-[9px] font-black text-gray-500 uppercase">Tier ${i+1}</div>
                        <div class="price-text">${t.p.toLocaleString()}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[9px] font-black text-gray-500 uppercase">Volume</div>
                        <div class="text-xs font-bold text-gray-300">${t.v.toLocaleString()}</div>
                    </div>
                </div>
            `).join('');

            let targetsHTML = data.targets.map((t, i) => `
                <div class="target-box">
                    <div class="text-[8px] uppercase text-gray-500 font-bold mb-1">Target ${i+1}</div>
                    <div class="target-val">${t.toLocaleString()}</div>
                </div>
            `).join('');

            col.innerHTML = `
                <div class="asset-header">
                    <span class="asset-mode">${actionColor}</span>
                    <h2 class="asset-title">${asset}</h2>
                    <div class="flex justify-between items-end mt-4">
                        <span class="text-[10px] font-bold text-gray-500 uppercase">Avg. VWAP</span>
                        <span class="text-3xl font-mono text-white font-bold tracking-tighter">${parseFloat(data.vwap).toLocaleString()}</span>
                    </div>
                </div>
                
                <div class="flex-grow overflow-y-auto pr-2">
                    <div class="space-y-1 mb-4">
                        ${ladderHTML}
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-800">
                    <span class="text-[9px] font-black text-gray-600 uppercase block mb-2 text-center">Profit / Exit Zones</span>
                    <div class="target-grid">
                        ${targetsHTML}
                    </div>
                </div>
                
                <div class="text-[9px] text-center text-gray-700 font-mono mt-4 uppercase">
                    Last Update: ${data.timestamp}
                </div>
            `;
        }

        // Listeners for all assets
        db.ref('stealth_capital/GOLD').on('value', s => renderColumn('GOLD', s.val()));
        db.ref('stealth_capital/BTC').on('value', s => renderColumn('BTC', s.val()));
        db.ref('stealth_capital/USDT').on('value', s => renderColumn('USDT', s.val()));

    </script>
</body>
</html>
