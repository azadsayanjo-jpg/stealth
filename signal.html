<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StealthCapital v3.1 | Professional Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #fff; font-family: 'Vazirmatn'; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* کانتینر ویترینی فیکس شده */
        .shelf-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            width: 100%;
        }

        /* کارت با ابعاد استاندارد A6 */
        .a6-card {
            width: 340px;
            background: #09090b;
            border: 1px solid #1f1f23;
            border-radius: 20px;
            padding: 20px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }

        .card-header { border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 15px; }

        /* پله‌های خرید قابل کلیک */
        .step-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; margin-bottom: 8px;
            background: #111; border: 1px solid #1f1f23; border-radius: 12px;
            cursor: pointer; transition: 0.2s;
        }
        .step-row.active { border-color: #10b981; background: rgba(16, 185, 129, 0.15); }
        .step-row.active .step-tag { color: #10b981; }

        /* تارگت‌های قابل کلیک */
        .target-btn {
            background: #000; border: 1px solid #1f1f23;
            border-radius: 10px; padding: 8px; text-align: center;
            cursor: pointer; transition: 0.2s;
        }
        .target-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }

        /* باکس نمایش سود نهایی */
        .profit-display {
            margin-top: 15px; padding: 15px; background: #000;
            border: 1px solid #27272a; border-radius: 12px;
            display: none; text-align: center;
        }
        .profit-display.show { display: block; animation: slideUp 0.3s ease; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .font-mono { font-family: 'Courier New', monospace; font-weight: 700; }
    </style>
</head>
<body>

    <header class="p-4 bg-zinc-950 border-b border-zinc-900 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
            <h1 class="text-xs font-black tracking-widest uppercase italic">STEALTH<span class="text-indigo-500">CAPITAL</span></h1>
        </div>
        <div id="clock" class="text-[10px] font-mono text-zinc-600">00:00:00</div>
    </header>

    <div id="matrix-container" class="shelf-container">
        </div>

    <script>
        const config = { databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fa-IR'); }, 1000);

        function clean(val) { return parseFloat(val.toString().replace(/,/g, '')); }

        db.ref('stealth_matrix').on('value', snapshot => {
            const container = document.getElementById('matrix-container');
            const data = snapshot.val();
            if(!data) { container.innerHTML = '<p class="opacity-20 mt-20 italic">Waiting for Signals...</p>'; return; }

            container.innerHTML = Object.keys(data).map(key => {
                const s = data[key];
                const accent = s.mode === 'BUY' ? '#10b981' : '#3b82f6';
                
                return `
                <div class="a6-card" id="card-${key}" style="--accent: ${accent}">
                    <div class="card-header flex justify-between items-center">
                        <span class="text-[10px] font-black px-2 py-0.5 rounded bg-zinc-900 text-zinc-400 uppercase">${s.path}</span>
                        <span class="text-[8px] font-mono text-zinc-600">${s.ts || ''}</span>
                    </div>

                    <div class="mb-5 text-center">
                        <p class="text-[8px] text-zinc-600 font-bold uppercase tracking-widest mb-1">Entry Average (VWAP)</p>
                        <div class="text-2xl font-mono text-white">${s.vwap}</div>
                    </div>

                    <div class="space-y-2 mb-5">
                        <p class="text-[8px] text-zinc-500 font-black uppercase">Active Entry Steps:</p>
                        ${s.tiers.map((t, i) => `
                            <div class="step-row" onclick="toggleStep(this, '${key}')" data-s="${clean(t.s)}" data-t="${clean(t.t)}">
                                <div>
                                    <div class="step-tag text-[7px] text-zinc-600 font-bold uppercase">STEP ${i+1}</div>
                                    <div class="text-xs font-mono text-zinc-200">${t.p}</div>
                                </div>
                                <div class="text-right">
                                    <div class="text-[10px] text-indigo-400 font-bold font-mono">${t.s} <span class="text-[7px] opacity-30">${s.src}</span></div>
                                    <div class="text-[12px] text-white font-black font-mono">${t.t} <span class="text-[8px] opacity-30">${s.tar}</span></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="mb-4">
                        <p class="text-[8px] text-zinc-500 font-black uppercase mb-2 text-center">Target Exit Price</p>
                        <div class="grid grid-cols-2 gap-2">
                            ${s.targets.map((p, i) => `
                                <div class="target-btn" onclick="selectTarget(this, '${key}', ${clean(p)})">
                                    <div class="text-[7px] text-zinc-600 font-bold mb-0.5">T${i+1}</div>
                                    <div class="text-[10px] font-mono text-emerald-500">${parseFloat(p).toLocaleString()}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div id="profit-box-${key}" class="profit-display">
                        <div class="text-[8px] text-zinc-500 font-black uppercase mb-1">Estimated Net Profit</div>
                        <div id="profit-val-${key}" class="text-xl font-mono text-emerald-400">0.00</div>
                        <div id="profit-pct-${key}" class="text-[10px] font-bold text-zinc-400">0%</div>
                    </div>
                </div>`;
            }).join('');
        });

        window.toggleStep = (el, key) => { el.classList.toggle('active'); runCalc(key); };
        window.selectTarget = (el, key, price) => {
            el.parentNode.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            el.dataset.price = price;
            runCalc(key);
        };

        function runCalc(key) {
            const card = document.getElementById(`card-${key}`);
            const steps = card.querySelectorAll('.step-row.active');
            const target = card.querySelector('.target-btn.active');
            const box = document.getElementById(`profit-box-${key}`);

            if (steps.length === 0 || !target) { box.classList.remove('show'); return; }

            let sumCost = 0, sumAsset = 0;
            steps.forEach(s => { sumCost += parseFloat(s.dataset.s); sumAsset += parseFloat(s.dataset.t); });

            const exitPrice = parseFloat(target.dataset.price);
            const profit = (sumAsset * exitPrice) - sumCost;
            const pct = (profit / sumCost) * 100;

            box.classList.add('show');
            document.getElementById(`profit-val-${key}`).innerText = profit.toLocaleString(undefined, {maximumFractionDigits: 2});
            document.getElementById(`profit-val-${key}`).style.color = profit >= 0 ? '#10b981' : '#ef4444';
            document.getElementById(`profit-pct-${key}`).innerText = (profit >= 0 ? '+' : '') + pct.toFixed(2) + '%';
        }
    </script>
</body>
</html>
