<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Quant Vision Pro Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #010409; color: #c9d1d9; font-family: 'Vazirmatn'; overflow: hidden; }
        .terminal-grid { height: calc(100vh - 120px); }
        .zone-card { background: rgba(13, 17, 23, 0.8); border: 1px solid #30363d; border-radius: 20px; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .buy-active { border-top: 5px solid #238636; box-shadow: 0 0 30px rgba(35, 134, 54, 0.1); opacity: 1 !important; }
        .sell-active { border-top: 5px solid #1f6feb; box-shadow: 0 0 30px rgba(31, 111, 235, 0.1); opacity: 1 !important; }
        .price-font { font-family: 'Courier New', monospace; font-weight: 900; }
        .target-pill { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; }
        .glow-text-buy { color: #3fb950; text-shadow: 0 0 15px rgba(63, 185, 80, 0.4); }
        .glow-text-sell { color: #58a6ff; text-shadow: 0 0 15px rgba(88, 166, 255, 0.4); }
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .scan { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.02); animation: scanline 8s linear infinite; pointer-events: none; }
    </style>
</head>
<body class="p-4 md:p-6">
    <div class="scan"></div>

    <div class="flex justify-between items-center mb-6 px-4">
        <div class="flex items-center gap-4">
            <div class="h-10 w-1 px-1 bg-blue-500 rounded-full"></div>
            <h1 class="text-xl font-black uppercase tracking-tighter text-white">Advanced <span class="text-blue-500 font-mono italic">Cloud.Quant</span></h1>
        </div>
        <div id="sync-info" class="text-[9px] font-bold text-gray-500 uppercase tracking-widest border border-gray-800 px-4 py-2 rounded-full bg-black/50">
            Waiting for Signal...
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 terminal-grid">
        
        <div id="buy-zone" class="zone-card p-6 opacity-20 overflow-y-auto">
            <div class="flex justify-between items-end mb-8 border-b border-gray-800 pb-4">
                <div>
                    <span class="text-[10px] text-emerald-500 font-black uppercase tracking-widest">Entry Strategy</span>
                    <h2 class="text-2xl font-black text-white italic">ACCUMULATION</h2>
                </div>
                <div class="text-left">
                    <span class="text-[9px] text-gray-500 block uppercase font-bold">VWAP IRT</span>
                    <div id="buy-vwap" class="text-4xl price-font glow-text-buy tracking-tighter">-</div>
                </div>
            </div>

            <div id="buy-ladder" class="space-y-3 mb-8">
                </div>

            <div class="mt-auto">
                <span class="text-[9px] text-gray-600 font-black uppercase mb-3 block">Exit Targets (Gross Profit)</span>
                <div id="buy-targets" class="grid grid-cols-4 gap-2"></div>
            </div>
        </div>

        <div id="sell-zone" class="zone-card p-6 opacity-20 overflow-y-auto">
            <div class="flex justify-between items-end mb-8 border-b border-gray-800 pb-4">
                <div>
                    <span class="text-[10px] text-blue-500 font-black uppercase tracking-widest">Exit Strategy</span>
                    <h2 class="text-2xl font-black text-white italic">DISTRIBUTION</h2>
                </div>
                <div class="text-left">
                    <span class="text-[9px] text-gray-500 block uppercase font-bold">VWAP USDT</span>
                    <div id="sell-vwap" class="text-4xl price-font glow-text-sell tracking-tighter">-</div>
                </div>
            </div>

            <div id="sell-ladder" class="space-y-3 mb-8">
                </div>

            <div class="mt-auto">
                <span class="text-[9px] text-gray-600 font-black uppercase mb-3 block">Re-buy Points (Market Correction)</span>
                <div id="sell-targets" class="grid grid-cols-4 gap-2"></div>
            </div>
        </div>

    </div>

    <script>
        const config = { databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        function syncPanel(snap, mode) {
            const data = snap.val();
            const prefix = mode.toLowerCase();
            const zone = document.getElementById(`${prefix}-zone`);
            
            if(!data) {
                zone.classList.remove(`${prefix}-active`);
                zone.style.opacity = "0.2";
                document.getElementById(`${prefix}-vwap`).innerText = "-";
                document.getElementById(`${prefix}-ladder`).innerHTML = `<div class="text-center p-10 text-[10px] text-gray-700 italic">No ${mode} Signal Active</div>`;
                document.getElementById(`${prefix}-targets`).innerHTML = "";
                return;
            }

            zone.classList.add(`${prefix}-active`);
            document.getElementById('sync-info').innerText = `LIVE SYNC: ${data.timestamp}`;
            document.getElementById(`${prefix}-vwap`).innerText = data.vwap.toLocaleString();

            const ladder = document.getElementById(`${prefix}-ladder`);
            ladder.innerHTML = data.tiers.map((t, i) => `
                <div class="flex justify-between items-center p-4 bg-black/40 border border-gray-800 rounded-xl hover:border-gray-600 transition-colors">
                    <div class="flex items-center gap-4">
                        <span class="text-[10px] font-black text-gray-600">L${i+1}</span>
                        <span class="text-xl price-font text-white">${t.p.toLocaleString()}</span>
                    </div>
                    <span class="text-[10px] font-bold text-blue-500">${mode === 'BUY' ? t.v.toLocaleString() + ' IRT' : t.q + ' USDT'}</span>
                </div>
            `).join('');

            const targets = document.getElementById(`${prefix}-targets`);
            const pcts = ['1%', '2%', '3%', '5%'];
            targets.innerHTML = data.targets.map((p, i) => `
                <div class="target-pill p-3 text-center">
                    <div class="text-[8px] text-gray-600 font-bold mb-1">${pcts[i]}</div>
                    <div class="text-[10px] price-font text-emerald-500">${p.toLocaleString()}</div>
                </div>
            `).join('');
        }

        db.ref('signals/buy').on('value', s => syncPanel(s, 'BUY'));
        db.ref('signals/sell').on('value', s => syncPanel(s, 'SELL'));
    </script>
</body>
</html>
