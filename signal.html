<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital v1 | Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #eee; font-family: 'Vazirmatn'; min-height: 100vh; overflow-y: auto; padding-bottom: 100px; }
        .asset-card { background: #0a0a0a; border: 1px solid #1a1a1a; border-radius: 28px; padding: 20px; transition: 0.4s; position: relative; }
        .active-buy { border-top: 5px solid #10b981; box-shadow: 0 -15px 40px -15px rgba(16, 185, 129, 0.2); }
        .active-sell { border-top: 5px solid #3b82f6; box-shadow: 0 -15px 40px -15px rgba(59, 130, 246, 0.2); }
        .price-font { font-family: monospace; font-weight: 900; letter-spacing: -1px; }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-10">
            <h1 class="text-xl font-black italic tracking-tighter uppercase">Stealth<span class="text-indigo-500">Vision</span></h1>
            <div id="sync-status" class="text-[9px] font-black text-zinc-500 border border-zinc-800 px-4 py-2 rounded-full">WAITING FOR CLOUD...</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="card-GOLD" class="asset-card"><div class="h-40 flex items-center justify-center opacity-10 font-black italic">GOLD IDLE</div></div>
            <div id="card-BTC" class="asset-card"><div class="h-40 flex items-center justify-center opacity-10 font-black italic">BTC IDLE</div></div>
            <div id="card-USDT" class="asset-card"><div class="h-40 flex items-center justify-center opacity-10 font-black italic">USDT IDLE</div></div>
        </div>
    </div>

    <script>
        const config = { databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        function updateUI(asset, data) {
            const el = document.getElementById(`card-${asset}`);
            if(!data) { el.innerHTML = `<div class="h-40 flex items-center justify-center opacity-10 font-black italic text-2xl uppercase">${asset} IDLE</div>`; el.className="asset-card"; return; }
            
            const isBuy = data.mode === 'BUY';
            el.className = `asset-card ${isBuy ? 'active-buy' : 'active-sell'}`;
            document.getElementById('sync-status').innerText = `LAST UPDATE: ${data.timestamp}`;

            el.innerHTML = `
                <div class="flex justify-between items-start mb-6">
                    <span class="text-[10px] font-black px-2 py-1 rounded bg-white/5 ${isBuy ? 'text-emerald-500' : 'text-blue-500'} uppercase">${data.mode}</span>
                    <span class="text-3xl font-black italic text-white">${asset}</span>
                </div>
                
                <div class="bg-white/5 p-4 rounded-2xl text-center mb-6">
                    <div class="text-[9px] text-zinc-500 uppercase font-black mb-1">Estimated VWAP</div>
                    <div class="text-3xl price-font text-white">${data.vwap.toLocaleString()}</div>
                </div>

                <div class="space-y-2 mb-6">
                    ${data.tiers.map((t, i) => `
                        <div class="flex justify-between items-center p-3 bg-white/[0.02] border border-white/5 rounded-xl">
                            <span class="text-[9px] font-black text-zinc-600 italic uppercase">Step ${i+1}</span>
                            <span class="price-font text-lg">${t.p.toLocaleString()}</span>
                            <span class="text-[10px] font-bold text-zinc-500">${t.q}</span>
                        </div>
                    `).join('')}
                </div>

                <div class="border-t border-zinc-800 pt-5">
                    <div class="grid grid-cols-2 gap-2">
                        ${data.targets.map((p, i) => `
                            <div class="bg-black border border-zinc-800 p-3 rounded-xl text-center">
                                <div class="text-[8px] text-zinc-600 font-black mb-1">TARGET ${i+1}</div>
                                <div class="text-xs price-font text-emerald-500">${p.toLocaleString()}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        ['GOLD', 'BTC', 'USDT'].forEach(a => db.ref(`stealth_v1/${a}`).on('value', s => updateUI(a, s.val())));
    </script>
</body>
</html>
