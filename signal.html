<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital v1.6 | Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Vazirmatn'; overflow-y: auto; padding-bottom: 80px; }
        .path-card { background: #0a0a0c; border: 1px solid #1a1a1e; border-radius: 24px; padding: 20px; border-top: 4px solid var(--c); margin-bottom: 20px; }
        .font-mono { font-family: monospace; font-weight: 900; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-6 px-2">
            <h1 class="text-xl font-black italic uppercase">Stealth<span class="text-indigo-500">Vision</span></h1>
            <div id="clock" class="text-[9px] font-mono text-zinc-600">00:00:00</div>
        </header>
        <div id="matrix-container"></div>
    </div>

    <script>
        const config = { databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('fa-IR'); }, 1000);

        db.ref('stealth_matrix').on('value', snapshot => {
            const container = document.getElementById('matrix-container');
            const data = snapshot.val();
            if(!data) { container.innerHTML = `<div class="opacity-10 text-center py-20 font-black text-2xl">NO ACTIVE SIGNALS</div>`; return; }

            container.innerHTML = Object.keys(data).map(key => {
                const s = data[key];
                const color = s.mode === 'BUYING' ? '#10b981' : '#3b82f6';
                return `
                <div class="path-card shadow-2xl" style="--c: ${color}">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[9px] font-black px-3 py-1 rounded-full bg-white/5 uppercase" style="color:${color}">${s.path} (${s.mode})</span>
                        <button onclick="firebase.database().ref('stealth_matrix/${key}').remove()" class="text-zinc-800 text-[10px] font-black">CLOSE</button>
                    </div>

                    <div class="text-center mb-8">
                        <p class="text-[9px] text-zinc-600 font-black uppercase tracking-widest">میانگین قیمت اجرای معامله</p>
                        <div class="text-3xl font-mono text-white mt-1">${s.vwap}</div>
                    </div>

                    <div class="space-y-3 mb-8">
                        ${s.tiers.map((t, i) => `
                            <div class="flex justify-between items-center p-4 bg-white/[0.02] border border-zinc-900 rounded-2xl">
                                <span class="text-[9px] font-black text-zinc-700 uppercase">پله ${i+1}</span>
                                <div class="text-right">
                                    <div class="font-mono text-lg text-white">${t.p}</div>
                                    <div class="text-[10px] font-bold text-indigo-400">${t.q} <span class="text-zinc-600 uppercase text-[8px]">${s.tar}</span></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="border-t border-zinc-900 pt-6">
                        <p class="text-[9px] text-zinc-600 font-black uppercase text-center mb-4 italic">تارگت‌های خروج با سود</p>
                        <div class="grid grid-cols-2 gap-2">
                            ${s.targets.map((p, i) => `
                                <div class="bg-zinc-950 border border-zinc-900 p-3 rounded-xl text-center">
                                    <div class="text-[8px] text-zinc-700 font-bold">GOAL ${i+1}</div>
                                    <div class="text-[11px] font-mono text-emerald-500">${parseFloat(p).toLocaleString()}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>`;
            }).join('');
        });
    </script>
</body>
</html>
