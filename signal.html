<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Quant Monitor | Dual Cloud v15</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #010409; color: #c9d1d9; font-family: 'Vazirmatn'; }
        .glass { background: rgba(13, 17, 23, 0.9); border: 1px solid #30363d; border-radius: 20px; }
        .buy-gradient { border-top: 4px solid #238636; }
        .sell-gradient { border-top: 4px solid #1f6feb; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-center glass p-4 px-8 border-b border-blue-500/30">
            <h1 class="text-xl font-black italic tracking-widest">QUANT <span class="text-blue-500">CLOUD</span></h1>
            <div id="status-label" class="text-[10px] font-bold text-gray-500 uppercase">Monitoring Signals...</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div id="buy-zone" class="glass p-6 buy-gradient space-y-6 transition-all opacity-20">
                <div class="flex justify-between items-end border-b border-green-900 pb-4">
                    <h2 class="text-xl font-black text-green-500 font-mono italic">BUY.ACC</h2>
                    <div class="text-left">
                        <span id="buy-vwap" class="text-3xl font-black text-white font-mono">-</span>
                    </div>
                </div>
                <div id="buy-ladder" class="space-y-3"></div>
                <div id="buy-targets" class="grid grid-cols-4 gap-2"></div>
            </div>

            <div id="sell-zone" class="glass p-6 sell-gradient space-y-6 transition-all opacity-20">
                <div class="flex justify-between items-end border-b border-blue-900 pb-4">
                    <h2 class="text-xl font-black text-blue-500 font-mono italic">SELL.DIST</h2>
                    <div class="text-left">
                        <span id="sell-vwap" class="text-3xl font-black text-white font-mono">-</span>
                    </div>
                </div>
                <div id="sell-ladder" class="space-y-3"></div>
                <div id="sell-targets" class="grid grid-cols-4 gap-2"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function render(sig, mode) {
            const prefix = mode.toLowerCase();
            const zone = document.getElementById(`${prefix}-zone`);
            
            if(!sig) {
                zone.style.opacity = "0.2";
                document.getElementById(`${prefix}-vwap`).innerText = "-";
                document.getElementById(`${prefix}-ladder`).innerHTML = "";
                document.getElementById(`${prefix}-targets`).innerHTML = "";
                return;
            }

            zone.style.opacity = "1";
            document.getElementById(`${prefix}-vwap`).innerText = sig.vwap.toLocaleString();

            document.getElementById(`${prefix}-ladder`).innerHTML = sig.tiers.map((t, i) => `
                <div class="p-3 bg-black/40 border border-white/5 rounded-lg flex justify-between">
                    <span class="text-[10px] text-gray-500 font-bold">LEVEL ${i+1}</span>
                    <span class="font-mono font-bold">${t.p.toLocaleString()}</span>
                </div>
            `).join('');

            document.getElementById(`${prefix}-targets`).innerHTML = sig.targets.map((p, i) => `
                <div class="bg-gray-800/50 p-2 text-center text-[10px] font-mono font-bold text-emerald-500 rounded">${p.toLocaleString()}</div>
            `).join('');
        }

        // گوش دادن به تغییرات هر دو شاخه
        database.ref('signals/buy').on('value', (s) => render(s.val(), 'BUY'));
        database.ref('signals/sell').on('value', (s) => render(s.val(), 'SELL'));
    </script>
</body>
</html>
