<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stealth Cloud Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #020617; color: #f1f5f9; }
        .premium-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 1.5rem; }
        .neo-input { background: #020617; border: 1px solid #334155; color: white; padding: 12px; border-radius: 12px; width: 100%; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black">مدیریت نقدینگی <span class="text-blue-500">CLOUD</span></h1>
            <div id="sync-status" class="text-[10px] text-emerald-500 font-bold font-mono">در حال اتصال...</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="premium-card p-4 text-right">
                <span class="text-[10px] text-slate-500">موجودی مرجع</span>
                <input type="number" id="base-balance" onchange="syncToCloud()" class="block w-full bg-transparent text-xl font-bold font-mono outline-none">
            </div>
            <div class="premium-card p-4 text-right">
                <span class="text-[10px] text-slate-500">سود کل (تومان)</span>
                <div id="profit-box" class="text-xl font-bold text-blue-400 font-mono">0</div>
            </div>
            <a href="monitor.html" class="premium-card p-4 flex items-center justify-center text-emerald-400 gap-2 border-emerald-500/20">
                <i class="fa-solid fa-gauge"></i> <b>مشاهده مانیتورینگ</b>
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-5 premium-card p-6 text-right">
                <form id="trade-form" class="space-y-4">
                    <input type="text" id="cust-name" required class="neo-input" placeholder="نام مشتری">
                    <input type="number" id="val-toman" required class="neo-input" placeholder="مبلغ (تومان)">
                    <input type="number" id="val-market" required class="neo-input" placeholder="نرخ نوبیتکس">
                    <button type="submit" class="w-full bg-blue-600 py-4 rounded-xl font-bold">ثبت تراکنش ابری</button>
                </form>
            </div>
            <div class="lg:col-span-7 premium-card overflow-hidden">
                <table class="w-full text-[11px] text-right">
                    <thead class="bg-slate-900">
                        <tr><th class="p-4">مشتری</th><th class="p-4">USDT</th><th class="p-4 text-center">حذف</th></tr>
                    </thead>
                    <tbody id="tx-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnTDnLIOwORgu6LpYjj3jHbMDk8v-MVjg",
            authDomain: "sellusd-ea252.firebaseapp.com",
            databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com",
            projectId: "sellusd-ea252",
            storageBucket: "sellusd-ea252.firebasestorage.app",
            messagingSenderId: "143438594798",
            appId: "1:143438594798:web:40ca10e776b9b9beb4a9ff"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'stealth_data');

        window.trades = [];
        const FEE = 0.75;

        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.trades = data.trades || [];
                document.getElementById('base-balance').value = data.base || 1000;
                document.getElementById('sync-status').innerText = 'CLOUD SYNCED: ' + new Date().toLocaleTimeString();
                updateUI();
            }
        });

        window.syncToCloud = function() {
            set(dbRef, { trades: window.trades, base: document.getElementById('base-balance').value });
        };

        window.updateUI = function() {
            const table = document.getElementById('tx-table');
            let totalProfit = 0;
            table.innerHTML = '';
            window.trades.forEach((t, i) => {
                totalProfit += t.profit;
                table.innerHTML += `<tr class="border-b border-slate-800">
                    <td class="p-4 font-bold">${t.name}</td>
                    <td class="p-4 font-mono text-blue-400">${t.qnt.toFixed(2)}</td>
                    <td class="p-4 text-center"><button onclick="deleteTrade(${i})" class="text-red-500"><i class="fa-solid fa-trash"></i></button></td>
                </tr>`;
            });
            document.getElementById('profit-box').innerText = Math.round(totalProfit).toLocaleString();
        };

        document.getElementById('trade-form').onsubmit = function(e) {
            e.preventDefault();
            const toman = parseFloat(document.getElementById('val-toman').value);
            const market = parseFloat(document.getElementById('val-market').value);
            const finalRate = market * 1.0075;
            const qnt = toman / finalRate;
            window.trades.unshift({ name: document.getElementById('cust-name').value, total: toman, market, qnt, profit: toman - (qnt * market), date: new Date().toLocaleDateString('fa-IR') });
            window.syncToCloud();
            this.reset();
        };

        window.deleteTrade = function(i) { if(confirm('حذف؟')) { window.trades.splice(i,1); window.syncToCloud(); } };
    </script>
</body>
</html>
