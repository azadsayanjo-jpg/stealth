<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stealth Capital | Admin Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #3b82f6; }
        body { font-family: 'Vazirmatn', sans-serif; background: #020617; color: #f1f5f9; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .neo-input { background: #020617; border: 1px solid #334155; color: white; transition: 0.3s; }
        .neo-input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); outline: none; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col lg:flex-row h-screen overflow-hidden">

    <aside class="w-full lg:w-72 border-b lg:border-b-0 lg:border-l border-slate-800 flex flex-col p-4 glass z-50">
        <div class="flex items-center gap-3 mb-8 lg:mb-12">
            <div class="w-10 h-10 lg:w-12 lg:h-12 bg-gradient-to-tr from-blue-700 to-blue-400 rounded-2xl flex items-center justify-center shadow-2xl">
                <i class="fa-solid fa-cloud text-white"></i>
            </div>
            <div>
                <h1 class="font-black text-lg tracking-tighter">STEALTH <span class="text-blue-500">CLOUD</span></h1>
                <p id="connection-status" class="text-[9px] text-yellow-500 font-bold uppercase animate-pulse">در حال اتصال...</p>
            </div>
        </div>
        <nav class="flex lg:flex-col gap-2 overflow-x-auto lg:overflow-visible">
            <button onclick="showPage('dashboard')" class="p-3 lg:p-4 flex items-center gap-3 rounded-xl hover:bg-white/5 w-full text-right transition-all bg-blue-600/10 text-blue-400 border border-blue-500/20">
                <i class="fa-solid fa-house-chimney w-5 text-center"></i><span class="text-sm font-bold whitespace-nowrap">میز فرمان</span>
            </button>
            <a href="monitor.html" target="_blank" class="p-3 lg:p-4 flex items-center gap-3 rounded-xl hover:bg-white/5 w-full text-right text-emerald-400 border border-emerald-500/10">
                <i class="fa-solid fa-chart-line w-5 text-center"></i><span class="text-sm font-bold whitespace-nowrap">باز کردن مانیتور</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 h-full overflow-y-auto p-4 lg:p-10 relative">
        <div id="page-dashboard" class="page active max-w-6xl mx-auto">
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                <div class="glass p-5 rounded-3xl relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-24 h-24 bg-blue-500/10 rounded-full group-hover:bg-blue-500/20 transition-all"></div>
                    <h3 class="text-[10px] font-black text-slate-500 mb-2 uppercase">موجودی مرجع (USDT)</h3>
                    <input type="number" id="base-balance" onchange="syncToCloud()" class="bg-transparent text-2xl font-black text-white font-mono w-full outline-none" value="1000">
                </div>
                <div class="glass p-5 rounded-3xl border-emerald-500/10">
                    <h3 class="text-[10px] font-black text-slate-500 mb-2 uppercase">دست فامیل (USDT)</h3>
                    <p id="total-held" class="text-2xl font-black text-emerald-400 font-mono">0.00</p>
                </div>
                <div class="glass p-5 rounded-3xl border-purple-500/10">
                    <h3 class="text-[10px] font-black text-slate-500 mb-2 uppercase">نقدینگی صندوق (تومان)</h3>
                    <p id="toman-box" class="text-2xl font-black text-white font-mono">0</p>
                </div>
                <div class="glass p-5 rounded-3xl border-orange-500/10">
                    <h3 class="text-[10px] font-black text-slate-500 mb-2 uppercase">سود کل (تومان)</h3>
                    <p id="profit-box" class="text-2xl font-black text-orange-400 font-mono">0</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div class="lg:col-span-4">
                    <div class="glass p-6 rounded-[2rem]">
                        <div class="flex bg-slate-900 p-1 rounded-xl mb-6">
                            <button onclick="setMode('SELL')" id="btn-sell" class="flex-1 py-2 text-xs font-black rounded-lg bg-blue-600 text-white shadow-lg">فروش</button>
                            <button onclick="setMode('BUYBACK')" id="btn-buy" class="flex-1 py-2 text-xs font-black rounded-lg text-slate-500 hover:text-white">بازخرید</button>
                        </div>
                        <form id="trade-form" class="space-y-4">
                            <input type="text" id="cust-name" required class="w-full neo-input p-4 rounded-xl text-sm" placeholder="نام مشتری / توضیحات">
                            <input type="number" id="val-toman" required class="w-full neo-input p-4 rounded-xl text-lg font-mono" placeholder="مبلغ (تومان)">
                            <input type="number" id="val-market" required class="w-full neo-input p-4 rounded-xl text-lg font-mono" placeholder="نرخ نوبیتکس">
                            <div class="flex gap-2 text-[10px] text-slate-500 px-2">
                                <span>کارمزد سیستم: <b class="text-white">0.75%</b></span>
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 py-4 rounded-xl font-black hover:shadow-blue-500/20 hover:shadow-lg transition-all text-sm">
                                ثبت و ذخیره در ابر <i class="fa-solid fa-cloud-arrow-up mr-1"></i>
                            </button>
                        </form>
                        
                        <div class="mt-8 pt-8 border-t border-slate-700/50">
                            <h4 class="text-xs font-bold text-slate-400 mb-3">شارژ سیستمی (بدون سود)</h4>
                            <div class="flex gap-2">
                                <input type="number" id="refill-rate" class="neo-input p-2 rounded-lg text-xs w-24" placeholder="نرخ تبدیل">
                                <button onclick="systemRefill()" class="flex-1 bg-slate-800 hover:bg-emerald-600/20 text-emerald-500 text-xs font-bold rounded-lg transition-all border border-emerald-500/20">ثبت شارژ</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-8">
                    <div class="glass rounded-[2rem] overflow-hidden min-h-[500px]">
                        <table class="w-full text-right text-xs">
                            <thead class="bg-slate-900/50 text-slate-400">
                                <tr>
                                    <th class="p-4">زمان</th>
                                    <th class="p-4">شرح</th>
                                    <th class="p-4 text-center">USDT</th>
                                    <th class="p-4 text-center">تومان</th>
                                    <th class="p-4 text-center">عملیات</th>
                                </tr>
                            </thead>
                            <tbody id="tx-table" class="divide-y divide-slate-800/50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // *** کلیدهای اختصاصی شما ***
        const firebaseConfig = {
            apiKey: "AIzaSyDnTDnLIOwORgu6LpYjj3jHbMDk8v-MVjg",
            authDomain: "sellusd-ea252.firebaseapp.com",
            databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com",
            projectId: "sellusd-ea252",
            storageBucket: "sellusd-ea252.firebasestorage.app",
            messagingSenderId: "143438594798",
            appId: "1:143438594798:web:40ca10e776b9b9beb4a9ff",
            measurementId: "G-BLRBXV3582"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'stealth_data');

        window.trades = [];
        let mode = 'SELL';
        const FEE = 0.75;

        // 1. خواندن اطلاعات از فایربیس
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            document.getElementById('connection-status').innerText = '● متصل به ابر';
            document.getElementById('connection-status').className = 'text-[9px] text-emerald-500 font-bold uppercase';
            
            if (data) {
                window.trades = data.trades || [];
                document.getElementById('base-balance').value = data.base || 1000;
                updateUI();
            } else {
                // اگر دیتابیس خالی بود
                window.trades = [];
                updateUI();
            }
        });

        // 2. ذخیره اطلاعات در فایربیس
        window.syncToCloud = function() {
            document.getElementById('connection-status').innerText = '... در حال ذخیره';
            document.getElementById('connection-status').className = 'text-[9px] text-yellow-500 font-bold uppercase';
            
            set(dbRef, {
                trades: window.trades,
                base: document.getElementById('base-balance').value
            }).then(() => {
                document.getElementById('connection-status').innerText = '● متصل به ابر';
                document.getElementById('connection-status').className = 'text-[9px] text-emerald-500 font-bold uppercase';
            });
        };

        // 3. منطق برنامه (UI)
        window.updateUI = function() {
            const table = document.getElementById('tx-table');
            let totalInHands = 0, totalToman = 0, totalProfit = 0;

            table.innerHTML = '';
            
            // اگر تراکنشی نیست
            if(window.trades.length === 0) {
                table.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500">هیچ داده‌ای یافت نشد</td></tr>';
                return;
            }

            window.trades.forEach((t, i) => {
                // محاسبات
                if(t.name !== 'SYSTEM_REFILL') {
                    totalInHands += (t.type === 'SELL' ? t.qnt : -t.qnt);
                }
                totalToman += (t.type === 'SELL' ? t.total : -t.total);
                totalProfit += t.profit;

                // رندر جدول
                const isSys = t.name === 'SYSTEM_REFILL';
                const rowClass = isSys ? 'bg-emerald-500/5' : '';
                const nameHtml = isSys ? '<span class="text-emerald-400 font-bold"><i class="fa-solid fa-bolt mr-1"></i> شارژ خزانه</span>' : `<span class="font-bold text-white">${t.name}</span> <span class="text-[9px] px-1 bg-slate-800 rounded text-slate-400">${t.type}</span>`;
                
                table.innerHTML += `
                    <tr class="${rowClass} hover:bg-white/5 transition-colors group">
                        <td class="p-4 text-slate-500 font-mono text-[10px]">${t.date}</td>
                        <td class="p-4">${nameHtml}</td>
                        <td class="p-4 text-center font-bold text-blue-400 font-mono" dir="ltr">${t.qnt.toFixed(2)}</td>
                        <td class="p-4 text-center font-bold font-mono text-slate-300">${Math.round(t.total).toLocaleString()}</td>
                        <td class="p-4 text-center">
                            <button onclick="deleteTrade(${i})" class="w-8 h-8 rounded-lg bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });

            document.getElementById('total-held').innerText = totalInHands.toFixed(2);
            document.getElementById('toman-box').innerText = Math.round(totalToman).toLocaleString();
            document.getElementById('profit-box').innerText = Math.round(totalProfit).toLocaleString();
        };

        // ثبت فرم
        document.getElementById('trade-form').onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const toman = parseFloat(document.getElementById('val-toman').value);
            const market = parseFloat(document.getElementById('val-market').value);
            
            let finalRate = mode === 'SELL' ? market * (1 + (FEE/100)) : market * (1 - (FEE/100));
            let qnt = toman / finalRate;
            let profit = mode === 'SELL' ? toman - (qnt * market) : (qnt * market) - toman;

            window.trades.unshift({
                id: Date.now(),
                type: mode,
                name: name,
                total: toman,
                market: market,
                qnt: qnt,
                profit: profit,
                date: new Date().toLocaleDateString('fa-IR', {hour: '2-digit', minute:'2-digit'})
            });

            window.syncToCloud();
            this.reset();
        };

        // شارژ سیستمی
        window.systemRefill = function() {
            const rate = parseFloat(document.getElementById('refill-rate').value);
            const currentToman = parseFloat(document.getElementById('toman-box').innerText.replace(/,/g, ''));
            
            if(!rate || currentToman <= 0) return alert('خطا: نرخ یا موجودی نامعتبر');

            const addedTether = currentToman / rate;
            const currentBase = parseFloat(document.getElementById('base-balance').value);
            
            // آپدیت موجودی پایه
            document.getElementById('base-balance').value = (currentBase + addedTether).toFixed(2);
            
            // ثبت سند تسویه
            window.trades.unshift({
                id: Date.now(),
                type: 'BUYBACK',
                name: 'SYSTEM_REFILL',
                total: currentToman,
                market: rate,
                qnt: addedTether,
                profit: 0,
                date: new Date().toLocaleDateString('fa-IR', {hour: '2-digit', minute:'2-digit'})
            });
            
            window.syncToCloud();
        };

        window.deleteTrade = function(i) {
            if(confirm('حذف شود؟')) {
                window.trades.splice(i, 1);
                window.syncToCloud();
            }
        };

        window.showPage = function(pageId) {
            // ساده‌سازی شده برای تک صفحه‌ای
        };

        window.setMode = function(m) {
            mode = m;
            document.getElementById('btn-sell').className = m === 'SELL' ? 'flex-1 py-2 text-xs font-black rounded-lg bg-blue-600 text-white shadow-lg' : 'flex-1 py-2 text-xs font-black rounded-lg text-slate-500';
            document.getElementById('btn-buy').className = m === 'BUYBACK' ? 'flex-1 py-2 text-xs font-black rounded-lg bg-orange-600 text-white shadow-lg' : 'flex-1 py-2 text-xs font-black rounded-lg text-slate-500';
        };
    </script>
</body>
</html>
