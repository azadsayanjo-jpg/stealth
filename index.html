<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital Cloud v4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #3b82f6; }
        body { font-family: 'Vazirmatn', sans-serif; background: #020617; color: #f1f5f9; min-height: 100vh; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .premium-card { background: linear-gradient(145deg, #1e293b, #0f172a); border: 1px solid rgba(59, 130, 246, 0.2); }
        .neo-input { background: #020617; border: 1px solid #334155; color: white; transition: 0.3s; }
        .neo-input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); outline: none; }
        .sidebar-item { transition: 0.3s; cursor: pointer; border-right: 4px solid transparent; }
        .sidebar-item.active { background: rgba(59, 130, 246, 0.1); border-right-color: var(--accent); color: var(--accent); }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex">

    <aside class="w-20 lg:w-72 border-l border-slate-800 flex flex-col p-6 glass z-50">
        <div class="flex items-center gap-3 mb-12">
            <div class="w-12 h-12 bg-gradient-to-tr from-blue-700 to-blue-400 rounded-2xl flex items-center justify-center shadow-2xl">
                <i class="fa-solid fa-cloud text-white text-xl"></i>
            </div>
            <div class="hidden lg:block">
                <h1 class="font-black text-xl tracking-tighter">STEALTH <span class="text-blue-500">CLOUD</span></h1>
                <p class="text-[9px] text-slate-500 font-bold uppercase">Firebase Real-time v4.0</p>
            </div>
        </div>
        <nav class="space-y-3 flex-1">
            <div onclick="showPage('dashboard', this)" class="sidebar-item active p-4 flex items-center gap-4 rounded-xl">
                <i class="fa-solid fa-house-chimney w-5"></i><span class="hidden lg:block text-sm font-bold">میز فرمان</span>
            </div>
            <div onclick="showPage('wallet', this)" class="sidebar-item p-4 flex items-center gap-4 rounded-xl text-slate-400">
                <i class="fa-solid fa-building-columns w-5"></i><span class="hidden lg:block text-sm font-bold">مدیریت خزانه</span>
            </div>
            <a href="monitor.html" class="p-4 flex items-center gap-4 rounded-xl text-emerald-400 border border-emerald-500/10 bg-emerald-500/5 hover:bg-emerald-500/10">
                <i class="fa-solid fa-gauge-high w-5 text-center"></i><span class="hidden lg:block text-sm font-bold">مانیتورینگ</span>
            </a>
        </nav>
        <div id="sync-status" class="text-[8px] text-slate-600 font-mono mt-4">SYNCING...</div>
    </aside>

    <main class="flex-1 h-screen overflow-y-auto p-6 lg:p-12">
        <div id="page-dashboard" class="page active">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10 text-right">
                <div class="premium-card p-6 rounded-[2rem]">
                    <h3 class="text-[10px] font-black text-slate-500 mb-2 uppercase">موجودی مرجع</h3>
                    <input type="number" id="base-balance" onchange="syncToCloud()" class="text-3xl font-black bg-transparent w-full focus:outline-none font-mono text-white" value="1000">
                </div>
                <div class="premium-card p-6 rounded-[2rem] border-emerald-500/20">
                    <h3 class="text-[10px] font-black text-slate-500 mb-2 uppercase">در دست فامیل</h3>
                    <p id="total-held" class="text-3xl font-black text-emerald-400 font-mono">0</p>
                </div>
                <div class="premium-card p-6 rounded-[2rem] border-blue-500/20">
                    <h3 class="text-[10px] font-black text-slate-400 mb-2 uppercase">نقدینگی صندوق</h3>
                    <p id="toman-box" class="text-3xl font-black font-mono text-white">0</p>
                </div>
                <div class="premium-card p-6 rounded-[2rem] border-purple-500/20">
                    <h3 class="text-[10px] font-black text-purple-400 mb-2 uppercase">سود کل</h3>
                    <p id="profit-box" class="text-3xl font-black text-purple-400 font-mono">0</p>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 text-right">
                <div class="lg:col-span-4">
                    <div class="premium-card p-8 rounded-[2.5rem]">
                        <div class="flex bg-slate-900 p-1.5 rounded-2xl mb-8">
                            <button onclick="setMode('SELL')" id="btn-sell" class="flex-1 py-3 text-xs font-black rounded-xl bg-blue-600 text-white">فروش</button>
                            <button onclick="setMode('BUYBACK')" id="btn-buy" class="flex-1 py-3 text-xs font-black rounded-xl text-slate-500">بازخرید</button>
                        </div>
                        <form id="trade-form" class="space-y-4">
                            <input type="text" id="cust-name" required class="w-full neo-input p-4 rounded-2xl text-sm" placeholder="نام مشتری">
                            <input type="number" id="val-toman" required class="w-full neo-input p-4 rounded-2xl text-lg font-mono" placeholder="مبلغ (تومان)">
                            <input type="number" id="val-market" required class="w-full neo-input p-4 rounded-2xl text-lg font-mono" placeholder="نرخ نوبیتکس">
                            <button type="submit" class="w-full bg-blue-600 py-5 rounded-2xl font-black hover:bg-blue-500 transition-all shadow-lg shadow-blue-900/20">ثبت در ابر</button>
                        </form>
                    </div>
                </div>
                <div class="lg:col-span-8 premium-card rounded-[2.5rem] overflow-hidden">
                    <table class="w-full text-right text-[11px]">
                        <thead class="bg-slate-900 text-slate-500 uppercase font-bold text-[9px]">
                            <tr><th class="p-5">مشتری</th><th class="p-5 text-center">مقدار USDT</th><th class="p-5 text-center">تومان</th><th class="p-5 text-center">عملیات</th></tr>
                        </thead>
                        <tbody id="tx-table"></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div id="page-wallet" class="page text-right">
            <h2 class="text-3xl font-black mb-8">شارژ خزانه</h2>
            <div class="max-w-xl premium-card p-8 rounded-[2.5rem] border-emerald-500/30">
                <div class="bg-slate-900 p-6 rounded-2xl mb-6 border border-slate-800">
                    <div class="text-[10px] text-slate-500 mb-1">تومان نقد در صندوق:</div>
                    <div id="wallet-toman-display" class="text-3xl font-black text-white font-mono">0</div>
                </div>
                <input type="number" id="refill-rate" class="w-full neo-input p-4 rounded-2xl text-lg font-mono mb-4" placeholder="نرخ تبدیل">
                <button onclick="systemRefill()" class="w-full bg-emerald-600 py-5 rounded-2xl font-black hover:bg-emerald-500 shadow-xl transition-all">تایید و همگام‌سازی ابر</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // تنظیمات فایربیس (اطلاعات خودت را اینجا بذار)
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project.firebaseio.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'stealth_data');

        window.trades = [];
        let mode = 'SELL';
        const FEE = 0.75;

        // خواندن لحظه‌ای
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.trades = data.trades || [];
                document.getElementById('base-balance').value = data.base || 1000;
                document.getElementById('sync-status').innerText = 'CLOUD SYNCED: ' + new Date().toLocaleTimeString();
                updateUI();
            }
        });

        window.syncToCloud = function() {
            const base = document.getElementById('base-balance').value;
            set(dbRef, { trades: window.trades, base: base });
        };

        window.updateUI = function() {
            const baseBalance = parseFloat(document.getElementById('base-balance').value) || 0;
            const table = document.getElementById('tx-table');
            let totalInHands = 0, totalToman = 0, totalProfit = 0;

            table.innerHTML = '';
            window.trades.forEach((t, i) => {
                if(t.name !== 'SYSTEM_REFILL') totalInHands += (t.type === 'SELL' ? t.qnt : -t.qnt);
                totalToman += (t.type === 'SELL' ? t.total : -t.total);
                totalProfit += t.profit;

                table.innerHTML += `
                    <tr class="border-b border-slate-800/50 hover:bg-white/5 group">
                        <td class="p-5 font-bold">${t.name === 'SYSTEM_REFILL' ? '<span class="text-emerald-400">شارژ خزانه</span>' : t.name}</td>
                        <td class="p-5 text-center font-bold text-blue-400 font-mono">${t.qnt.toFixed(2)}</td>
                        <td class="p-5 text-center font-black font-mono">${Math.round(t.total).toLocaleString()}</td>
                        <td class="p-5 text-center">
                            <button onclick="deleteTrade(${i})" class="w-8 h-8 rounded-lg bg-red-600/10 text-red-400 hover:bg-red-600 hover:text-white transition-all opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash text-[10px]"></i></button>
                        </td>
                    </tr>`;
            });

            document.getElementById('total-held').innerText = totalInHands.toFixed(2);
            document.getElementById('toman-box').innerText = Math.round(totalToman).toLocaleString();
            document.getElementById('wallet-toman-display').innerText = Math.round(totalToman).toLocaleString();
            document.getElementById('profit-box').innerText = Math.round(totalProfit).toLocaleString();
        };

        document.getElementById('trade-form').onsubmit = function(e) {
            e.preventDefault();
            const name = document.getElementById('cust-name').value;
            const toman = parseFloat(document.getElementById('val-toman').value);
            const market = parseFloat(document.getElementById('val-market').value);
            let finalRate = mode === 'SELL' ? market * (1 + (FEE/100)) : market * (1 - (FEE/100));
            let qnt = toman / finalRate;
            let profit = mode === 'SELL' ? toman - (qnt * market) : (qnt * market) - toman;
            
            window.trades.unshift({ id: Date.now(), type: mode, name, total: toman, rate: finalRate, market, qnt, profit, date: new Date().toLocaleDateString('fa-IR') });
            window.syncToCloud();
            this.reset();
        };

        window.systemRefill = function() {
            const totalToman = window.trades.reduce((acc, t) => acc + (t.type === 'SELL' ? t.total : -t.total), 0);
            const rate = parseFloat(document.getElementById('refill-rate').value);
            if(!rate || totalToman <= 0) return;
            const addedTether = totalToman / rate;
            const currentBase = parseFloat(document.getElementById('base-balance').value) || 0;
            
            document.getElementById('base-balance').value = (currentBase + addedTether).toFixed(2);
            window.trades.unshift({ type: 'BUYBACK', name: 'SYSTEM_REFILL', total: totalToman, rate: rate, market: rate, qnt: addedTether, profit: 0, date: new Date().toLocaleDateString('fa-IR') });
            window.syncToCloud();
        };

        window.deleteTrade = function(i) { if(confirm('حذف شود؟')) { window.trades.splice(i, 1); window.syncToCloud(); } };
        window.showPage = function(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        };
        window.setMode = function(m) {
            mode = m;
            document.getElementById('btn-sell').className = m === 'SELL' ? 'flex-1 py-3 text-xs font-black rounded-xl bg-blue-600 text-white' : 'flex-1 py-3 text-xs font-black rounded-xl text-slate-500';
            document.getElementById('btn-buy').className = m === 'BUYBACK' ? 'flex-1 py-3 text-xs font-black rounded-xl bg-orange-600 text-white' : 'flex-1 py-3 text-xs font-black rounded-xl text-slate-500';
        };
    </script>
</body>
</html>
