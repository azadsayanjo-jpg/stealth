<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital v1 | Commander Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Vazirmatn'; padding-bottom: 40px; }
        .matrix-card { background: #0f0f12; border: 1px solid #222; border-radius: 24px; padding: 20px; }
        .asset-btn { border: 1px solid #333; opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .asset-btn.active { opacity: 1; border-color: var(--c); background: var(--b); color: var(--c); transform: scale(1.05); }
        .input-matrix { background: #000; border: 1px solid #333; border-radius: 12px; padding: 12px; width: 100%; text-align: center; font-family: monospace; }
        .path-arrow { font-size: 24px; color: #6366f1; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto space-y-6">
        <header class="flex justify-between items-center bg-zinc-900 p-5 rounded-3xl border border-zinc-800">
            <h1 class="text-xl font-black italic">Stealth<span class="text-indigo-500">Matrix</span></h1>
            <div id="status" class="w-3 h-3 bg-red-500 rounded-full"></div>
        </header>

        <div class="matrix-card space-y-4">
            <div class="flex justify-between items-center px-2">
                <span class="text-[10px] font-black text-zinc-500 uppercase">مبدأ (Source)</span>
                <div class="path-arrow">→</div>
                <span class="text-[10px] font-black text-zinc-500 uppercase">مقصد (Target)</span>
            </div>
            
            <div class="grid grid-cols-2 gap-8">
                <div class="space-y-2" id="source-group">
                    <button onclick="setSource('IRT', '#fff')" id="src-IRT" class="asset-btn w-full p-3 rounded-xl text-[10px] font-bold" style="--c:#fff; --b:rgba(255,255,255,0.1)">تومان IRT</button>
                    <button onclick="setSource('USDT', '#22c55e')" id="src-USDT" class="asset-btn w-full p-3 rounded-xl text-[10px] font-bold" style="--c:#22c55e; --b:rgba(34,197,94,0.1)">تتر USDT</button>
                    <button onclick="setSource('GOLD', '#eab308')" id="src-GOLD" class="asset-btn w-full p-3 rounded-xl text-[10px] font-bold" style="--c:#eab308; --b:rgba(234,179,8,0.1)">طلا GOLD</button>
                    <button onclick="setSource('BTC', '#f97316')" id="src-BTC" class="asset-btn w-full p-3 rounded-xl text-[10px] font-bold" style="--c:#f97316; --b:rgba(249,115,22,0.1)">بیت‌کوین BTC</button>
                </div>
                <div class="space-y-2" id="target-group">
                    <button onclick="setTarget('IRT', '#fff')" id="tar-IRT" class="asset-btn w-full p-3 rounded-xl text-[10px] font-bold" style="--c:#fff; --b:rgba(255,255,255,0.1)">تومان IRT</button>
                    <button onclick="setTarget('USDT', '#22c55e')" id="tar-USDT" class="asset-btn w-full p-3 rounded-xl text-[10px] font-bold" style="--c:#22c55e; --b:rgba(34,197,94,0.1)">تتر USDT</button>
                    <button onclick="setTarget('GOLD', '#eab308')" id="tar-GOLD" class="asset-btn w-full p-3 rounded-xl text-[10px] font-bold" style="--c:#eab308; --b:rgba(234,179,8,0.1)">طلا GOLD</button>
                    <button onclick="setTarget('BTC', '#f97316')" id="tar-BTC" class="asset-btn w-full p-3 rounded-xl text-[10px] font-bold" style="--c:#f97316; --b:rgba(249,115,22,0.1)">بیت‌کوین BTC</button>
                </div>
            </div>
        </div>

        <div class="matrix-card space-y-4">
            <div>
                <label id="cap-label" class="text-[10px] font-black text-zinc-500 uppercase mb-2 block mr-1">مقدار دارایی مبدأ</label>
                <div class="relative">
                    <input type="number" id="cap" class="input-matrix text-xl text-indigo-400" placeholder="0.00">
                    <button onclick="document.getElementById('cap').value=1100" class="absolute left-2 top-3 bg-zinc-800 text-[8px] px-2 py-1 rounded">1100</button>
                </div>
            </div>
            <div>
                <label id="ref-label" class="text-[10px] font-black text-zinc-500 uppercase mb-2 block mr-1 text-center">نرخ تبدیل (هر واحد مبدأ به مقصد)</label>
                <input type="number" id="ref" class="input-matrix text-xl" placeholder="مثلاً 65000">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-black text-zinc-500 block text-center uppercase mb-2">فاصله پله (Gap %)</label>
                    <input type="number" id="gap" class="input-matrix" value="1.2" step="0.1">
                </div>
                <div>
                    <label class="text-[10px] font-black text-zinc-500 block text-center uppercase mb-2">کارمزد (Fee %)</label>
                    <input type="number" id="fee" class="input-matrix" value="0.2" step="0.01">
                </div>
            </div>
        </div>

        <button onclick="transmit()" id="mainBtn" class="w-full bg-indigo-600 py-5 rounded-3xl font-black uppercase tracking-widest text-sm shadow-2xl active:scale-95 transition-all">
            Broadcast Matrix Signal
        </button>
    </div>

    <script>
        const config = { databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com" };
        firebase.initializeApp(config);
        const db = firebase.database();

        let src = 'IRT', tar = 'USDT';

        db.ref('.info/connected').on('value', s => {
            document.getElementById('status').className = s.val() ? 'w-3 h-3 bg-emerald-500 rounded-full animate-pulse' : 'w-3 h-3 bg-red-500 rounded-full';
        });

        function setSource(a) { 
            src = a; 
            document.querySelectorAll('#source-group .asset-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`src-${a}`).classList.add('active');
            updateLabels();
        }
        function setTarget(a) { 
            tar = a; 
            document.querySelectorAll('#target-group .asset-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tar-${a}`).classList.add('active');
            updateLabels();
        }
        function updateLabels() {
            document.getElementById('cap-label').innerText = `مقدار موجودی ${src}`;
            document.getElementById('ref-label').innerText = `نرخ تبدیل (1 ${src} چند ${tar} است؟)`;
        }

        async function transmit() {
            const btn = document.getElementById('mainBtn');
            const cap = parseFloat(document.getElementById('cap').value);
            const ref = parseFloat(document.getElementById('ref').value);
            const gap = parseFloat(document.getElementById('gap').value) / 100;
            const fee = parseFloat(document.getElementById('fee').value) / 100;

            if(!cap || !ref || src === tar) return alert("خطا در انتخاب دارایی یا مقدار");

            btn.disabled = true; btn.innerText = "PROCESSING MATRIX...";

            const weights = [0.2, 0.3, 0.5];
            let tiers = []; let tV = 0, tQ = 0;

            weights.forEach((w, i) => {
                // Ladder Logic: We want to get MORE Target for our Source (Buy Target low)
                let p = ref * (1 - (gap * i));
                let v = cap * w;
                let q = v * p; // Converting Source to Target
                
                tV += v; tQ += q;
                tiers.push({ p: p.toLocaleString(), v: v.toFixed(2), q: q.toFixed(tar === 'BTC' ? 6 : 2) });
            });

            const vwap = tQ / tV;
            const targets = [0.02, 0.04, 0.06, 0.1].map(t => (vwap * (1 + t + fee)).toFixed(tar === 'BTC' ? 2 : 0));

            const signal = {
                path: `${src} > ${tar}`,
                src, tar, vwap: vwap.toFixed(tar === 'BTC' ? 2 : 0),
                tiers, targets, timestamp: new Date().toLocaleTimeString('fa-IR'), active: true
            };

            await db.ref(`stealth_matrix/${src}_TO_${tar}`).set(signal);
            btn.innerText = "SIGNAL BROADCASTED";
            setTimeout(() => { btn.disabled = false; btn.innerText = "Broadcast Matrix Signal"; }, 1500);
        }

        setSource('IRT'); setTarget('USDT');
    </script>
</body>
</html>
