<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Quant Master Admin | Cloud Ready</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body { background: #010409; color: #c9d1d9; font-family: 'Vazirmatn'; }
        .glass { background: #0d1117; border: 1px solid #30363d; border-radius: 20px; }
        .input-q { background: #010409; border: 1px solid #30363d; color: #58a6ff; font-family: monospace; border-radius: 12px; }
        .input-q:focus { border-color: #1f6feb; outline: none; box-shadow: 0 0 10px rgba(31,111,235,0.2); }
        .btn-fire { background: linear-gradient(135deg, #238636, #2ea043); transition: 0.3s; }
        .btn-fire:hover { filter: brightness(1.2); transform: translateY(-1px); }
        .btn-reset { border: 1px solid #f85149; color: #f85149; transition: 0.3s; }
        .btn-reset:hover { background: rgba(248, 81, 73, 0.1); }
    </style>
</head>
<body class="p-4 md:p-10">
    <div class="max-w-xl mx-auto glass p-8 space-y-6 border-t-4 border-emerald-500 shadow-2xl">
        <div class="text-center">
            <h1 class="text-2xl font-black text-white italic">QUANT COMMAND <span class="text-emerald-500">v16</span></h1>
            <p class="text-[10px] text-gray-500 font-bold mt-1 uppercase tracking-widest">Global Cloud Synchronization</p>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block mr-1 font-bold">سرمایه (تومان/تتر)</label>
                <input type="number" id="cap" class="w-full input-q p-4 text-xl font-bold" placeholder="0">
            </div>
            <div>
                <label class="text-[10px] text-gray-500 mb-1 block mr-1 font-bold">قیمت مرجع نوبیتکس</label>
                <input type="number" id="ref" class="w-full input-q p-4 text-xl font-bold" placeholder="0">
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <input type="number" id="gap" class="input-q p-3 text-center" value="1.5" step="0.1">
            <input type="number" id="fee" class="input-q p-3 text-center" value="0.25" step="0.01">
            <select id="mode" class="input-q p-3 text-center bg-black text-white font-bold cursor-pointer">
                <option value="BUY">MODE: BUY</option>
                <option value="SELL">MODE: SELL</option>
            </select>
        </div>

        <button onclick="transmitToCloud()" id="sendBtn" class="w-full btn-fire py-5 rounded-2xl text-white font-black shadow-xl uppercase tracking-widest text-sm">
            CALCULATE & PUSH SIGNAL
        </button>

        <button onclick="resetCloud()" class="w-full btn-reset py-3 rounded-xl text-[10px] font-bold uppercase tracking-widest">
            Reset All Cloud Data
        </button>

        <div id="status-box" class="text-center p-3 rounded-lg bg-black/40 border border-white/5">
            <p id="status" class="text-[10px] font-mono text-gray-500 uppercase">Engine Status: Idle</p>
        </div>
    </div>

    <script>
        // 1. Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDnTDnLIOwORgu6LpYjj3jHbMDk8v-MVjg",
            authDomain: "sellusd-ea252.firebaseapp.com",
            databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com",
            projectId: "sellusd-ea252",
            storageBucket: "sellusd-ea252.firebasestorage.app"
        };

        // 2. Initialize Firebase safely
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            console.log("Firebase initialized successfully");
        } catch (error) {
            console.error("Firebase init error:", error);
            document.getElementById('status').innerText = "ERROR: FIREBASE INIT FAILED";
        }

        const database = firebase.database();

        // 3. Main Function
        async function transmitToCloud() {
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('status');
            
            const cap = parseFloat(document.getElementById('cap').value);
            const ref = parseFloat(document.getElementById('ref').value);
            const gap = parseFloat(document.getElementById('gap').value) / 100;
            const fee = parseFloat(document.getElementById('fee').value) / 100;
            const mode = document.getElementById('mode').value;

            if (!cap || !ref) {
                alert("لطفاً سرمایه و قیمت مرجع را وارد کنید.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "TRANSMITTING...";
            status.innerText = "PREPARING SIGNAL...";

            const weights = [0.2, 0.3, 0.5];
            let tiers = []; let tVol = 0; let tQty = 0;

            weights.forEach((w, i) => {
                let p = mode === 'BUY' ? ref * (1 - (gap * i)) : ref * (1 + (gap * i));
                let v = mode === 'BUY' ? cap * w : (cap * w) * p;
                let q = mode === 'BUY' ? v / p : cap * w;
                tVol += v; tQty += q;
                tiers.push({ p: Math.ceil(p), v: Math.round(v), q: q.toFixed(2) });
            });

            const vwap = tVol / tQty;
            const targets = [0.01, 0.02, 0.03, 0.05].map(t => {
                return Math.ceil(mode === 'BUY' ? vwap * (1 + t + (fee*2)) : vwap * (1 - t - (fee*2)));
            });

            const signal = {
                mode: mode,
                vwap: Math.ceil(vwap),
                tiers: tiers,
                targets: targets,
                timestamp: new Date().toLocaleTimeString('fa-IR')
            };

            const path = mode === 'BUY' ? 'signals/buy' : 'signals/sell';

            try {
                await database.ref(path).set(signal);
                status.innerText = `SUCCESS: ${mode} SENT AT ${signal.timestamp}`;
                status.className = "text-[10px] font-mono text-emerald-500 font-bold";
            } catch (error) {
                console.error("Send error:", error);
                status.innerText = "CLOUD ERROR: CHECK INTERNET / VPN";
                status.className = "text-[10px] font-mono text-rose-500 font-bold";
            } finally {
                btn.disabled = false;
                btn.innerText = "CALCULATE & PUSH SIGNAL";
            }
        }

        function resetCloud() {
            if (confirm("کل دیتابیس مانیتورینگ پاک شود؟")) {
                database.ref('signals').remove()
                    .then(() => {
                        document.getElementById('status').innerText = "ALL CLOUD DATA RESET";
                        alert("دیتابیس پاکسازی شد.");
                    })
                    .catch(e => alert("خطا در پاکسازی: " + e.message));
            }
        }
    </script>
</body>
</html>
