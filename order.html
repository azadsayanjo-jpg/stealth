<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Quant Admin | Cloud Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background: #010409; color: #c9d1d9; font-family: 'Vazirmatn'; }
        .glass { background: #0d1117; border: 1px solid #30363d; border-radius: 20px; }
        .input-q { background: #010409; border: 1px solid #30363d; color: #58a6ff; font-family: monospace; border-radius: 12px; }
        .btn-fire { background: linear-gradient(135deg, #1f6feb, #38bdf8); font-weight: 900; transition: 0.3s; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-xl mx-auto glass p-8 space-y-6">
        <h1 class="text-xl font-black text-center text-blue-400">CLOUD CONTROL CENTER</h1>
        
        <div class="grid grid-cols-2 gap-4">
            <input type="number" id="cap" class="input-q p-4 text-xl font-bold" placeholder="سرمایه">
            <input type="number" id="ref" class="input-q p-4 text-xl font-bold" placeholder="قیمت مرجع">
        </div>

        <div class="grid grid-cols-3 gap-4">
            <input type="number" id="gap" class="input-q p-3 text-center" value="1.5">
            <input type="number" id="fee" class="input-q p-3 text-center" value="0.25">
            <select id="mode" class="input-q p-3 text-center bg-black text-white font-bold">
                <option value="BUY">MODE: BUY</option>
                <option value="SELL">MODE: SELL</option>
            </select>
        </div>

        <button onclick="transmitToCloud()" id="sendBtn" class="w-full btn-fire py-5 rounded-2xl text-white shadow-xl uppercase tracking-widest">
            CALCULATE & PUSH TO CLOUD
        </button>
        <p id="status" class="text-center text-[10px] font-mono text-gray-600 italic uppercase">Firebase Engine: Ready</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDnTDnLIOwORgu6LpYjj3jHbMDk8v-MVjg",
            authDomain: "sellusd-ea252.firebaseapp.com",
            databaseURL: "https://sellusd-ea252-default-rtdb.firebaseio.com",
            projectId: "sellusd-ea252",
            storageBucket: "sellusd-ea252.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function transmitToCloud() {
            const cap = parseFloat(document.getElementById('cap').value);
            const ref = parseFloat(document.getElementById('ref').value);
            const gap = parseFloat(document.getElementById('gap').value) / 100;
            const fee = parseFloat(document.getElementById('fee').value) / 100;
            const mode = document.getElementById('mode').value;

            if(!cap || !ref) return;

            const weights = [0.2, 0.3, 0.5];
            let tiers = []; let tVol = 0; let tQty = 0;

            weights.forEach((w, i) => {
                let p = mode === 'BUY' ? ref * (1 - (gap * i)) : ref * (1 + (gap * i));
                let v = mode === 'BUY' ? cap * w : (cap * w) * p;
                let q = mode === 'BUY' ? v / p : cap * w;
                tVol += v; tQty += q;
                tiers.push({ p: Math.ceil(p), v: Math.round(v), q: q.toFixed(2) });
            });

            const vwap = tVol / tQty;
            const targets = [0.01, 0.02, 0.03, 0.05].map(t => {
                return Math.ceil(mode === 'BUY' ? vwap * (1 + t + (fee*2)) : vwap * (1 - t - (fee*2)));
            });

            const signal = {
                mode: mode, vwap: Math.ceil(vwap), tiers: tiers,
                targets: targets, timestamp: new Date().toLocaleTimeString('fa-IR')
            };

            document.getElementById('sendBtn').innerText = "SENDING...";
            
            // ذخیره در Firebase (جایگزین کردن سیگنال قبلی در شاخه مربوطه)
            database.ref('active_signal').set(signal).then(() => {
                document.getElementById('status').innerText = `SENT: ${mode} @ ${signal.timestamp}`;
                document.getElementById('sendBtn').innerText = "CALCULATE & PUSH TO CLOUD";
            });
        }
    </script>
</body>
</html>
