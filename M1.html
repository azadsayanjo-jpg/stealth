<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital | Dashboard Pro</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg: #010204; --surface: rgba(15, 22, 36, 0.98); --border: rgba(0, 242, 255, 0.15);
            --accent: #00f2ff; --gold: #ffcc00; --success: #00ffa3; --danger: #ff4d4d;
            --warning: #ff9f43; --text-main: #ffffff; --text-sub: #94a3b8; --font: 'Vazirmatn', sans-serif;
        }
        * { box-sizing: border-box; font-family: var(--font) !important; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 10px; overflow-x: hidden; }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; 
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px; margin-bottom: 20px;
        }
        
        /* انیمیشن نبض برای وضعیت فعال */
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(0, 242, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 242, 255, 0); }
        }
        .active-pulse { animation: pulse-glow 2s infinite; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 20px; position: relative; }
        
        /* بخش نمودار */
        .chart-card { 
            background: var(--surface); border: 1px solid var(--border); 
            padding: 15px; border-radius: 20px; margin-bottom: 20px; height: 200px;
        }

        .stat-label { font-size: 0.7rem; color: var(--text-sub); font-weight: bold; display: block; margin-bottom: 8px; }
        .stat-value { font-size: 1.3rem; font-weight: 900; line-height: 1.2; }
        .stat-sub { font-size: 0.75rem; color: var(--text-sub); margin-top: 4px; }

        .market-status-pill { 
            display: inline-block; padding: 4px 12px; border-radius: 8px; font-size: 0.7rem; 
            font-weight: 900; margin-top: 12px; border: 1px solid; letter-spacing: 1px;
            transition: 0.3s;
        }

        .assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
        .asset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 18px; cursor: pointer; transition: 0.3s; }
        .asset-card:hover { border-color: var(--accent); transform: translateY(-3px); }
        
        .profit-badge {
            background: rgba(0, 255, 163, 0.05); border: 1px dashed var(--success);
            padding: 8px; border-radius: 12px; margin: 12px 0;
            display: flex; justify-content: space-between; align-items: center;
        }

        .dual-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .bar-group { background: rgba(0,0,0,0.3); padding: 8px; border-radius: 12px; }
        .bar-bg { height: 5px; background: #000; border-radius: 10px; margin-top: 6px; overflow: hidden; }
        .bar-fill { height: 100%; transition: 1.5s ease-out; }

        #chart-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div id="chart-modal">
        <div style="width: 95%; height: 90%; background: #000; border-radius: 20px; position: relative; border: 1px solid var(--border);">
            <button style="position:absolute; top:-45px; left:0; background:var(--danger); color:#fff; border:none; padding:8px 20px; border-radius:10px; cursor:pointer;" onclick="closeChart()">بستن ×</button>
            <div id="tradingview-widget" style="height: 100%;"></div>
        </div>
    </div>

    <header>
        <div>
            <h1 style="color: var(--accent); font-size: 1.1rem; margin: 0; letter-spacing: 1px;">StealthCapital v1.2</h1>
            <div id="strat-text" class="admin-note-header" style="font-size: 0.85rem; color: var(--success); font-weight: bold; margin-top: 5px;">...</div>
        </div>
        <div style="text-align: left;">
            <div id="live-clock" style="font-size: 1.3rem; font-weight: 900; font-family: monospace; color: var(--accent);">00:00:00</div>
            <div style="font-size: 0.6rem; color: var(--text-sub); font-weight: bold;">LIVE MONITOR</div>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">💰 CURRENT BALANCE</span>
            <div id="total-usd" class="stat-value" style="color: var(--success);">$0</div>
            <div id="total-irt" class="stat-sub">0 تومان</div>
            <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:8px;">
                <span class="stat-label">تحقق کل مسیر <span id="days-forecast" style="color:var(--accent); float:left; font-size:1rem;">---</span></span>
                <div id="total-progress" class="stat-value" style="color: var(--gold); font-size: 1.1rem;">0%</div>
            </div>
        </div>

        <div class="stat-card" style="border-right: 4px solid var(--warning);">
            <span class="stat-label">🏁 REMAINING TO GOAL</span>
            <div id="gap-usd" class="stat-value" style="color: var(--warning);">$0</div>
            <div id="gap-irt" class="stat-sub">0 تومان مانده</div>
            <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:8px;">
                <span class="stat-label">هدف نهایی: <span id="final-target-usd" style="color:var(--accent)">$0</span></span>
                <div id="final-target-irt" class="stat-sub" style="color:var(--text-main); font-weight:bold;">0 تومان</div>
                <div id="gap-percent-label" style="font-size: 0.65rem; color: var(--danger); margin-top:2px;">0% مانده</div>
            </div>
        </div>

        <div id="sentiment-card" class="stat-card">
            <span class="stat-label">🚀 AI SUGGESTION</span>
            <div id="market-status-text" class="stat-value" style="font-size: 1rem; height: 24px; overflow: hidden;">...</div>
            <div id="market-status-pill" class="market-status-pill">STATUS</div>
            
            <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:8px;">
                <div style="display: flex; justify-content: space-between;">
                    <div style="width: 48%;">
                        <span class="stat-label">1% SPRINT VALUE</span>
                        <div id="sprint-usd" style="font-weight: 900; color: #fff; font-size:0.9rem;">$0</div>
                        <div id="sprint-irt" style="font-size: 0.65rem; color: var(--text-sub);">0 تومان</div>
                    </div>
                    <div style="width: 48%; text-align: left;">
                        <span class="stat-label">خرید پیشنهادی</span>
                        <div id="mission-text" style="color: var(--gold); font-weight: 900; font-size: 0.85rem;">---</div>
                        <div id="purchase-power" style="font-size: 0.65rem; color: var(--success); font-weight: bold;">0 واحد</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="chart-card">
        <canvas id="balanceChart"></canvas>
    </div>

    <div id="asset-root" class="assets-grid"></div>

<script>
    const firebaseConfig = { databaseURL: "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('StealthCapital_V1');

    let prices = {};
    let localDB = [];
    let localCfg = { toman: 70000, type: '', note: '' };
    
    // تنظیمات نمودار
    let chartData = { labels: [], datasets: [{ label: 'Total Balance ($)', data: [], borderColor: '#00f2ff', tension: 0.4, fill: true, backgroundColor: 'rgba(0, 242, 255, 0.05)' }] };
    let myChart;

    function initChart() {
        const ctx = document.getElementById('balanceChart').getContext('2d');
        myChart = new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: { size: 10 } } }
                }
            }
        });
    }

    function openChart(symbol) {
        document.getElementById('chart-modal').style.display = 'flex';
        let clean = symbol.replace("USDT", "").toUpperCase();
        document.getElementById('tradingview-widget').innerHTML = `<iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:${clean}USDT&interval=D&theme=dark" style="width: 100%; height: 100%; border: none;"></iframe>`;
    }
    function closeChart() { document.getElementById('chart-modal').style.display = 'none'; }

    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            localDB = data.db || [];
            localCfg = data.config || localCfg;
            updatePrices();
        }
    });

    async function updatePrices() {
        try {
            const r = await fetch('https://api.binance.com/api/v3/ticker/price');
            const data = await r.json();
            data.forEach(d => prices[d.symbol] = parseFloat(d.price));
            prices['USDT'] = 1;
            render();
        } catch(e) { render(); }
    }

    function render() {
        const root = document.getElementById('asset-root');
        const rate = localCfg.toman;
        root.innerHTML = '';
        let tAct = 0, tFut = 0, candidates = [];

        localDB.forEach(item => {
            const sym = item.sym.toUpperCase();
            const p = prices[sym + "USDT"] || prices[sym] || 0;
            const curUSD = (parseFloat(item.qty) || 0) * p;
            const targetUSD = (parseFloat(item.tqty) || 0) * (parseFloat(item.tprice) || 0);
            
            tAct += curUSD; tFut += targetUSD;
            const acc = item.tqty > 0 ? (item.qty / item.tqty) * 100 : 0;
            const tai = targetUSD > 0 ? (curUSD / targetUSD) * 100 : 0;

            if (acc < 99) candidates.push({ name: item.name, sym: sym, acc: acc, price: p });

            root.innerHTML += `
                <div class="asset-card" onclick="openChart('${item.sym}')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b style="color:var(--accent); font-size:1.1rem;">${item.name}</b>
                        <span style="font-family:monospace; color:var(--success); font-weight:900;">$${p.toLocaleString()}</span>
                    </div>
                    <div style="margin: 10px 0;">
                        <div style="font-size:1.5rem; font-weight:900;">$${curUSD.toLocaleString()}</div>
                        <div style="font-size:0.8rem; color:var(--text-sub);">≈ ${(curUSD * rate).toLocaleString()} تومان</div>
                    </div>
                    <div class="profit-badge">
                        <span style="font-size:0.7rem; color:var(--text-sub);">پتانسیل سود:</span>
                        <span style="font-size:0.9rem; font-weight:900; color:var(--success);">+$${Math.max(targetUSD - curUSD, 0).toLocaleString()}</span>
                    </div>
                    <div class="dual-bars">
                        <div class="bar-group"><div style="display:flex; justify-content:space-between; font-size:0.6rem;"><span>انباشت</span><span>${acc.toFixed(0)}%</span></div><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(acc,100)}%; background:var(--accent);"></div></div></div>
                        <div class="bar-group"><div style="display:flex; justify-content:space-between; font-size:0.6rem;"><span>TAI</span><span>${tai.toFixed(0)}%</span></div><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(tai,100)}%; background:var(--gold);"></div></div></div>
                    </div>
                </div>`;
        });

        // بروزرسانی آمار کل
        const gapUSD = Math.max(tFut - tAct, 0);
        const progressPercent = (tFut > 0 ? (tAct / tFut) * 100 : 0);
        const sprintUSD = tFut / 100;

        document.getElementById('total-usd').innerText = '$' + tAct.toLocaleString();
        document.getElementById('total-irt').innerText = (tAct * rate).toLocaleString() + ' تومان';
        document.getElementById('total-progress').innerText = progressPercent.toFixed(2) + '%';
        document.getElementById('gap-usd').innerText = '$' + gapUSD.toLocaleString();
        document.getElementById('gap-irt').innerText = (gapUSD * rate).toLocaleString() + ' تومان';
        document.getElementById('final-target-usd').innerText = '$' + tFut.toLocaleString();
        document.getElementById('final-target-irt').innerText = (tFut * rate).toLocaleString() + ' تومان';
        document.getElementById('gap-percent-label').innerText = (100 - progressPercent).toFixed(2) + '% مانده تا هدف نهایی';
        document.getElementById('sprint-usd').innerText = '$' + sprintUSD.toLocaleString();
        document.getElementById('sprint-irt').innerText = (sprintUSD * rate).toLocaleString() + ' تومان';

        // بروزرسانی نمودار
        if(myChart && tAct > 0) {
            const now = new Date().toLocaleTimeString('fa-IR');
            if(chartData.labels.length > 2000) { chartData.labels.shift(); chartData.datasets[0].data.shift(); }
            chartData.labels.push(now);
            chartData.datasets[0].data.push(tAct);
            myChart.update();
        }

        const estDays = Math.ceil((100 - progressPercent) * 1.8);
        document.getElementById('days-forecast').innerText = `~ ${estDays} روز تا هدف`;

        candidates.sort((a,b) => a.acc - b.acc);
        if(candidates.length > 0) {
            const topCand = candidates[0];
            document.getElementById('mission-text').innerText = '🎯 خرید ' + topCand.name;
            const units = topCand.price > 0 ? (sprintUSD / topCand.price).toFixed(4) : 0;
            document.getElementById('purchase-power').innerText = `خرید ${units} واحد با بودجه ۱٪`;
        }

        document.getElementById('strat-text').innerText = localCfg.note || "در انتظار پیام مدیریت...";
        
        const mText = document.getElementById('market-status-text');
        const mPill = document.getElementById('market-status-pill');
        const type = (localCfg.type || "نامشخص");
        mText.innerText = type;
        
        let sColor = "#00f2ff";
        if(type.includes("تکمیل شد")) {
            sColor = "#00ffa3";
            mPill.classList.remove('active-pulse');
        } else if(type.includes("در حال تکمیل")) {
            sColor = "#ffcc00";
            mPill.classList.add('active-pulse'); // فعال کردن نبض
        }
        
        mText.style.color = sColor;
        mPill.style.borderColor = sColor;
        mPill.style.color = sColor;
        mPill.innerText = type.includes("تکمیل شد") ? "HOLDING" : "ACTIVE";
    }

    initChart();
    setInterval(updatePrices, 3000);
    setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('fa-IR'); }, 1000);
</script>
</body>
</html>
