<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital v1 | Monitor</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #010204; --surface: rgba(15, 22, 36, 0.98); --border: rgba(0, 242, 255, 0.3);
            --accent: #00f2ff; --gold: #ffcc00; --success: #00ffa3; --amber: #ffbf00;
            --text-main: #ffffff; --text-sub: #cbd5e1; --font: 'Vazirmatn', sans-serif;
        }
        * { box-sizing: border-box; font-family: var(--font) !important; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 15px; }
        header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 20px; padding: 15px 25px; background: var(--surface); border: 2px solid var(--border); border-radius: 25px; margin-bottom: 20px; }
        .admin-header-note { background: rgba(255, 255, 255, 0.05); border-right: 3px solid var(--accent); padding: 8px 15px; border-radius: 10px; font-size: 0.95rem; font-weight: 800; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 18px; border-radius: 22px; }
        .stat-label { font-size: 0.75rem; color: var(--accent); font-weight: bold; }
        .stat-value { font-size: 1.6rem; font-weight: 900; }
        .assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .asset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 25px; padding: 22px; }
        .ac-price { font-family: monospace; color: var(--success); font-weight: 900; }
        .dual-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .bar-bg { height: 6px; background: #000; border-radius: 10px; overflow: hidden; margin-top: 5px; }
        .bar-fill { height: 100%; transition: 1.2s; }
        #live-clock { font-size: 1.6rem; font-weight: 900; color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="header-brand">
            <h1 style="margin:0; font-size:1rem;">STEALTH CAPITAL V1</h1>
            <span id="market-status" style="font-size:0.7rem; font-weight:900;">...</span>
        </div>
        <div class="admin-header-note" id="strat-text">در حال اتصال به شبکه...</div>
        <div id="live-clock">00:00:00</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><span class="stat-label">ارزش پورتفو</span><div id="total-usd" class="stat-value" style="color: var(--success);">$0</div></div>
        <div class="stat-card"><span class="stat-label">هدف نهایی</span><div id="target-wealth" class="stat-value" style="color: var(--gold);">$0</div></div>
        <div class="stat-card"><span class="stat-label">گپ تا هدف</span><div id="target-gap" class="stat-value" style="color: var(--amber);">$0</div></div>
        <div class="stat-card"><span class="stat-label">تکمیل شده</span><div id="total-progress" class="stat-value">0%</div></div>
    </div>

    <div id="asset-root" class="assets-grid"></div>

<script>
    const firebaseConfig = { databaseURL: "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('v1_data');

    let prices = {};
    let localDB = [];
    let localCfg = {};

    // گوش دادن به تغییرات فایربیس
    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            localDB = data.db || [];
            localCfg = data.config || {};
            updatePrices(); 
        }
    });

    async function updatePrices() {
        try {
            const r = await fetch('https://api.binance.com/api/v3/ticker/price');
            const data = await r.json();
            data.forEach(d => prices[d.symbol] = parseFloat(d.price));
            prices['USDT'] = 1;
            render();
        } catch(e) { render(); }
    }

    function render() {
        const root = document.getElementById('asset-root');
        root.innerHTML = '';
        let tAct = 0, tFut = 0;

        localDB.forEach(item => {
            const p = prices[item.sym + "USDT"] || prices[item.sym] || 0;
            const curUSD = item.qty * p;
            const futUSD = item.tqty * item.tprice;
            tAct += curUSD; tFut += futUSD;

            const qtyP = Math.min((item.qty / item.tqty) * 100 || 0, 100);
            const prcP = Math.min((p / item.tprice) * 100 || 0, 100);

            root.innerHTML += `
                <div class="asset-card">
                    <div style="display:flex; justify-content:space-between;">
                        <b>${item.name}</b>
                        <span class="ac-price">$${p.toLocaleString()}</span>
                    </div>
                    <div style="font-size:1.8rem; font-weight:900; margin:10px 0;">$${curUSD.toLocaleString()}</div>
                    <div class="dual-bars">
                        <div>
                            <small>موجودی ${qtyP.toFixed(0)}%</small>
                            <div class="bar-bg"><div class="bar-fill" style="width:${qtyP}%; background:var(--accent)"></div></div>
                        </div>
                        <div>
                            <small>تارگت قیمت ${prcP.toFixed(0)}%</small>
                            <div class="bar-bg"><div class="bar-fill" style="width:${prcP}%; background:var(--gold)"></div></div>
                        </div>
                    </div>
                </div>`;
        });

        document.getElementById('total-usd').innerText = '$' + tAct.toLocaleString();
        document.getElementById('target-wealth').innerText = '$' + tFut.toLocaleString();
        document.getElementById('target-gap').innerText = '$' + Math.max(tFut - tAct, 0).toLocaleString();
        document.getElementById('total-progress').innerText = ((tAct / tFut) * 100 || 0).toFixed(1) + '%';
        
        document.getElementById('strat-text').innerText = localCfg.note || '';
        const status = document.getElementById('market-status');
        status.innerText = `وضعیت: ${localCfg.type}`;
        status.style.color = localCfg.type === 'صعودی' ? 'var(--success)' : 'var(--amber)';
    }

    setInterval(updatePrices, 10000);
    setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('fa-IR'); }, 1000);
</script>
</body>
</html>
