<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital | Ultra v2.0 - IRT</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg: #010409; --surface: rgba(13, 17, 23, 0.95); --border: rgba(0, 242, 255, 0.1);
            --accent: #00f2ff; --gold: #ffcc00; --success: #00ffa3; --danger: #ff4d4d;
            --warning: #ff9f43; --text-main: #e6edf3; --text-sub: #8b949e; --font: 'Vazirmatn', sans-serif;
        }
        * { box-sizing: border-box; font-family: var(--font) !important; outline: none; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 10px; overflow-x: hidden; }

        header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; 
            background: var(--surface); border: 1px solid var(--border); border-radius: 20px; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .active-pulse { animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 20px; transition: 0.3s ease; }
        .stat-card:hover { border-color: var(--accent); }
        
        .charts-wrapper { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; margin-bottom: 20px; }
        .chart-card { background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 20px; height: 250px; position: relative; }

        .stat-label { font-size: 0.75rem; color: var(--text-sub); font-weight: bold; display: block; margin-bottom: 8px; }
        .stat-value-toman { font-size: 1.6rem; font-weight: 900; line-height: 1.2; color: var(--success); text-shadow: 0 0 15px rgba(0, 255, 163, 0.2); }
        .stat-sub-usd { font-size: 0.85rem; color: var(--text-sub); margin-top: 2px; font-family: monospace; }

        .market-status-pill { 
            display: inline-block; padding: 4px 12px; border-radius: 8px; font-size: 0.7rem; 
            font-weight: 900; margin-top: 12px; border: 1px solid; letter-spacing: 1px;
        }

        .assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
        .asset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 18px; cursor: pointer; transition: 0.3s; }
        .asset-card:hover { background: rgba(255,255,255,0.02); transform: translateY(-3px); border-color: var(--accent); }
        
        .rebalance-box {
            background: rgba(255, 77, 77, 0.05); border: 1px solid rgba(255, 77, 77, 0.2);
            border-radius: 15px; padding: 15px; margin-bottom: 15px; border-right: 4px solid var(--danger);
        }
        .warning-box {
            background: rgba(255, 159, 67, 0.05); border: 1px solid rgba(255, 159, 67, 0.2);
            border-radius: 15px; padding: 15px; margin-bottom: 15px; border-right: 4px solid var(--warning);
        }

        .dual-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .bar-group { background: rgba(0,0,0,0.2); padding: 8px; border-radius: 12px; }
        .bar-bg { height: 4px; background: #000; border-radius: 10px; margin-top: 6px; overflow: hidden; }
        .bar-fill { height: 100%; transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1); }

        #chart-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        
        .sparkline { display: inline-block; width: 60px; height: 20px; margin-right: 10px; vertical-align: middle; }

        @media (max-width: 768px) { .charts-wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body onload="initCharts()">

    <div id="chart-modal">
        <div style="width: 95%; height: 85%; background: #000; border-radius: 25px; position: relative; border: 1px solid var(--border); overflow: hidden;">
            <button style="position:absolute; top:15px; left:15px; background:var(--danger); color:#fff; border:none; padding:10px 25px; border-radius:12px; cursor:pointer; font-weight:900; z-index:11;" onclick="closeChart()">بستن ×</button>
            <div id="tradingview-widget" style="height: 100%;"></div>
        </div>
    </div>

    <header>
        <div>
            <h1 style="color: var(--accent); font-size: 1.2rem; margin: 0; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0,242,255,0.3);">مدیریت سرمایه (StealthCapital)</h1>
            <div id="strat-text" style="font-size: 0.8rem; color: var(--success); font-weight: bold; margin-top: 5px; opacity: 0.8;">در حال همگام‌سازی...</div>
        </div>
        <div style="text-align: left;">
            <div id="live-clock" style="font-size: 1.4rem; font-weight: 900; font-family: monospace; color: var(--accent);">00:00:00</div>
            <div id="jalali-date" style="font-size: 0.65rem; color: var(--text-sub); font-weight: bold; text-align: left;">---</div>
        </div>
    </header>

    <div id="rebalance-area"></div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">💰 موجودی کل (تومان)</span>
            <div id="total-irt" class="stat-value-toman">0 تومان</div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div id="total-usd" class="stat-sub-usd">$0</div>
                <div id="total-pnl" style="font-size:0.8rem; font-weight:bold; font-family:monospace;">---</div>
            </div>
            <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:8px;">
                <span class="stat-label">پیشرفت کل سبد <span id="total-progress" style="color: var(--gold); float:left; font-weight:900;">0%</span></span>
                <div id="days-forecast" style="font-size: 0.7rem; color: var(--accent); font-weight: bold; margin-top:5px;">تحلیل ریتم رشد...</div>
            </div>
        </div>

        <div class="stat-card" style="border-right: 4px solid var(--warning);">
            <span class="stat-label">🏁 مانده تا هدف نهایی</span>
            <div id="gap-irt" class="stat-value-toman" style="color: var(--warning);">0 تومان</div>
            <div id="gap-usd" class="stat-sub-usd">$0</div>
            <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:8px;">
                <span class="stat-label">تارگت: <span id="final-target-irt" style="color:var(--accent); float:left;">0 تومان</span></span>
                <div id="gap-percent-label" style="font-size: 0.65rem; color: var(--danger); margin-top:2px;">0% مانده</div>
            </div>
        </div>

        <div class="stat-card">
            <span class="stat-label">🚀 پله پیشنهادی خرید</span>
            <div id="sprint-irt" class="stat-value-toman" style="color: #fff;">0 تومان</div>
            <div id="sprint-usd" class="stat-sub-usd">$0</div>
            <div style="margin-top:10px; border-top:1px solid var(--border); padding-top:8px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <div id="mission-text" style="color: var(--gold); font-weight: 900; font-size: 0.85rem;">---</div>
                    <div id="purchase-power" style="font-size: 0.65rem; color: var(--success); font-weight: bold;">0 واحد</div>
                </div>
                <div id="market-status-pill" class="market-status-pill">وضعیت</div>
            </div>
        </div>
    </div>

    <div class="charts-wrapper">
        <div class="chart-card">
            <div style="position:absolute; top:10px; right:15px; font-size:0.6rem; color:var(--accent); z-index:1; letter-spacing:1px;">روند تغییرات ارزش (تومان)</div>
            <canvas id="balanceChart"></canvas>
        </div>
        <div class="chart-card">
            <div style="position:absolute; top:10px; right:15px; font-size:0.6rem; color:var(--text-sub); z-index:1;">پراکندگی دارایی‌ها</div>
            <canvas id="allocationChart"></canvas>
        </div>
    </div>

    <div id="asset-root" class="assets-grid"></div>

<script>
    const firebaseConfig = { databaseURL: "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('StealthCapital_V1');

    let prices = {};
    let sparklineData = {};
    let localDB = [];
    let localCfg = { toman: 70000, capacity: 500000000, type: '', note: '' };
    let sparklinesLoaded = false;
    
    let chartData = { 
        labels: [], 
        datasets: [{ 
            label: 'ارزش (تومان)', 
            data: [], 
            borderColor: '#00f2ff', 
            borderWidth: 3,
            tension: 0.4, 
            fill: true, 
            backgroundColor: (context) => {
                const ctx = context.chart.ctx;
                const gradient = ctx.createLinearGradient(0, 0, 0, 200);
                gradient.addColorStop(0, 'rgba(0, 242, 255, 0.15)');
                gradient.addColorStop(1, 'rgba(0, 242, 255, 0)');
                return gradient;
            },
            pointRadius: 0
        }] 
    };
    
    let myChart, pieChart;

    setInterval(() => { 
        const now = new Date();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString('fa-IR');
        document.getElementById('jalali-date').innerText = new Intl.DateTimeFormat('fa-IR', {year:'numeric', month:'long', day:'numeric'}).format(now).toUpperCase();
    }, 1000);

    function initCharts() {
        const ctx = document.getElementById('balanceChart').getContext('2d');
        
        const shadowPlugin = {
            beforeDraw: (chart) => {
                const {ctx} = chart;
                ctx.save();
                ctx.shadowColor = 'rgba(0, 242, 255, 0.6)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;
            },
            afterDraw: (chart) => { chart.ctx.restore(); }
        };

        myChart = new Chart(ctx, {
            type: 'line',
            data: chartData,
            plugins: [shadowPlugin],
            options: { 
                responsive: true, maintainAspectRatio: false, 
                animation: { duration: 2000, easing: 'linear' },
                plugins: { legend: { display: false } },
                scales: { 
                    x: { 
                        display: true, 
                        grid: { display: false },
                        ticks: { color: '#4b5563', font: {size: 9}, maxTicksLimit: 6 }
                    }, 
                    y: { 
                        beginAtZero: false,
                        grid: { color: 'rgba(255,255,255,0.03)', drawBorder: false }, 
                        ticks: { 
                            color: '#4b5563', 
                            font: {size: 9},
                            callback: function(value) {
                                return value >= 1000000 ? (value/1000000).toFixed(1) + 'M' : value.toLocaleString('fa-IR');
                            }
                        },
                        position: 'right'
                    } 
                }
            }
        });

        const ctxPie = document.getElementById('allocationChart').getContext('2d');
        pieChart = new Chart(ctxPie, {
            type: 'doughnut',
            data: { labels: [], datasets: [{ data: [], backgroundColor: ['#00f2ff', '#00ffa3', '#ffcc00', '#ff4d4d', '#a29bfe', '#ff9f43', '#ff9ff3'], borderWidth: 0, hoverOffset: 10 }] },
            options: { 
                responsive: true, maintainAspectRatio: false, cutout: '75%', 
                plugins: { 
                    legend: { display: true, position: 'left', labels: { color: '#8b949e', font: {family: 'Vazirmatn', size: 10}, boxWidth: 12 } } 
                }, 
                animation: { animateRotate: true, duration: 1500 } 
            }
        });
    }

    function openChart(symbol) {
        document.getElementById('chart-modal').style.display = 'flex';
        let clean = symbol.replace("USDT", "").toUpperCase();
        if(clean === 'CASH') clean = 'USDT';
        document.getElementById('tradingview-widget').innerHTML = `<iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:${clean}USDT&interval=D&theme=dark" style="width: 100%; height: 100%; border: none;"></iframe>`;
    }
    function closeChart() { document.getElementById('chart-modal').style.display = 'none'; }

    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if(data) {
            localDB = data.db || [];
            localCfg = data.config || localCfg;
            document.getElementById('strat-text').innerText = localCfg.note || 'سیستم مدیریت سرمایه هوشمند';
            updatePrices();
            
            if(!sparklinesLoaded && localDB.length > 0) {
                fetchSparklines();
                sparklinesLoaded = true;
            }
        }
    });

    async function fetchSparklines() {
        for (const item of localDB) {
            const sym = item.sym.toUpperCase();
            if(sym === 'USDT' || sym === 'CASH') continue;
            try {
                const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}USDT&interval=1d&limit=7`);
                const d = await r.json();
                sparklineData[sym] = d.map(k => parseFloat(k[4]));
            } catch(e) { console.error("Sparkline Error", e); }
        }
        render();
    }

    function createSparklineSVG(data, color) {
        if(!data || data.length === 0) return '';
        const min = Math.min(...data); const max = Math.max(...data);
        const range = max - min || 1;
        const width = 60; const height = 20;
        const points = data.map((d, i) => {
            const x = (i / (data.length - 1)) * width;
            const y = height - ((d - min) / range) * height;
            return `${x},${y}`;
        }).join(' ');
        return `<svg class="sparkline" viewBox="0 -2 ${width} ${height+4}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="${points}"></polyline></svg>`;
    }

    async function updatePrices() {
        if (!localDB.length) return;
        try {
            const res = await Promise.all(localDB.map(async (item) => {
                const sym = item.sym.toUpperCase();
                if (sym === 'USDT' || sym === 'CASH') return { sym: sym, price: 1 };
                try {
                    const r = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${sym}USDT`);
                    const d = await r.json();
                    return { sym: sym, price: parseFloat(d.price) || 0 };
                } catch { return { sym: sym, price: prices[sym] || 0 }; }
            }));
            res.forEach(r => prices[r.sym] = r.price);
            prices['USDT'] = 1;
            prices['CASH'] = 1;
            render();
        } catch(e) { console.error(e); }
    }
    setInterval(updatePrices, 2000);

    function render() {
        const root = document.getElementById('asset-root');
        const rate = parseFloat(localCfg.toman) || 70000;
        let tAct = 0, tFut = 0, tInvestedUSD = 0, candidates = [];
        let catTotals = { safe: 0, growth: 0, risk: 0 };
        let usdtAmount = 0;
        let pieLabels = [], pieShares = [];

        const categoryNames = { safe: 'ایمن (تتر/استیبل)', growth: 'رشد (آلت‌کوین مستعد)', risk: 'پرریسک' };

        root.innerHTML = '';
        localDB.forEach(item => {
            const sym = item.sym.toUpperCase();
            const p = prices[sym] || 0;
            const curUSD = (parseFloat(item.qty) || 0) * p;
            const targetUSD = (parseFloat(item.tqty) || 0) * (parseFloat(item.tprice) || 0);
            
            const bPrice = (item.buyPrice && item.buyPrice > 0) ? parseFloat(item.buyPrice) : p;
            const investedUSD = (parseFloat(item.qty) || 0) * bPrice;
            
            tAct += curUSD; 
            tFut += targetUSD;
            tInvestedUSD += investedUSD;
            
            catTotals[item.cat || 'safe'] += curUSD;
            if (sym === 'USDT' || sym === 'CASH') usdtAmount += curUSD;
            
            if (curUSD > 0) { pieLabels.push(item.name); pieShares.push(curUSD); }

            const acc = (item.tqty > 0) ? (item.qty / item.tqty) * 100 : 0;
            const tai = (targetUSD > 0) ? (curUSD / targetUSD) * 100 : 0;
            
            // PNL for item
            const itemPnlUSD = curUSD - investedUSD;
            const itemPnlIRT = Math.floor(itemPnlUSD * rate);
            const itemPnlColor = itemPnlUSD >= 0 ? 'var(--success)' : 'var(--danger)';
            const itemPnlSign = itemPnlUSD >= 0 ? '+' : '';
            
            const sparkSVG = createSparklineSVG(sparklineData[sym], itemPnlUSD >= 0 ? '#00ffa3' : '#ff4d4d');

            if (acc < 99 && p > 0) candidates.push({ name: item.name, sym: sym, acc: acc, price: p });

            root.innerHTML += `
                <div class="asset-card" onclick="openChart('${sym}')">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <div style="display:flex; align-items:center;">
                            ${sparkSVG}
                            <b style="color:var(--accent); font-size:1.1rem;">${item.name}</b>
                        </div>
                        <b style="color:var(--text-main); font-size:0.85rem; font-family:monospace;">${Math.floor(p * rate).toLocaleString()} ت</b>
                    </div>
                    <div class="stat-value-toman" style="font-size:1.4rem; color:var(--text-main); margin-bottom:2px;">${Math.floor(curUSD * rate).toLocaleString()} ت</div>
                    <div style="display:flex; justify-content:space-between; font-family:monospace; font-size:0.8rem; margin-bottom:12px; color:var(--text-sub);">
                        <span>$${curUSD.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}</span>
                        <span style="color:${itemPnlColor}; font-weight:bold;">${itemPnlSign}${itemPnlIRT.toLocaleString()} ت</span>
                    </div>
                    <div class="dual-bars">
                        <div class="bar-group"><span style="font-size:0.55rem; color:var(--text-sub);">انباشت دارایی ${acc.toFixed(0)}%</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(acc,100)}%; background:var(--accent)"></div></div></div>
                        <div class="bar-group"><span style="font-size:0.55rem; color:var(--text-sub);">شاخص هدف ${tai.toFixed(0)}%</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(tai,100)}%; background:var(--gold)"></div></div></div>
                    </div>
                </div>`;
        });

        let reHTML = '';
        
        // هشدار نقدینگی (Cash Drag)
        const usdtRatio = tAct > 0 ? (usdtAmount / tAct) * 100 : 0;
        if (usdtRatio > 30) {
            reHTML += `<div class="warning-box"><b style="color:var(--warning)">⚠️ هشدار نقدینگی راکد (Cash Drag)</b><div style="font-size:0.8rem; margin-top:3px;">حدود <b style="color:var(--accent)">${usdtRatio.toFixed(1)}%</b> از سبد شما نقد (تتر) است. در صورت تایید شرایط بازار، بخشی از آن را طبق استراتژی سرمایه‌گذاری کنید.</div></div>`;
        } else if (usdtRatio < 5 && tAct > 0) {
            reHTML += `<div class="rebalance-box"><b style="color:var(--danger)">⚠️ هشدار کمبود نقدینگی</b><div style="font-size:0.8rem; margin-top:3px;">موجودی نقد شما بسیار کم است (${usdtRatio.toFixed(1)}%). برای پوشش ریسک و شکار فرصت‌ها در ریزش‌های احتمالی، نقدینگی ایجاد کنید.</div></div>`;
        }

        const rules = { safe: 0.5, growth: 0.35, risk: 0.15 };
        for (let c in rules) {
            const limitUSD = tAct * rules[c];
            if (catTotals[c] > limitUSD && c !== 'safe') {
                const exIRT = Math.floor((catTotals[c] - limitUSD) * rate);
                const catPersianName = categoryNames[c] || c;
                reHTML += `<div class="rebalance-box active-pulse"><b style="color:var(--danger)">⚠️ هشدار مدیریت سبد: دسته ${catPersianName}</b><div style="font-size:0.8rem; margin-top:3px;">مبلغ <b style="color:var(--success)">${exIRT.toLocaleString()} تومان</b> فراتر از حد مجاز است. پیشنهاد: سیو سود و انتقال به دارایی ایمن.</div></div>`;
            }
        }
        document.getElementById('rebalance-area').innerHTML = reHTML;

        // PNL Calculations
        const pnlUSD = tAct - tInvestedUSD;
        const pnlIRT = Math.floor(pnlUSD * rate);
        const pnlPercent = tInvestedUSD > 0 ? (pnlUSD / tInvestedUSD) * 100 : 0;
        const pnlColor = pnlUSD >= 0 ? 'var(--success)' : 'var(--danger)';
        const pnlSign = pnlUSD >= 0 ? '+' : '';

        const progress = tFut > 0 ? (tAct / tFut) * 100 : 0;
        const gapUSD = Math.max(0, tFut - tAct);
        const sprintUSD = tFut / 100;
        const tActIRT = Math.floor(tAct * rate);

        const weeksLeft = (sprintUSD * 2) > 0 ? gapUSD / (sprintUSD * 2) : 0;
        const daysLeft = Math.ceil(weeksLeft * 7);
        if (daysLeft > 0 && daysLeft < 5000) {
            const targetD = new Date(); targetD.setDate(targetD.getDate() + daysLeft);
            const fmt = new Intl.DateTimeFormat('fa-IR', {month:'long', year:'numeric'}).format(targetD);
            document.getElementById('days-forecast').innerHTML = `⏳ <b>${daysLeft.toLocaleString('fa-IR')} روز</b> تا هدف (حدود <b>${fmt}</b>)`;
        }

        document.getElementById('total-irt').innerText = tActIRT.toLocaleString() + ' تومان';
        document.getElementById('total-usd').innerText = '$' + Math.floor(tAct).toLocaleString();
        document.getElementById('total-pnl').innerHTML = `<span style="color:${pnlColor}">${pnlSign}${pnlIRT.toLocaleString()} ت (${pnlSign}${pnlPercent.toFixed(2)}%)</span>`;
        document.getElementById('total-progress').innerText = progress.toFixed(2) + '%';
        
        document.getElementById('gap-irt').innerText = Math.floor(gapUSD * rate).toLocaleString() + ' تومان';
        document.getElementById('gap-usd').innerText = '$' + Math.floor(gapUSD).toLocaleString();
        document.getElementById('final-target-irt').innerText = Math.floor(tFut * rate).toLocaleString() + ' تومان';
        document.getElementById('gap-percent-label').innerText = (100 - progress).toFixed(1) + '% مانده تا پیروزی';
        document.getElementById('sprint-irt').innerText = Math.floor(sprintUSD * rate).toLocaleString() + ' تومان';
        document.getElementById('sprint-usd').innerText = '$' + sprintUSD.toFixed(1);

        if (candidates.length) {
            const top = candidates.sort((a,b) => a.acc - b.acc)[0];
            document.getElementById('mission-text').innerText = `هدف خرید: ${top.name}`;
            document.getElementById('purchase-power').innerText = (sprintUSD / top.price).toFixed(4) + ` واحد ${top.sym}`;
        }

        const pPill = document.getElementById('market-status-pill');
        pPill.innerText = (localCfg.type || "").includes("تکمیل") ? "هولد (نگهداری)" : "انباشت (خرید)";
        pPill.style.color = (localCfg.type || "").includes("تکمیل") ? "var(--success)" : "var(--warning)";

        if (myChart && tActIRT > 0) {
            const now = new Date().toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit', second: '2-digit'});
            if (chartData.labels.length > 2000) { chartData.labels.shift(); chartData.datasets[0].data.shift(); }
            // Only add label if it's different from the last one (avoid too many points per minute)
            if(chartData.labels[chartData.labels.length - 1] !== now) {
                chartData.labels.push(now); 
                chartData.datasets[0].data.push(tActIRT); 
                myChart.update(); 
            }
            pieChart.data.labels = pieLabels; pieChart.data.datasets[0].data = pieShares; pieChart.update();
        }
    }
</script>
</body>
</html>
