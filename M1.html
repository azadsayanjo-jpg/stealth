<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Nikdad v1 | Monitor</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg: #010204; --surface: rgba(15, 22, 36, 0.98); --border: rgba(0, 242, 255, 0.3);
            --accent: #00f2ff; --gold: #ffcc00; --success: #00ffa3; --amber: #ffbf00;
            --text-main: #ffffff; --text-sub: #cbd5e1; --font: 'Vazirmatn', sans-serif;
        }
        * { box-sizing: border-box; font-family: var(--font) !important; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 15px; }

        #chart-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 10000; justify-content: center; align-items: center; }
        .modal-content { width: 98%; height: 92%; background: #000; border: 2px solid var(--accent); border-radius: 20px; overflow: hidden; position: relative; }

        header {
            display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 20px; padding: 15px 25px; 
            background: var(--surface); border: 2px solid var(--border); border-radius: 25px; margin-bottom: 20px;
        }
        .admin-header-note { background: rgba(255, 255, 255, 0.05); border-right: 3px solid var(--accent); padding: 8px 15px; border-radius: 10px; font-weight: 800; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 18px; border-radius: 22px; }
        .stat-value { font-size: 1.6rem; font-weight: 900; }

        .assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .asset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 25px; padding: 22px; cursor: pointer; }
        
        .bar-bg { height: 6px; background: #000; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .bar-fill { height: 100%; transition: 1.2s; }
        .fill-cyan { background: var(--accent); }
        .fill-gold { background: var(--gold); }
        #live-clock { font-size: 1.6rem; font-weight: 900; color: var(--accent); }
    </style>
</head>
<body>

    <div id="chart-modal">
        <div class="modal-content">
            <button style="position:absolute;top:15px;left:15px;z-index:101;background:#ff3366;color:#fff;border:none;padding:10px;border-radius:10px;" onclick="closeChart()">بستن ×</button>
            <div id="tradingview-widget" style="height: 100%; width: 100%;"></div>
        </div>
    </div>

    <header>
        <div>
            <h1 style="margin:0; font-size:1rem; letter-spacing:2px;">NIKDAD CAPITAL V1</h1>
            <span id="market-status" style="font-size:0.7rem;">...</span>
        </div>
        <div class="admin-header-note" id="strat-text">در حال دریافت...</div>
        <div id="live-clock">00:00:00</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><span>ارزش پورتفو</span><div id="total-usd" class="stat-value" style="color:var(--success)">$0</div></div>
        <div class="stat-card"><span>هدف نهایی</span><div id="target-wealth" class="stat-value" style="color:var(--gold)">$0</div></div>
    </div>

    <div id="asset-root" class="assets-grid"></div>

<script>
    let prices = {};
    function openChart(symbol) {
        const modal = document.getElementById('chart-modal');
        modal.style.display = 'flex';
        let clean = symbol.replace("USDT", "").toUpperCase();
        document.getElementById('tradingview-widget').innerHTML = `<iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:${clean}USDT&interval=D&theme=dark" style="width: 100%; height: 100%; border: none;"></iframe>`;
    }
    function closeChart() { document.getElementById('chart-modal').style.display = 'none'; }

    async function update() {
        const cfg = JSON.parse(localStorage.getItem('Wealth_Cfg_V5')) || { toman: 70000, type: 'خنثی', note: '' };
        const db = JSON.parse(localStorage.getItem('Wealth_DB_V5')) || [];
        document.getElementById('strat-text').innerText = cfg.note;

        try {
            const r = await fetch('https://api.binance.com/api/v3/ticker/price');
            const data = await r.json();
            data.forEach(d => prices[d.symbol] = parseFloat(d.price));
            prices['USDT'] = 1;
            render(db, cfg.toman);
        } catch(e) { render(db, cfg.toman); }
    }

    function render(db, rate) {
        const root = document.getElementById('asset-root');
        root.innerHTML = '';
        let tAct = 0, tFut = 0;
        db.forEach(item => {
            const p = prices[item.sym + "USDT"] || prices[item.sym] || 0;
            const curUSD = item.qty * p;
            tAct += curUSD; tFut += (item.tqty * item.tprice);
            const qtyP = Math.min((item.qty / item.tqty) * 100 || 0, 100);
            root.innerHTML += `<div class="asset-card" onclick="openChart('${item.sym}')">
                <b>${item.name}</b> <span style="float:left">$${p.toLocaleString()}</span>
                <div style="font-size:1.8rem; margin:10px 0;">$${curUSD.toLocaleString()}</div>
                <div class="bar-bg"><div class="bar-fill fill-cyan" style="width:${qtyP}%"></div></div>
            </div>`;
        });
        document.getElementById('total-usd').innerText = '$' + tAct.toLocaleString();
        document.getElementById('target-wealth').innerText = '$' + tFut.toLocaleString();
    }
    setInterval(update, 5000);
    setInterval(() => { document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('fa-IR'); }, 1000);
    update();
</script>
</body>
</html>
