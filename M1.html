<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Nikdad v1 | Monitor</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root { --bg: #010204; --surface: rgba(15, 22, 36, 0.98); --accent: #00f2ff; --gold: #ffcc00; --success: #00ffa3; --font: 'Vazirmatn', sans-serif; }
        body { background: var(--bg); color: #fff; padding: 20px; font-family: var(--font); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--surface); padding: 20px; border-radius: 20px; border: 1px solid rgba(0,242,255,0.2); }
        .asset-card { background: var(--surface); padding: 20px; border-radius: 20px; border: 1px solid rgba(0,242,255,0.1); margin-bottom: 10px; }
        .bar-bg { height: 8px; background: #000; border-radius: 10px; margin-top: 10px; overflow: hidden; }
        .bar-fill { height: 100%; background: var(--accent); transition: 1s; }
    </style>
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1 style="font-size: 1.2rem; color: var(--accent);">NIKDAD MONITOR</h1>
        <div id="strat-text" style="font-size: 0.9rem; opacity: 0.8;">در حال دریافت...</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card"><span>ارزش کل پورتفو</span><div id="total-usd" style="font-size: 1.5rem; color: var(--success); font-weight: 900;">$0</div></div>
        <div class="stat-card"><span>هدف نهایی</span><div id="target-wealth" style="font-size: 1.5rem; color: var(--gold); font-weight: 900;">$0</div></div>
    </div>

    <div id="asset-root"></div>

<script>
    const DB_KEY = 'Nikdad_Assets_V1';
    const CFG_KEY = 'Nikdad_Config_V1';
    let prices = {};

    async function update() {
        const db = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        const config = JSON.parse(localStorage.getItem(CFG_KEY)) || { toman: 70000, note: '' };
        document.getElementById('strat-text').innerText = config.note;

        try {
            const r = await fetch('https://api.binance.com/api/v3/ticker/price');
            const data = await r.json();
            data.forEach(d => prices[d.symbol] = parseFloat(d.price));
            prices['USDT'] = 1;
            render(db, config.toman);
        } catch(e) { render(db, config.toman); }
    }

    function render(db, rate) {
        const root = document.getElementById('asset-root');
        root.innerHTML = '';
        let tAct = 0, tFut = 0;

        db.forEach(item => {
            const p = prices[item.sym + "USDT"] || prices[item.sym] || 0;
            const curUSD = item.qty * p;
            tAct += curUSD;
            tFut += (item.tqty * item.tprice);
            const progress = Math.min((item.qty / item.tqty) * 100, 100) || 0;

            root.innerHTML += `
                <div class="asset-card">
                    <div style="display:flex; justify-content:space-between;">
                        <b>${item.name} (${item.sym})</b>
                        <span style="color:var(--success)">$${p.toLocaleString()}</span>
                    </div>
                    <div style="font-size:1.5rem; margin:10px 0;">$${curUSD.toLocaleString()}</div>
                    <div style="font-size:0.8rem;">پیشرفت موجودی: ${progress.toFixed(1)}%</div>
                    <div class="bar-bg"><div class="bar-fill" style="width:${progress}%"></div></div>
                </div>`;
        });
        document.getElementById('total-usd').innerText = '$' + tAct.toLocaleString();
        document.getElementById('target-wealth').innerText = '$' + tFut.toLocaleString();
    }

    setInterval(update, 5000);
    update();
</script>
</body>
</html>
