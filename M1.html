<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StealthCapital | Ultra v2.0 - IRT</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg: #010409; --surface: rgba(13, 17, 23, 0.95); --border: rgba(0, 242, 255, 0.1);
            --accent: #00f2ff; --gold: #ffcc00; --success: #00ffa3; --danger: #ff4d4d;
            --warning: #ff9f43; --text-main: #e6edf3; --text-sub: #8b949e; --font: 'Vazirmatn', sans-serif;
        }
        * { box-sizing: border-box; font-family: var(--font) !important; outline: none; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding: 10px; overflow-x: hidden; }

        header {
            display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
            padding: 15px 25px; background: var(--surface); border: 1px solid var(--border); 
            border-radius: 20px; margin-bottom: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .ticker-wrap {
            background: rgba(0, 242, 255, 0.05); border: 1px solid var(--border);
            border-radius: 12px; margin-bottom: 15px; padding: 10px 0; overflow: hidden; white-space: nowrap;
        }
        .ticker-move {
            display: inline-block; padding-right: 100%; animation: marquee 40s linear infinite;
            color: var(--accent); font-size: 0.95rem; font-weight: 800; text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 20px; transition: 0.3s; position: relative; display: flex; flex-direction: column; justify-content: space-between; min-height: 140px; }
        .stat-card:hover { border-color: var(--accent); }
        
        .charts-wrapper { display: grid; grid-template-columns: 1.5fr 1fr; gap: 15px; margin-bottom: 20px; }
        .chart-card { background: var(--surface); border: 1px solid var(--border); padding: 15px; border-radius: 20px; height: 260px; position: relative; }

        .stat-label { font-size: 0.75rem; color: var(--text-sub); font-weight: bold; margin-bottom: 5px; }
        .stat-value-toman { font-size: 1.5rem; font-weight: 900; color: var(--success); text-shadow: 0 0 15px rgba(0, 255, 163, 0.2); line-height: 1; }

        .fng-bar-container { height: 6px; background: rgba(0,0,0,0.3); border-radius: 10px; margin: 10px 0; overflow: hidden; }
        .fng-bar-fill { height: 100%; transition: 1s ease-in-out; }

        .assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
        .asset-card { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 15px; cursor: pointer; transition: 0.3s; }
        .asset-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        
        .dual-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .bar-group { background: rgba(0,0,0,0.2); padding: 6px; border-radius: 10px; }
        .bar-bg { height: 4px; background: #000; border-radius: 10px; margin-top: 4px; overflow: hidden; }
        .bar-fill { height: 100%; transition: 1s ease; }

        .market-status-pill { padding: 4px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 900; border: 1px solid; }

        @media (max-width: 768px) { header { grid-template-columns: 1fr; } .charts-wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body onload="initApp()">

    <header>
        <div style="text-align: right; display:flex; align-items:center; gap:5px;">
            <input type="text" id="search-user" placeholder="شناسه کاربری..." style="background:#000; border:1px solid var(--accent); color:#fff; padding:6px 10px; border-radius:8px; font-size:0.8rem; outline:none; width: 130px;">
            <button onclick="loadUserMonitor()" style="background:var(--accent); border:none; padding:6px 12px; border-radius:8px; cursor:pointer; font-weight:900;">ورود</button>
        </div>
        <h1 style="color: var(--accent); font-size: 1.2rem; margin: 0; font-weight: 900;">SMB - STEALTHCAPITAL | <span style="color:var(--gold)">PHOENIX</span></h1>
        <div style="text-align: left;">
            <div id="live-clock" style="font-size: 1.2rem; font-weight: 900; color: var(--accent);">00:00:00</div>
            <div id="jalali-date" style="font-size: 0.6rem; color: var(--text-sub);">---</div>
        </div>
    </header>

    <div class="ticker-wrap"><div id="marquee-note" class="ticker-move">در حال بارگذاری داده‌ها...</div></div>
    <div id="rebalance-area"></div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label">💰 موجودی کل</span>
            <div id="total-irt" class="stat-value-toman">0 تومان</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                <div id="total-usd" style="font-size:0.8rem; font-family:monospace; color:var(--text-sub);">$0</div>
                <div id="total-pnl" style="font-size:0.75rem; font-weight:bold;">---</div>
            </div>
            <div style="border-top:1px solid var(--border); padding-top:8px; margin-top:8px;">
                <span style="font-size:0.65rem; color:var(--text-sub);">پیشرفت تا هدف: <b id="total-progress" style="color:var(--gold)">0%</b></span>
                <div id="days-forecast" style="font-size:0.6rem; color:var(--accent); margin-top:2px;">---</div>
            </div>
        </div>

        <div class="stat-card" style="border-right: 4px solid var(--accent);">
            <span class="stat-label">📊 شاخص ترس و طمع</span>
            <div style="display: flex; align-items: center; justify-content:space-between;">
                <div id="fng-value" style="font-size: 2.2rem; font-weight: 900;">--</div>
                <div style="text-align:left;">
                    <div id="fng-status" style="font-size: 0.9rem; font-weight: bold;">--</div>
                    <div id="fng-strategy" style="font-size: 0.55rem; color: var(--gold); border: 1px dashed var(--border); padding: 2px 5px; border-radius: 4px; margin-top:3px;">---</div>
                </div>
            </div>
            <div class="fng-bar-container"><div id="fng-bar" class="fng-bar-fill"></div></div>
        </div>

        <div class="stat-card" style="border-right: 4px solid var(--warning);">
            <span class="stat-label">🏁 مانده تا پیروزی</span>
            <div id="gap-irt" class="stat-value-toman" style="color: var(--warning);">0 ت</div>
            <div id="gap-usd" style="font-size:0.8rem; color:var(--text-sub); font-family:monospace;">$0</div>
            <div style="border-top:1px solid var(--border); padding-top:8px; margin-top:8px;">
                <span style="font-size:0.6rem; color:var(--text-sub);">تارگت نهایی: <b id="final-target-irt" style="color:var(--accent)">0</b></span>
            </div>
        </div>

        <div class="stat-card">
            <span class="stat-label">🚀 پله پیشنهادی</span>
            <div id="sprint-irt" class="stat-value-toman" style="color: #fff;">0 ت</div>
            <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:5px;">
                <div>
                    <div id="mission-text" style="color: var(--gold); font-size: 0.75rem; font-weight: 900;">---</div>
                    <div id="purchase-power" style="font-size: 0.6rem; color: var(--success);">0 واحد</div>
                </div>
                <div id="market-status-pill" class="market-status-pill">---</div>
            </div>
        </div>
    </div>

    <div class="charts-wrapper">
        <div class="chart-card"><canvas id="balanceChart"></canvas></div>
        <div class="chart-card"><canvas id="allocationChart"></canvas></div>
    </div>

    <div id="asset-root" class="assets-grid"></div>

<script>
    const firebaseConfig = { databaseURL: "https://stealthcapital-67eb7-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    let currentOrderRef = null, prices = {}, sparklineData = {}, localDB = [], localCfg = { toman: 70000 };
    let myChart, pieChart;

    setInterval(() => {
        const now = new Date();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString('fa-IR');
        document.getElementById('jalali-date').innerText = new Intl.DateTimeFormat('fa-IR', {year:'numeric', month:'long', day:'numeric'}).format(now);
    }, 1000);

    async function updateFearAndGreed() {
        try {
            const res = await fetch('https://api.alternative.me/fng/');
            const data = await res.json();
            const val = parseInt(data.data[0].value);
            const status = data.data[0].value_classification;
            const elVal = document.getElementById('fng-value');
            const elStatus = document.getElementById('fng-status');
            const elBar = document.getElementById('fng-bar');
            const elStrat = document.getElementById('fng-strategy');
            
            elVal.innerText = val;
            let color = '#ffcc00', textFa = 'خنثی', strat = 'مشاهده بازار';
            if(val <= 25) { color='#ff4d4d'; textFa='ترس شدید'; strat='🔥 بهترین فرصت خرید پله‌ای'; }
            else if(val <= 45) { color='#ff9f43'; textFa='ترس'; strat='⚖️ انباشت هوشمندانه'; }
            else if(val >= 75) { color='#00f2ff'; textFa='طمع شدید'; strat='💰 زمان ذخیره سود'; }
            else if(val >= 55) { color='#00ffa3'; textFa='طمع'; strat='⚠️ ریسک ورود بالاست'; }
            
            elVal.style.color = color; elStatus.innerText = textFa; elStatus.style.color = color;
            elBar.style.backgroundColor = color; elBar.style.width = val + '%';
            elStrat.innerText = strat;
        } catch(e) {}
    }

    function initApp() {
        initCharts();
        updateFearAndGreed();
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('user')) { document.getElementById('search-user').value = urlParams.get('user'); loadUserMonitor(); }
    }

    function loadUserMonitor() {
        const userId = document.getElementById('search-user').value.trim();
        if(!userId) return;
        if(currentOrderRef) currentOrderRef.off();
        currentOrderRef = firebase.database().ref(`StealthCapital_V1/Users/${userId}`);
        currentOrderRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                localDB = data.db || [];
                localCfg = data.config || localCfg;
                document.getElementById('marquee-note').innerText = `👤 پورتفوی ${userId} | 📢 پیام: ` + (localCfg.note || "در انتظار تحلیل...");
                updatePrices();
            }
        });
    }

    function initCharts() {
        myChart = new Chart(document.getElementById('balanceChart').getContext('2d'), {
            type: 'line', data: { labels: [], datasets: [{ label: 'ارزش', data: [], borderColor: '#00f2ff', fill: true, backgroundColor: 'rgba(0, 242, 255, 0.1)', tension: 0.4 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { position: 'right', ticks: { color: '#4b5563', font: { size: 8 } } }, x: { ticks: { color: '#4b5563', font: { size: 8 } } } } }
        });
        pieChart = new Chart(document.getElementById('allocationChart').getContext('2d'), {
            type: 'doughnut', data: { labels: [], datasets: [{ data: [], backgroundColor: ['#00f2ff', '#00ffa3', '#ffcc00', '#ff4d4d', '#a29bfe'] }] },
            options: { responsive: true, maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'left', labels: { color: '#8b949e', font: { size: 9 } } } } }
        });
    }

    async function updatePrices() {
        try {
            const res = await Promise.all(localDB.map(async (item) => {
                const sym = item.sym.toUpperCase();
                if(sym === 'USDT' || sym === 'CASH') return { sym, price: 1 };
                const r = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${sym}USDT`);
                const d = await r.json();
                return { sym, price: parseFloat(d.price) || 0 };
            }));
            res.forEach(r => { if(r.price > 0) prices[r.sym] = r.price; });
            render();
        } catch(e) {}
    }

    function render() {
        const root = document.getElementById('asset-root');
        const rate = parseFloat(localCfg.toman) || 70000;
        let tAct = 0, tFut = 0, tInvestedUSD = 0, candidates = [];
        let pieLabels = [], pieShares = [];

        let tempHTML = '';
        localDB.forEach(item => {
            const sym = item.sym.toUpperCase();
            const bPrice = parseFloat(item.buyPrice) || 0;
            const cPrice = prices[sym] || bPrice || 0;
            const curUSD = (parseFloat(item.qty) || 0) * cPrice;
            const targetUSD = (parseFloat(item.tqty) || 0) * (parseFloat(item.tprice) || 0);
            
            tAct += curUSD; tFut += targetUSD; tInvestedUSD += (parseFloat(item.qty) * bPrice);
            if (curUSD > 0) { pieLabels.push(item.name); pieShares.push(curUSD); }

            const acc = (parseFloat(item.tqty) > 0) ? (parseFloat(item.qty) / parseFloat(item.tqty)) * 100 : 0;
            const tai = (targetUSD > 0) ? (curUSD / targetUSD) * 100 : 0;
            const pnlP = bPrice > 0 ? ((cPrice - bPrice) / bPrice) * 100 : 0;

            if (acc < 99 && cPrice > 0) candidates.push({ name: item.name, sym, acc, price: cPrice });

            tempHTML += `
                <div class="asset-card">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                        <b style="color:var(--accent); font-size:1rem;">${item.name}</b>
                        <div style="text-align:left;">
                            <div style="font-size:0.8rem; font-weight:900; color:#fff;">${Math.floor(cPrice * rate).toLocaleString()} ت</div>
                            <div style="font-size:0.6rem; color:var(--text-sub); font-family:monospace;">$${cPrice.toLocaleString()}</div>
                        </div>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:var(--text-sub); border-bottom:1px solid var(--border); padding-bottom:5px; margin-bottom:8px;">
                        <span>ورود: <b>$${bPrice}</b></span>
                        <span>مخزن: <b>$${item.tank || '0'}</b></span>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div style="font-size:1.3rem; font-weight:900; color:var(--text-main);">${Math.floor(curUSD * rate).toLocaleString()} ت</div>
                        <div style="color:${pnlP >= 0 ? 'var(--success)' : 'var(--danger)'}; font-size:0.75rem; font-weight:bold;">${pnlP >= 0 ? '+' : ''}${pnlP.toFixed(1)}%</div>
                    </div>
                    <div class="dual-bars">
                        <div class="bar-group"><span style="font-size:0.5rem; color:var(--text-sub);">انباشت ${acc.toFixed(0)}%</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(acc,100)}%; background:var(--accent)"></div></div></div>
                        <div class="bar-group"><span style="font-size:0.5rem; color:var(--text-sub);">تارگت ${tai.toFixed(0)}%</span><div class="bar-bg"><div class="bar-fill" style="width:${Math.min(tai,100)}%; background:var(--gold)"></div></div></div>
                    </div>
                </div>`;
        });
        root.innerHTML = tempHTML;

        // Final Totals
        const progress = tFut > 0 ? (tAct / tFut) * 100 : 0;
        const gapUSD = Math.max(0, tFut - tAct);
        const sprintUSD = tFut / 100;

        document.getElementById('total-irt').innerText = Math.floor(tAct * rate).toLocaleString() + ' تومان';
        document.getElementById('total-usd').innerText = '$' + Math.floor(tAct).toLocaleString();
        document.getElementById('total-progress').innerText = progress.toFixed(1) + '%';
        document.getElementById('gap-irt').innerText = Math.floor(gapUSD * rate).toLocaleString() + ' ت';
        document.getElementById('final-target-irt').innerText = Math.floor(tFut * rate).toLocaleString();
        document.getElementById('sprint-irt').innerText = Math.floor(sprintUSD * rate).toLocaleString() + ' ت';
        
        if(candidates.length) {
            const top = candidates.sort((a,b) => a.acc - b.acc)[0];
            document.getElementById('mission-text').innerText = `خرید: ${top.name}`;
            document.getElementById('purchase-power').innerText = (sprintUSD / top.price).toFixed(3) + ` ${top.sym}`;
        }

        const pPill = document.getElementById('market-status-pill');
        pPill.innerText = (localCfg.type || "").includes("تکمیل") ? "هولد" : "خرید پله‌ای";
        pPill.style.color = (localCfg.type || "").includes("تکمیل") ? "var(--success)" : "var(--warning)";

        // Charts update
        if (myChart && tAct > 0) {
            const timeNow = new Date().toLocaleTimeString('fa-IR', {hour:'2-digit', minute:'2-digit'});
            if(myChart.data.labels[myChart.data.labels.length-1] !== timeNow) {
                myChart.data.labels.push(timeNow); myChart.data.datasets[0].data.push(Math.floor(tAct * rate));
                if(myChart.data.labels.length > 20) { myChart.data.labels.shift(); myChart.data.datasets[0].data.shift(); }
                myChart.update();
            }
            pieChart.data.labels = pieLabels; pieChart.data.datasets[0].data = pieShares; pieChart.update();
        }
    }
</script>
</body>
</html>
